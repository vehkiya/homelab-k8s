apiVersion: v1
kind: Pod
metadata:
  name: media-security-probe
  namespace: media
  labels:
    app: plex
    app.kubernetes.io/name: plex
    security-audit: "probe"
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: probe
      image: nicolaka/netshoot:v0.13
      command: ["sleep", "3600"]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
      resources:
        requests:
          cpu: "10m"
          memory: "32Mi"
        limits:
          cpu: "100m"
          memory: "64Mi"
