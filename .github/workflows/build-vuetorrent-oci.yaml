name: Build VueTorrent OCI Artifact

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'VueTorrent version to build (e.g., v2.28.2)'
        required: true
        # renovate: datasource=github-releases depName=VueTorrent/VueTorrent
        default: 'v2.28.2'
  push:
    branches:
      - master
    paths:
      - '.github/workflows/build-vuetorrent-oci.yaml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/vuetorrent

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download and prepare VueTorrent
        run: |
          VERSION="${{ github.event.inputs.version || 'v2.28.2' }}"
          echo "Building VueTorrent version $VERSION"
          
          mkdir -p workspace
          cd workspace
          
          echo "Downloading $VERSION..."
          curl -L -s "https://github.com/VueTorrent/VueTorrent/releases/download/${VERSION}/vuetorrent.zip" -o vuetorrent.zip
          unzip -q vuetorrent.zip
          
          # The zip contains a 'vuetorrent' folder. We want its contents (like 'public') 
          # to be at the root of our OCI artifact.
          mv vuetorrent/* .
          rm -rf vuetorrent vuetorrent.zip
          
          # Create a minimal Dockerfile that uses scratch
          cat << 'EOF' > Dockerfile
          FROM scratch
          COPY . /
          EOF

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: workspace
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.event.inputs.version || 'v2.28.2' }}
