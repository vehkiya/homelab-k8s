name: Build VueTorrent OCI Artifact

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'VueTorrent version to build (defaults to VUETORRENT_VERSION)'
        required: false
  push:
    branches:
      - master
    paths:
      - '.github/workflows/build-vuetorrent-oci.yaml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/vuetorrent
  # renovate: datasource=github-releases depName=VueTorrent/VueTorrent
  VUETORRENT_VERSION: v2.28.2

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to the Container registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download and prepare VueTorrent
        run: |
          VERSION="${{ github.event.inputs.version || env.VUETORRENT_VERSION }}"
          echo "Building VueTorrent version $VERSION"
          
          mkdir -p workspace
          cd workspace
          
          echo "Downloading $VERSION..."
          curl -L -s "https://github.com/VueTorrent/VueTorrent/releases/download/${VERSION}/vuetorrent.zip" -o vuetorrent.zip
          unzip -q vuetorrent.zip
          
          # The zip contains a 'vuetorrent' folder. We want its contents (like 'public') 
          # to be at the root of our OCI artifact.
          mv vuetorrent/* .
          rm -rf vuetorrent vuetorrent.zip
          
          # Create a minimal Dockerfile that uses scratch
          cat << 'EOF' > Dockerfile
          FROM scratch
          COPY . /
          EOF

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: workspace
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.event.inputs.version || env.VUETORRENT_VERSION }}
