apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bar-app-httproute
spec:
  parentRefs:
    - name: internal-gateway
      namespace: traefik
  hostnames:
    - "bar.kerrlab.app"
  rules:
    # Rule 1: Static Photos & Uploads (CACHED)
    - matches:
        - path:
            type: PathPrefix
            value: /storage
        - path:
            type: PathPrefix
            value: /uploads
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: http-cache
      backendRefs:
        - name: bar-assistant
          port: 8080
    # Rule 2: Frontend Static Assets (COMPRESSED)
    - matches:
        - path:
            type: PathPrefix
            value: /assets
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: compress
      backendRefs:
        - name: salt-rim
          port: 8080
    # Rule 3: Dynamic REST API (DIRECT / UNCACHED)
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: bar-assistant
          port: 8080
    # Rule 4: Frontend App Shell (UNCACHED / COMPRESSED)
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: compress
      backendRefs:
        - name: salt-rim
          port: 8080
