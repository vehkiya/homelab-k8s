apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bar-assistant-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-store
    kind: ClusterSecretStore
  target:
    name: bar-assistant-secrets
    creationPolicy: Owner
  data:
    - secretKey: AUTHELIA_CLIENT_SECRET
      remoteRef:
        key: home/bar-assistant
        property: AUTHELIA_CLIENT_SECRET
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: home/bar-assistant
        property: REDIS_PASSWORD
    - secretKey: GEMINI_API_KEY
      remoteRef:
        key: home/bar-assistant
        property: GEMINI_API_KEY
