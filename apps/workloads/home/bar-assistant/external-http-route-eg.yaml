# Envoy Gateway copy of bar-app-external-route (migration); the Traefik route stays until cutover
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bar-app-external-route-eg
spec:
  parentRefs:
    - name: external-gateway
      namespace: edge
      sectionName: dmz
  hostnames:
    - "bar.kerrlab.app"
  rules:
    - matches:
        # Full-match regex: Laravel routes /api/bars/ like /api/bars
        - path:
            type: RegularExpression
            value: /api/bars/?
          method: POST
      filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: bar-assistant-block-post-bars
      backendRefs:
        - name: bar-assistant
          port: 8080
    # Upload paths (plan D3): no CrowdSec body inspection, see upload-exceptions-eg.yaml
    - name: uploads
      matches:
        - method: POST
          path:
            type: Exact
            value: /api/images
        - method: POST
          path:
            type: Exact
            value: /api/import/file
        - method: POST
          path:
            type: Exact
            value: /api/import/cocktail
        - method: POST
          path:
            type: Exact
            value: /api/generate/shelf-from-photo
      backendRefs:
        - name: bar-assistant
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: bar-assistant
          port: 8080
    # Rule 3: Static Photos & Uploads (RATE-LIMITED)
    - matches:
        - path:
            type: PathPrefix
            value: /storage
        - path:
            type: PathPrefix
            value: /uploads
      backendRefs:
        - name: bar-assistant
          port: 8080
    # Rule 4: Frontend Static Assets (RATE-LIMITED)
    - matches:
        - path:
            type: PathPrefix
            value: /assets
      backendRefs:
        - name: salt-rim
          port: 8080
    # Rule 5: Frontend App Shell (RATE-LIMITED)
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: salt-rim
          port: 8080
