apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: wedding-share-route
spec:
  parentRefs:
    - name: internal-gateway
      namespace: traefik
  hostnames:
    - "event.kerrlab.app"
  rules:
    # 1. Thumbnails & Uploaded Photos (Cached)
    - matches:
        - path:
            type: PathPrefix
            value: /thumbnails
        - path:
            type: PathPrefix
            value: /uploads
        - path:
            type: PathPrefix
            value: /custom_resources
        - path:
            type: Exact
            value: /favicon.ico
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: http-cache
      backendRefs:
        - name: keda-add-ons-http-interceptor-proxy
          namespace: networking
          port: 8080

    # 2. Upload API, Auth & App Shell (Bypass Cache)
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: keda-add-ons-http-interceptor-proxy
          namespace: networking
          port: 8080
