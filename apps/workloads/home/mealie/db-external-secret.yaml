apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mealie-db-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-store
    kind: ClusterSecretStore
  target:
    name: mealie-db-credentials
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: home/mealie
        property: username
    - secretKey: password
      remoteRef:
        key: home/mealie
        property: password