# Envoy Gateway copy of mealie-external-route (migration); the Traefik route stays until cutover
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mealie-external-route-eg
spec:
  parentRefs:
    - name: external-gateway
      namespace: edge
      sectionName: dmz
  hostnames:
    - "recipes.kerrlab.app"
  rules:
    # Upload paths (plan D3): no CrowdSec body inspection, see upload-exceptions-eg.yaml
    - name: uploads
      matches:
        - method: PUT
          path:
            type: RegularExpression
            value: /api/recipes/[^/]+/image
        - method: PUT
          path:
            type: RegularExpression
            value: /api/recipes/timeline/events/[^/]+/image
        - method: POST
          path:
            type: RegularExpression
            value: /api/recipes/[^/]+/assets
        - method: POST
          path:
            type: Exact
            value: /api/recipes/create/zip
        - method: POST
          path:
            type: Exact
            value: /api/recipes/create/image
        - method: POST
          path:
            type: Exact
            value: /api/recipes/create/ai
        - method: POST
          path:
            type: Exact
            value: /api/recipes/create/ai/stream
        - method: POST
          path:
            type: Exact
            value: /api/recipes/create/html-or-json
        - method: POST
          path:
            type: Exact
            value: /api/recipes/create/html-or-json/stream
        - method: POST
          path:
            type: RegularExpression
            value: /api/users/[^/]+/image
        - method: POST
          path:
            type: Exact
            value: /api/groups/migrations
        - method: POST
          path:
            type: Exact
            value: /api/admin/backups/upload
        - method: POST
          path:
            type: PathPrefix
            value: /api/admin/debug/openai
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: X-Content-Type-Options
                value: nosniff
              - name: X-Frame-Options
                value: SAMEORIGIN
              - name: Referrer-Policy
                value: strict-origin-when-cross-origin
      backendRefs:
        - name: mealie-service
          port: 9000
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: X-Content-Type-Options
                value: nosniff
              - name: X-Frame-Options
                value: SAMEORIGIN
              - name: Referrer-Policy
                value: strict-origin-when-cross-origin
      backendRefs:
        - name: mealie-service
          port: 9000
