apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mealie-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-store
    kind: ClusterSecretStore
  target:
    name: mealie-secrets
    creationPolicy: Owner
  data:
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: home/mealie
        property: OIDC_CLIENT_SECRET
    - secretKey: SMTP_FROM_EMAIL
      remoteRef:
        key: home/mealie
        property: SMTP_FROM_EMAIL
    - secretKey: SMTP_USER
      remoteRef:
        key: home/mealie
        property: SMTP_USER
    - secretKey: SMTP_PASSWORD
      remoteRef:
        key: home/mealie
        property: SMTP_PASSWORD
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: home/mealie
        property: OPENAI_API_KEY
 