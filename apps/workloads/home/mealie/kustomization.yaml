apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: home

labels:
  - pairs:
      app.kubernetes.io/name: mealie

# List of resources to include
resources:
  - db-external-secret.yaml
  - secrets.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - http-route.yaml
  - http-route-eg.yaml
  - external-http-route.yaml
  - external-http-route-eg.yaml
  - upload-exceptions-eg.yaml
  - rate-limit-eg.yaml
  - rate-limit.yaml
  - network-policy.yaml
  - persistence

images:
  - name: ghcr.io/mealie-recipes/mealie
    newTag: v3.31.0@sha256:97e21ac96e9a8d1ee15aaf558ba3f14998936b9d6f334e40ebb4c6c2127dc12f
