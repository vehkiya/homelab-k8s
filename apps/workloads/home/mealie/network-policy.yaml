apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: mealie-policy
spec:
  endpointSelector:
    matchLabels:
      app: mealie
  egress:
    # ------------------------------------------------------------------
    # 1. EXTERNAL HOSTS (PostgreSQL on NAS)
    - toCIDR:
        - "10.10.1.218/32"
      toPorts:
        - ports:
            - port: "15432"
              protocol: TCP

    # ------------------------------------------------------------------
    # 2. PUBLIC INTERNET (Recipe scraping & OpenAI API)
    - toEntities:
        - "world"
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
            - port: "443"
              protocol: TCP
