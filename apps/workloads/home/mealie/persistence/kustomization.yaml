apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: home

resources:
  - nfs-storage.yaml

labels:
  - pairs:
      app.kubernetes.io/name: mealie

# Never prune or cascade-delete volumes from Argo; removal is manual
commonAnnotations:
  argocd.argoproj.io/sync-options: Prune=false,Delete=false
