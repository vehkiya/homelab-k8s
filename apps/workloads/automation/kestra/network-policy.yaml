apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kestra-policy
  namespace: automation
spec:
  endpointSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - kestra

  ingress:
    # === Allow intra-cluster gRPC from workers to controller ===
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: kestra
      toPorts:
        - ports:
            - port: "50051"
              protocol: TCP
    # === Allow intra-cluster HTTP from workers to webserver (SDK) ===
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: kestra
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP

  egress:
    # === Allow intra-cluster communication between Kestra components ===
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: kestra
      toPorts:
        - ports:
            - port: "50051"
              protocol: TCP
            - port: "8080"
              protocol: TCP
    # === Allow egress to NAS PostgreSQL ===
    - toCIDR:
        - "10.10.1.218/32"
      toPorts:
        - ports:
            - port: "15432"
              protocol: TCP
    # === Allow egress to s3.kerrlab.app (S3) ===
    - toFQDNs:
        - matchName: "s3.kerrlab.app"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # === Allow Internet Access for plugins and flows ===
    - toEntities:
        - "world"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "80"
              protocol: TCP
