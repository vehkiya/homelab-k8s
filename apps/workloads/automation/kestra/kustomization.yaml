apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: automation

resources:
  - secrets.yaml
  - webserver.yaml
  - executor.yaml
  - worker.yaml
  - controller.yaml
  - hpa.yaml
  - http-route.yaml
  - http-route-eg.yaml
  - network-policy.yaml

configMapGenerator:
  - name: kestra-config
    files:
      - application.yml=templates/application.yml


images:
  - name: kestra/kestra
    newTag: v2.0.13@sha256:9b7c119da466df1547f58645466b7f4ac20ca97f412acc74adf9a5580be15f67
