# koneko-bot's App key and webhook secret, the sweeper's trigger token and the Sentinel password are koshin's own
# (automation/koshin); the registry credentials are still read from renovate-ce's entry.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: koshin-proxy
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-store
  target:
    name: koshin-proxy
    creationPolicy: Owner
  data:
    - secretKey: GITHUB_WEBHOOK_SECRET
      remoteRef:
        key: automation/koshin
        property: GITHUB_WEBHOOK_SECRET
    - secretKey: INTERNAL_TRIGGER_TOKEN
      remoteRef:
        key: automation/koshin
        property: INTERNAL_TRIGGER_TOKEN
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: koshin-github-app
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-store
  target:
    name: koshin-github-app
    creationPolicy: Owner
  data:
    - secretKey: private-key.pem
      remoteRef:
        key: automation/koshin
        property: GITHUB_APP_PRIVATE_KEY
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: koshin-renovate
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-store
  target:
    name: koshin-renovate
    creationPolicy: Owner
    template:
      engineVersion: v2
      mergePolicy: Merge
      data:
        RENOVATE_HOST_RULES: |
          [
            {
              "matchHost": "docker.io",
              "username": "{{ .DOCKER_USERNAME }}",
              "password": "{{ .DOCKER_PASSWORD }}",
              "concurrentRequestLimit": 4
            },
            {
              "matchHost": "dhi.io",
              "username": "{{ .DOCKER_USERNAME }}",
              "password": "{{ .DOCKER_PASSWORD }}",
              "concurrentRequestLimit": 2
            },
            {
              "matchHost": "registry.k8s.io",
              "concurrentRequestLimit": 2
            },
            {
              "hostType": "docker",
              "matchHost": "ghcr.io",
              "username": "{{ .GHCR_USERNAME }}",
              "password": "{{ .GHCR_TOKEN }}"
            }
          ]
  data:
    - secretKey: DOCKER_USERNAME
      remoteRef:
        key: automation/renovate
        property: DOCKER_USERNAME
    - secretKey: DOCKER_PASSWORD
      remoteRef:
        key: automation/renovate
        property: DOCKER_PASSWORD
    - secretKey: GHCR_USERNAME
      remoteRef:
        key: automation/renovate
        property: GHCR_USERNAME
    - secretKey: GHCR_TOKEN
      remoteRef:
        key: automation/renovate
        property: GHCR_TOKEN
---
# The password of Sentinel's ACL user (the ha profile); key `sentinel`, as values-ha.yml expects
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: koshin-valkey-sentinel
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-store
  target:
    name: koshin-valkey-sentinel
    creationPolicy: Owner
  data:
    - secretKey: sentinel
      remoteRef:
        key: automation/koshin
        property: VALKEY_SENTINEL_PASSWORD
