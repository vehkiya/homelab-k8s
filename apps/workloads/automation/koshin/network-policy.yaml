# koshin under the cluster's default deny: proxy and workers reach NATS, Valkey and GitHub; the proxy also reaches the
# API server (it starts burst worker Jobs), workers (and Renovate in their `renovate` sidecar, same pod) registries.
# NATS and Valkey accept only them.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: koshin-proxy-policy
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: koshin
      app.kubernetes.io/component: proxy
  ingress:
    # GitHub webhooks through Traefik (the proxy's port is `http`, so the global `http-api` rule doesn't cover it)
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: traefik
            io.kubernetes.pod.namespace: traefik
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # The sweeper's hourly trigger
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: koshin
            app.kubernetes.io/component: sweeper
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: nats
            app.kubernetes.io/instance: koshin
      toPorts:
        - ports:
            - port: "4222"
              protocol: TCP
    # Ingest coalescing and the Job dispatcher's leader lease, on the coordination Valkey
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: valkey
            app.kubernetes.io/instance: koshin
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
    # The Job dispatcher: reads the worker PodTemplate, lists and creates burst worker Jobs
    - toEntities:
        - "kube-apiserver"
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
    # GitHub API: the App's bot login, installation tokens and repository discovery
    - toEntities:
        - "world"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: koshin-worker-policy
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: koshin
      app.kubernetes.io/component: worker
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: nats
            app.kubernetes.io/instance: koshin
      toPorts:
        - ports:
            - port: "4222"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: valkey
            app.kubernetes.io/instance: koshin
        - matchLabels:
            app.kubernetes.io/name: valkey-cache
            app.kubernetes.io/instance: koshin
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
    # GitHub and package registries, for koshin and Renovate (as renovate-ce's policy)
    - toEntities:
        - "world"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
        - ports:
            - port: "443"
              protocol: UDP
        - ports:
            - port: "80"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: koshin-sweeper-policy
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: koshin
      app.kubernetes.io/component: sweeper
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: koshin
            app.kubernetes.io/component: proxy
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: koshin-nats-policy
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: nats
      app.kubernetes.io/instance: koshin
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: koshin
            app.kubernetes.io/component: proxy
        - matchLabels:
            app.kubernetes.io/name: koshin
            app.kubernetes.io/component: worker
      toPorts:
        - ports:
            - port: "4222"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: koshin-valkey-policy
spec:
  endpointSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - valkey
          - valkey-cache
      - key: app.kubernetes.io/instance
        operator: In
        values:
          - koshin
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: koshin
            app.kubernetes.io/component: worker
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
---
# The proxy uses the coordination Valkey only, not the package cache
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: koshin-valkey-proxy-policy
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: valkey
      app.kubernetes.io/instance: koshin
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: koshin
            app.kubernetes.io/component: proxy
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
