apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: automation
helmCharts:
  - name: koshin
    repo: oci://ghcr.io/hononeko/charts
    version: 0.22.1
    releaseName: koshin
    namespace: automation
    # The ha profile, with this install's settings layered on top
    valuesFile: values/values-ha.yml
    additionalValuesFiles:
      - values/values.yml
    skipTests: true

resources:
  - external-secret.yaml
  - network-policy.yaml
  - http-route.yaml
  - http-route-eg.yaml
  - rate-limit-eg.yaml

