# Envoy Gateway copy of koshin-webhook (migration); the Traefik route stays until cutover
# koshin's GitHub webhook beside renovate-ce's on the same host: /webhooks/github doesn't match renovate-ce's /webhook
# prefix (Gateway API prefixes match whole path segments). Point the App's webhook URL here while testing.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: koshin-webhook-eg
spec:
  parentRefs:
    - name: external-gateway
      namespace: edge
      sectionName: dmz
  hostnames:
    - "renovate.kerrlab.app"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /webhooks/github
      backendRefs:
        - name: koshin-proxy
          port: 80
