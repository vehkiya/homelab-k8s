# koshin's GitHub webhook beside renovate-ce's on the same host: /webhooks/github doesn't match renovate-ce's /webhook
# prefix (Gateway API prefixes match whole path segments). Point the App's webhook URL here while testing.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: koshin-webhook
spec:
  parentRefs:
    - name: external-gateway
      namespace: traefik
  hostnames:
    - "renovate.kerrlab.app"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /webhooks/github
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: renovate-rate-limit
      backendRefs:
        - name: koshin-proxy
          port: 80
