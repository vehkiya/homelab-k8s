apiVersion: v1
kind: Service
metadata:
  name: redis-n8n
  labels:
    app: redis-n8n
spec:
  ports:
    - name: redis
      port: 6379
      targetPort: redis
  selector:
    app: redis-n8n
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-n8n
  labels:
    app: redis-n8n
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: redis-n8n
  template:
    metadata:
      labels:
        app: redis-n8n
    spec:
      containers:
        - name: valkey
          image: docker.io/valkey/valkey
          command:
            - sh
            - -c
            - "exec valkey-server --requirepass \"$VALKEY_PASSWORD\" --dir /data --save \"\" --appendonly no"
          env:
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: n8n-secrets
                  key: QUEUE_BULL_REDIS_PASSWORD
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "20m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: data
              mountPath: /data
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
      volumes:
        - name: data
          emptyDir: {}
