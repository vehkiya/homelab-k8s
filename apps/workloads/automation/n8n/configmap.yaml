# ConfigMap for non-sensitive configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: n8n-config
data:
  EXECUTIONS_MODE: "queue"
  OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS: "true"
  QUEUE_BULL_REDIS_HOST: "redis-n8n.automation.svc.cluster.local"
  QUEUE_BULL_REDIS_PORT: "6379"
  DB_TYPE: "postgresdb"
  DB_POSTGRESDB_DATABASE: "n8n"
  DB_POSTGRESDB_HOST: "fortress.kerrlab.app"
  DB_POSTGRESDB_PORT: "15432"
  DB_POSTGRESDB_USER: "n8n_user"
  DB_POSTGRESDB_POOL_MAX: "10"
  TZ: "Europe/Chisinau"
  N8N_PROTOCOL: "https"
  N8N_HOST: "n8n.kerrlab.app"
  N8N_WEBHOOK_URL: "https://n8n.kerrlab.app"
  N8N_EDITOR_BASE_URL: "https://n8n.kerrlab.app"
  N8N_UNVERIFIED_PACKAGES_ENABLED: "true"
  N8N_RUNNERS_TASK_TIMEOUT: "300"
  N8N_COMPRESSION_NODE_MAX_DECOMPRESSED_SIZE_BYTES: "2147483648"
  N8N_COMPRESSION_NODE_MAX_ZIP_ENTRIES: "5000"
  N8N_PROXY_HOPS: "1"
  GENERIC_TIMEZONE: "Europe/Chisinau"
  N8N_PUSH_BACKEND: "websocket"
  NODE_OPTIONS: "--max-old-space-size=800"
