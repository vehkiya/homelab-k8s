# Envoy Gateway copy of renovate-webhook (migration); the Traefik route stays until cutover
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: renovate-webhook-eg
spec:
  parentRefs:
    - name: external-gateway
      namespace: edge
      sectionName: dmz
  hostnames:
    - "renovate.kerrlab.app"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /webhook
      backendRefs:
        - name: renovate-server
          port: 8080
