apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renovate-secrets
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: vaultwarden-fields
  target:
    name: renovate-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      mergePolicy: Merge
      data:
        RENOVATE_HOST_RULES: |
          [
            {
              "hostType": "docker",
              "matchHost": "docker.io",
              "username": "{{ .DOCKER_USERNAME }}",
              "password": "{{ .DOCKER_PASSWORD }}"
            },
            {
              "hostType": "docker",
              "matchHost": "dhi.io",
              "username": "{{ .DOCKER_USERNAME }}",
              "password": "{{ .DOCKER_PASSWORD }}"
            },
            {
              "hostType": "docker",
              "matchHost": "ghcr.io",
              "username": "{{ .GHCR_USERNAME }}",
              "password": "{{ .GHCR_TOKEN }}"
            }
          ]
  data:
    - secretKey: RENOVATE_PRIVATE_KEY
      remoteRef:
        key: "52a4e716-678d-435b-885b-fef0a7e1705c"
        property: private-key
        decodingStrategy: Base64
    - secretKey: RENOVATE_WEBHOOK_SECRET
      remoteRef:
        key: "52a4e716-678d-435b-885b-fef0a7e1705c"
        property: webhook-secret
    - secretKey: RENOVATE_LICENSE_KEY
      remoteRef:
        key: "52a4e716-678d-435b-885b-fef0a7e1705c"
        property: license-key
    - secretKey: DOCKER_USERNAME
      remoteRef:
        key: "52a4e716-678d-435b-885b-fef0a7e1705c"
        property: docker-username
    - secretKey: DOCKER_PASSWORD
      remoteRef:
        key: "52a4e716-678d-435b-885b-fef0a7e1705c"
        property: docker-password
    - secretKey: GHCR_USERNAME
      remoteRef:
        key: "52a4e716-678d-435b-885b-fef0a7e1705c"
        property: ghcr-username
    - secretKey: GHCR_TOKEN
      remoteRef:
        key: "52a4e716-678d-435b-885b-fef0a7e1705c"
        property: ghcr-token
    - secretKey: DEFAULT_PR_REVIEWERS
      remoteRef:
        key: "52a4e716-678d-435b-885b-fef0a7e1705c"
        property: reviewers
