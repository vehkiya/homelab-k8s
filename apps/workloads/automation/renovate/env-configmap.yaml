apiVersion: v1
kind: ConfigMap
metadata:
  name: renovate-env
data:
  MEND_RNV_PLATFORM: "github"
  MEND_RNV_AUTODISCOVER_FILTER: "vehkiya/*,hononeko/*,Test-Forge/*,neeppy/*"
  MEND_RNV_ADMIN_API_ENABLED: "false"
  MEND_RNV_SERVER_PORT: "8080"
  MEND_RNV_REDIS_URL: "redis://renovate-redis:6379"
  MEND_RNV_CRON_JOB_SCHEDULER_ALL: "0 * * * *"
  MEND_RNV_ACCEPT_TOS: "y"
  MEND_RNV_ACCEPT_PLUGINS: "true"
  MEND_RNV_GITHUB_APP_ID: "2668553"
  NODE_OPTIONS: "--dns-result-order=ipv4first"
  MEND_RNV_NODE_OPTIONS: "--dns-result-order=ipv4first"
  RENOVATE_OPTIMIZE_FOR_DISABLED: "true"
  RENOVATE_PR_HOURLY_LIMIT: "4"
  # Docker Hub returns 403 for anonymous tag pages past 10, and Renovate then drops every tag timestamp, so
  # minimumReleaseAge holds images like golang pending forever. Stop before that page; remove once
  # https://github.com/renovatebot/renovate/issues/46925 is fixed.
  RENOVATE_DOCKER_MAX_PAGES: "10"
  RENOVATE_ONBOARDING_CONFIG: |-
    {
      "$schema": "https://docs.renovatebot.com/renovate-schema.json",
      "extends": ["config:recommended", ":semanticCommits", ":semanticCommitTypeAll(chore)", "mergeConfidence:all-badges"]
    }
  RENOVATE_REPOSITORY_CACHE: "enabled"
