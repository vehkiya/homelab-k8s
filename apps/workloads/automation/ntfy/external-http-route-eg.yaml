# Envoy Gateway copy of ntfy-external-route (migration); the Traefik route stays until cutover
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ntfy-external-route-eg
spec:
  parentRefs:
    - name: external-gateway
      namespace: edge
      sectionName: dmz
  hostnames:
    - "ntfy.kerrlab.app"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: ntfy
          port: 80
