apiVersion: apps/v1
kind: Deployment
metadata:
  name: media-webhook-notifier
  labels:
    app.kubernetes.io/name: media-webhook-notifier
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: media-webhook-notifier
  template:
    metadata:
      labels:
        app.kubernetes.io/name: media-webhook-notifier
        networking/expose-http-api: "true"
        networking/expose-dmz: "true"
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: media-webhook-notifier
                topologyKey: kubernetes.io/hostname
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        runAsNonRoot: true
      initContainers:
        - name: inject-secrets
          image: ghcr.io/hononeko/k8s-config-tools
          command:
            - gomplate
            - -f
            - /template/templates.yaml
            - -o
            - /config/templates.yaml
          envFrom:
            - secretRef:
                name: media-webhook-notifier-secret
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: templates-template
              mountPath: /template
              readOnly: true
            - name: config
              mountPath: /config
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "50m"
              memory: "32Mi"
      containers:
        - name: notifier
          image: ghcr.io/hononeko/media-webhook-notifier
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: http-api
              containerPort: 8080
              protocol: TCP
          env:
            - name: TZ
              value: "Europe/Chisinau"
            - name: SERVER_PORT
              value: "8080"
            - name: ENABLE_PREVIEW
              value: "false"
            - name: QBITTORRENT_URL
              value: "http://qbittorrent-ui.media.svc.cluster.local:8080"
            - name: MEDIA_SERVER_TYPE
              value: "plex"
            - name: MEDIA_SERVER_URL
              value: "http://plex-ui.media.svc.cluster.local:32400"
            - name: MEDIA_SERVER_PUBLIC_URL
              value: "https://plex.kerrlab.app"
            - name: MEDIA_SERVER_NAME
              value: "Kerrlab Plex"
            - name: MEDIA_SERVER_STATUS_MONITOR_ENABLED
              value: "true"
            - name: MEDIA_SERVER_STATUS_POLL_INTERVAL_SECONDS
              value: "30"
            - name: MEDIA_SERVER_STATUS_GRACE_SECONDS
              value: "90"
            - name: MEDIA_SERVER_STATUS_REFRESH_SECONDS
              value: "300"
            - name: MEDIA_SERVER_STATUS_RECOVERY_SECONDS
              value: "3600"
            - name: LOG_LEVEL
              value: "INFO"
            - name: STATE_TYPE
              value: "redis"
            - name: STATE_URL
              value: "redis://media-webhook-notifier-dragonfly.automation.svc.cluster.local:6379"
            - name: DOWNLOAD_CLIENT_DEBOUNCE_SECONDS
              value: "15"
            - name: TEMPLATES_FILE
              value: "/config/templates.yaml"
            # Telegram inline-button handling (callback queries) via webhook; see
            # https://github.com/hononeko/media-webhook-notifier/blob/main/docs/TELEGRAM_INTERACTIONS.md
            # TELEGRAM_WEBHOOK_SECRET, TELEGRAM_ALLOWED_USERS and TELEGRAM_ADMIN_USERS come from the ExternalSecret.
            # Admins receive Seerr requests/issues and health issues privately (each must /start the bot once).
            - name: TELEGRAM_INTERACTIVE_ENABLED
              value: "true"
            - name: TELEGRAM_UPDATES_MODE
              value: "webhook"
            - name: TELEGRAM_WEBHOOK_URL
              value: "https://media-webhook-notifier.kerrlab.app"
            # cross-seed push notifications at /api/v1/webhook/cross-seed (404 while off).
            - name: CROSS_SEED_ENABLED
              value: "true"
            # Seerr API for the admin-only Approve / Decline / Resolve buttons; SEERR_API_KEY comes from the ExternalSecret.
            - name: SEERR_URL
              value: "http://seerr-ui.media.svc.cluster.local:5055"
          envFrom:
            - secretRef:
                name: media-webhook-notifier-secret
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
          livenessProbe:
            httpGet:
              path: /livez
              port: http-api
            initialDelaySeconds: 2
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http-api
            initialDelaySeconds: 2
            periodSeconds: 10
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
      volumes:
        - name: templates-template
          configMap:
            name: media-webhook-notifier-templates
        - name: config
          emptyDir: {}
