# Media Webhook Notifier Custom Templates
# Reference: https://github.com/hononeko/media-webhook-notifier/blob/main/docs/TEMPLATES.md

theme:
  max_overview_length: 240
  progress_bar_length: 10
  progress_bar_style: "default"

events:
  grab:
    title: "⏳ Queueing: {title}"
    subtitle: "{instance_name}"
    body: |
      ▪ <b>Quality:</b> {quality}
      ▪ <b>Group:</b> {release_group}
      ▪ <b>Size:</b> {size}
      ▪ <b>Indexer:</b> {indexer}

  download_progress:
    title: "⏳ Downloading: {title}"
    subtitle: "{instance_name}"
    body: |
      <code>{progress_bar}</code> <b>{progress_percent}%</b>
      ▪ <b>Speed:</b> {speed} (ETA: {eta})
      ▪ <b>Downloaded:</b> {downloaded_size} / {total_size}
      ▪ <b>Peers:</b> {peers_info}

  download_complete:
    title: "✅ Download Complete: {title}"
    subtitle: "{instance_name}"
    body: |
      ▪ <b>Quality:</b> {quality}
      ▪ <b>Size:</b> {total_size}
      ▪ <b>Indexer:</b> {indexer}

  download_stalled:
    title: "⚠️ Download Stalled: {title}"
    subtitle: "{instance_name}"
    body: |
      ▪ <b>Status:</b> Stalled (0 B/s)
      ▪ <b>Progress:</b> {progress_percent}% {progress_bar}
      ▪ <b>Quality:</b> {quality}

  import:
    title: "{import_icon} {import_action}: {title}"
    subtitle: "{instance_name} • {import_type}"
    body: |
      ▪ <b>Quality:</b> {quality}
      ▪ <b>Specs:</b> {specs}
      ▪ <b>Size:</b> {size}

      <i>{overview}</i>

  media_available:
    title: "🍿 Now Available: {title}"
    subtitle: "{instance_name}"
    body: |
      ▪ <b>Specs:</b> {specs}
      ▪ <b>Rating:</b> {score}

      <i>{overview}</i>
    actions:
      - label: "🎬 Watch on Plex"
        url: "{deep_link_url}"
        style: "PRIMARY"

  manual_interaction:
    title: "✋ Manual Import Required: {title}"
    subtitle: "{instance_name} • Manual Intervention"
    body: |
      ▪ <b>Reason:</b> {reason}
      ▪ <b>Release:</b> {release_title}
      ▪ <b>Quality:</b> {quality}
      ▪ <b>Size:</b> {size}
      ▪ <b>Indexer:</b> {indexer}
      ▪ <b>Client:</b> {client}
    actions:
      - label: "📁 Open in {source_name}"
        url: "{web_url}"
        style: "PRIMARY"

  request:
    title: "{request_icon} {request_action}: {subject}"
    subtitle: "{instance_name} • {request_status}"
    body: |
      ▪ <b>Requested By:</b> {requested_by}
      ▪ <b>Media Type:</b> {media_type}
      ▪ <b>Quality:</b> {quality}
      ▪ <b>Issue:</b> {issue_type} ({issue_status})
      ▪ <b>Comment:</b> {comment}
      ▪ <b>Details:</b> {message}
    actions:
      - label: "🌐 Open in {instance_name}"
        url: "{web_url}"
        style: "PRIMARY"

  health:
    title: "{health_icon} {health_status}: {instance_name}"
    subtitle: "{instance_name} • {health_type}"
    body: |
      ▪ <b>Issue:</b> {issue_type}
      ▪ <b>Message:</b> {message}
