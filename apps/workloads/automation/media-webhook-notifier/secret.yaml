apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: media-webhook-notifier-secret
spec:
  secretStoreRef:
    name: openbao-store
    kind: ClusterSecretStore
  target:
    name: media-webhook-notifier-secret
    template:
      data:
        SERVER_AUTH_TOKEN: "{{ .webhook_token }}"
        NOTIFICATION_URL: "telegram://{{ .bot_token }}@{{ .chat_id }}"
        TELEGRAM_WEBHOOK_SECRET: "{{ .telegram_webhook_secret }}"
        TELEGRAM_ALLOWED_USERS: "{{ .telegram_allowed_users }}"
        TELEGRAM_ADMIN_USERS: "{{ .telegram_admin_users }}"
        SEERR_API_KEY: "{{ .seerr_api_key }}"
  data:
    - secretKey: webhook_token
      remoteRef:
        key: automation/media-webhook-notifier
        property: webhook_token
    - secretKey: bot_token
      remoteRef:
        key: automation/media-webhook-notifier
        property: bot_token
    - secretKey: chat_id
      remoteRef:
        key: automation/media-webhook-notifier
        property: chat_id
    - secretKey: telegram_webhook_secret
      remoteRef:
        key: automation/media-webhook-notifier
        property: telegram_webhook_secret
    - secretKey: telegram_allowed_users
      remoteRef:
        key: automation/media-webhook-notifier
        property: telegram_allowed_users
    - secretKey: telegram_admin_users
      remoteRef:
        key: automation/media-webhook-notifier
        property: telegram_admin_users
    - secretKey: seerr_api_key
      remoteRef:
        key: automation/media-webhook-notifier
        property: seerr_api_key
