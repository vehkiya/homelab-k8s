apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: media-webhook-notifier-secret
spec:
  secretStoreRef:
    name: openbao-store
    kind: ClusterSecretStore
  target:
    name: media-webhook-notifier-secret
    template:
      data:
        SERVER_AUTH_TOKEN: "{{ .webhook_token }}"
        NOTIFICATION_URL: "telegram://{{ .bot_token }}@{{ .chat_id }}"
        TELEGRAM_WEBHOOK_SECRET: "{{ .telegram_webhook_secret }}"
        TELEGRAM_ALLOWED_USERS: "{{ .telegram_allowed_users }}"
        TELEGRAM_ADMIN_USERS: "{{ .telegram_admin_users }}"
        SEERR_API_KEY: "{{ .seerr_api_key }}"
  data:
    - secretKey: webhook_token
      remoteRef:
        key: automation/media-webhook-notifier
        property: webhook_token
    - secretKey: bot_token
      remoteRef:
        key: telegram/bots
        property: ARR_BOT
    - secretKey: chat_id
      remoteRef:
        key: telegram/channels
        property: MEDIA_CHANNEL
    - secretKey: telegram_webhook_secret
      remoteRef:
        key: automation/media-webhook-notifier
        property: telegram_webhook_secret
    - secretKey: telegram_allowed_users
      remoteRef:
        key: automation/media-webhook-notifier
        property: telegram_allowed_users
    - secretKey: telegram_admin_users
      remoteRef:
        key: automation/media-webhook-notifier
        property: telegram_admin_users
    - secretKey: seerr_api_key
      remoteRef:
        key: automation/media-webhook-notifier
        property: seerr_api_key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: media-webhook-notifier-templates
spec:
  secretStoreRef:
    name: openbao-store
    kind: ClusterSecretStore
  target:
    name: media-webhook-notifier-templates
    template:
      data:
        templates.yaml: |
          theme:
            max_overview_length: 150
          events:
            download:
              complete:
                silent: true
                image_embed: false
                body: |
                  ▪ <b>Release:</b> {release_name}
                  ▪ <b>Tracker:</b> {indexer}
                  ▪ <b>Status:</b> 100% Downloaded
                  ▪ <b>Total Size:</b> {total_size}
            servarr:
              grab:
                chat_id: "{{ .media_events_chat_id }}"
                silent: true
                image_embed: false
              import:
                chat_id: "{{ .media_events_chat_id }}"
                silent: true
              manual_interaction:
                chat_id: "{{ .media_events_chat_id }}"
              health:
                chat_id: "{{ .media_events_chat_id }}"
                silent: true
            seerr:
              request:
                chat_id: "{{ .media_events_chat_id }}"
              issue:
                chat_id: "{{ .media_events_chat_id }}"
            media_server:
              available:
                silent: false
                image_embed: true
                title: "🍿 {title}"
                subtitle: "Now available on {media_server_name}"
                body: |
                  ▪ <b>Specs:</b> {specs}
                  ▪ <b>Rating:</b> {rating}
                  ▪ <b>Duration:</b> {duration}

                  <i>{overview}</i>
  data:
    - secretKey: media_events_chat_id
      remoteRef:
        key: telegram/channels
        property: MEDIA_EVENTS_CHANNEL
