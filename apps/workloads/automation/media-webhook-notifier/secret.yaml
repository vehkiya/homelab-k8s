apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: media-webhook-notifier-secret
spec:
  secretStoreRef:
    name: openbao-store
    kind: ClusterSecretStore
  target:
    name: media-webhook-notifier-secret
    template:
      data:
        SERVER_AUTH_TOKEN: "{{ .webhook_token }}"
        NOTIFICATION_URL: "telegram://{{ .bot_token }}@{{ .chat_id }}"
  data:
    - secretKey: webhook_token
      remoteRef:
        key: automation/media-webhook-notifier
        property: webhook_token
    - secretKey: bot_token
      remoteRef:
        key: automation/media-webhook-notifier
        property: bot_token
    - secretKey: chat_id
      remoteRef:
        key: automation/media-webhook-notifier
        property: chat_id
