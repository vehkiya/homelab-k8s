# Envoy Gateway copy of media-webhook-notifier-external-route (migration); the Traefik route stays until cutover
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: media-webhook-notifier-external-route-eg
spec:
  parentRefs:
    - name: external-gateway
      namespace: edge
      sectionName: dmz
  hostnames:
    - "media-webhook-notifier.kerrlab.app"
  rules:
    - matches:
        - path:
            type: Exact
            value: /api/v1/telegram/webhook
          method: POST
      backendRefs:
        - name: media-webhook-notifier
          port: 8080
