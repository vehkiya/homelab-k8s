apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: media-webhook-notifier-policy
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: media-webhook-notifier

  # ----=== Ingress ===----
  ingress:
    # Allow incoming webhooks from media services
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: media
            app: sonarr
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: media
            app: radarr
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: media
            app: seerr
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: media
            app: plex
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: media
            app: jellyfin
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP

  # ----=== Egress ===----
  egress:
    # Allow communication to qBittorrent in media namespace
    - toServices:
        - k8sService:
            serviceName: qbittorrent-ui
            namespace: media
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: media
            app: qbittorrent
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
            - port: "web-ui"
              protocol: TCP
    # Allow outbound internet communication for Telegram Bot API & external webhooks
    - toEntities:
        - "world"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "80"
              protocol: TCP
