apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: media-webhook-notifier-external-route
spec:
  parentRefs:
    - name: external-gateway
      namespace: traefik
  hostnames:
    - "media-webhook-notifier.kerrlab.app"
  rules:
    - matches:
        - path:
            type: Exact
            value: /api/v1/telegram/webhook
          method: POST
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: media-webhook-notifier-rate-limit
      backendRefs:
        - name: media-webhook-notifier
          port: 8080
