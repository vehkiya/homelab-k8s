apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - secret.yaml
  - deployment.yaml
  - service.yaml
  - http-route.yaml
  - http-route-eg.yaml
  - rate-limit-eg.yaml
  - rate-limit.yaml
  - network-policy.yaml
  - restore-job.yaml
  - persistence

configMapGenerator:
  - name: plex-backup-script
    files:
      - backup.sh=scripts/backup.sh
  - name: plex-restore-script
    files:
      - restore.sh=scripts/restore.sh

labels:
  - pairs:
      app.kubernetes.io/name: plex
      app.kubernetes.io/part-of: media-services
images:
  - name: plexinc/pms-docker
    newTag: 1.43.5.11079-b3b13e506@sha256:6d778d41daae68f89115aa87a44ae14a96b23e71a2093da173b5a9aac4091336
  - name: alpine
    newTag: latest@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf
  - name: ghcr.io/hononeko/k8s-backup-tools
    newTag: 0.1.2@sha256:97254fdc83a84554a605065c57619163c7a35106bb21d147981ee363191453d6

