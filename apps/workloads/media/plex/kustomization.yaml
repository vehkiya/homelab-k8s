apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - secret.yaml
  - deployment.yaml
  - service.yaml
  - http-route.yaml
  - rate-limit.yaml
  - network-policy.yaml
  - restore-job.yaml
  - persistence

configMapGenerator:
  - name: plex-backup-script
    files:
      - backup.sh=scripts/backup.sh
  - name: plex-restore-script
    files:
      - restore.sh=scripts/restore.sh

labels:
  - pairs:
      app.kubernetes.io/name: plex
      app.kubernetes.io/part-of: media-services
images:
  - name: plexinc/pms-docker
    newTag: 1.43.6.11085-d1e52e169@sha256:16ac93c7031813510e58e280eb546909d065b1a09f5e5c022b06a63e11e7d707
  - name: alpine
    newTag: latest@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
  - name: ghcr.io/hononeko/k8s-backup-tools
    newTag: 0.1.1@sha256:40266da88413e2850417dc67d6d15e9d42249588248735f7ad1ef21a977e5bf0

