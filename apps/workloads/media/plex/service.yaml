apiVersion: v1
kind: Service
metadata:
  name: plex-ui
  labels:
    pool: internal-lb-pool
    # LAN (L2) announcement only from the node-type=performance node the pod is pinned to
    # (cilium/l2-announcements.yaml); Cilium's L2 lease ignores externalTrafficPolicy
    l2.kerrlab.app/node-type: performance
  annotations:
    lbipam.cilium.io/ips: "10.10.1.131"
spec:
  type: LoadBalancer
  # BGP advertises the IP only from the pod's node, and the client IP is preserved
  externalTrafficPolicy: Local
  selector:
    app: plex
  ports:
    - name: web-ui
      port: 32400
---
apiVersion: v1
kind: Service
metadata:
  name: plex-discovery
spec:
  selector:
    app: plex
  ports:
    - name: gdm-discovery-1
      protocol: UDP
      port: 32410
    - name: gdm-discovery-2
      protocol: UDP
      port: 32412
    - name: gdm-discovery-3
      protocol: UDP
      port: 32413
    - name: gdm-discovery-4
      protocol: UDP
      port: 32414
    - name: dlna
      protocol: UDP
      port: 1900
