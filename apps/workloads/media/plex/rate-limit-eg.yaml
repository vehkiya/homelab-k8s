# Envoy Gateway copy of the Traefik rate limit (average 100, burst 200; web UI, so the burst value), per client IP
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: plex-rate-limit
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: plex-ui-route-eg
      sectionName: ui
  # Keeps the gateway's timeouts and error pages
  mergeType: StrategicMerge
  rateLimit:
    local:
      rules:
        - clientSelectors:
            - sourceCIDR:
                type: Distinct
                value: 0.0.0.0/0
          limit:
            requests: 200
            unit: Second
        - clientSelectors:
            - sourceCIDR:
                type: Distinct
                value: ::/0
          limit:
            requests: 200
            unit: Second
