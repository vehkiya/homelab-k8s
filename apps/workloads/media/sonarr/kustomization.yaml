apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment-tv.yaml
  - deployment-anime.yaml
  - deployment-portal.yaml
  - service.yaml
  - http-route.yaml
  - network-policy.yaml
  - secret-tv.yaml
  - secret-anime.yaml
  - persistence

labels:
  - pairs:
      app.kubernetes.io/name: sonarr
      app.kubernetes.io/part-of: media-services
images:
  - name: ghcr.io/home-operations/sonarr
    newTag: 5.0.0@sha256:1620725621cfda0360bd680dacf3246c4696c27c4b768b4346e07e8917e94499
  - name: ghcr.io/hononeko/k8s-config-tools
    newTag: 0.1.1@sha256:fb03e8e7910a51472309b361675f38da44ee398ab6ec64b020b660d4d0d4e400
  - name: nginxinc/nginx-unprivileged
    newTag: 1.31.7-alpine@sha256:b5047b9b76845eac124358373c6852377c52e4b05834a47647e955dd91cb8f1e

# Shared config for instances
configMapGenerator:
  - name: sonarr-tv-config-template
    files:
      - config.xml=templates/tv-config.xml
  - name: sonarr-anime-config-template
    files:
      - config.xml=templates/anime-config.xml
  - name: sonarr-portal-content
    files:
      - index.html=templates/portal.html

