<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sonarr Portal</title>
  <style>
    :root {
      --bg: #0f1117;
      --card-bg: rgba(26, 29, 39, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --text: #ffffff;
      --text-muted: #8b949e;
      --tv-color: #008cd4;
      --anime-color: #f06595;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at 50% 20%, #1a2236 0%, var(--bg) 80%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 2.5rem 2rem;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    .logo {
      font-size: 2.5rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 0.25rem;
      background: linear-gradient(135deg, #008cd4, #00d2ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 2rem;
    }

    .btn-grid {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.1rem 1.4rem;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      color: var(--text);
      text-decoration: none;
      font-weight: 600;
      font-size: 1.1rem;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .btn:hover {
      transform: translateY(-2px);
      background: rgba(255, 255, 255, 0.07);
    }

    .btn-tv:hover {
      border-color: var(--tv-color);
      box-shadow: 0 8px 24px rgba(0, 140, 212, 0.25);
    }

    .btn-anime:hover {
      border-color: var(--anime-color);
      box-shadow: 0 8px 24px rgba(240, 101, 149, 0.25);
    }

    .badge {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 0.25rem 0.6rem;
      border-radius: 6px;
      font-weight: 700;
    }

    .btn-tv .badge { background: rgba(0, 140, 212, 0.15); color: #38bdf8; }
    .btn-anime .badge { background: rgba(240, 101, 149, 0.15); color: #f472b6; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">Sonarr</div>
    <div class="subtitle">Select your media management library</div>

    <div class="btn-grid">
      <a href="/tv" class="btn btn-tv">
        <span>Standard TV</span>
        <span class="badge">Series</span>
      </a>

      <a href="/anime" class="btn btn-anime">
        <span>Anime</span>
        <span class="badge">Animation</span>
      </a>
    </div>
  </div>
</body>
</html>
