apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: media

resources:
  - sonarr-tv-pvc.yaml
  - sonarr-anime-pvc.yaml

labels:
  - pairs:
      app.kubernetes.io/name: sonarr
      app.kubernetes.io/part-of: media-services

# Never prune or cascade-delete volumes from Argo; removal is manual
commonAnnotations:
  argocd.argoproj.io/sync-options: Prune=false,Delete=false
