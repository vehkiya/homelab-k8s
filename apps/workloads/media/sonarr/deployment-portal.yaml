apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarr-portal
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: sonarr
      sonarr-type: portal
  template:
    metadata:
      labels:
        app: sonarr
        sonarr-type: portal
        networking/expose-web-ui: "true"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: portal
          image: nginxinc/nginx-unprivileged:1.27.4-alpine@sha256:62a904036bfc0e4a4f2b556e34cbf17bc136b47fde8cdb4628762725f48c5782
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: web-ui
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: "5m"
              memory: "16Mi"
            limits:
              cpu: "25m"
              memory: "32Mi"
          startupProbe:
            tcpSocket:
              port: web-ui
            failureThreshold: 10
            periodSeconds: 5
          readinessProbe:
            tcpSocket:
              port: web-ui
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: web-ui
            periodSeconds: 15
          volumeMounts:
            - name: portal-content
              mountPath: /usr/share/nginx/html
      volumes:
        - name: portal-content
          configMap:
            name: sonarr-portal-content
