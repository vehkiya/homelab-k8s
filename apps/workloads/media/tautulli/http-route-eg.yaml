# Envoy Gateway copy of tautulli-ui-route (migration); the Traefik route stays until cutover
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tautulli-ui-route-eg
spec:
  parentRefs:
    - name: internal-gateway
      namespace: edge
      sectionName: websecure
  hostnames:
    - "tautulli.kerrlab.app"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: tautulli-ui
          port: 8181
