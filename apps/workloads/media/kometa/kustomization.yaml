apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: media
resources:
  - secret.yaml
  - network-policies.yaml
  - cronjob.yaml
  - persistence

configMapGenerator:
  - name: kometa-config
    files:
      - config.yml=templates/config.yml
  - name: kometa-anime-config
    files:
      - anime.yaml=templates/anime.yaml
  - name: kometa-movie-config
    files:
      - movies.yaml=templates/movies.yaml
  - name: kometa-overlay-config
    files:
      - overlay.yaml=templates/overlay.yaml
  - name: kometa-tv-config
    files:
      - tv.yaml=templates/tv.yaml

labels:
  - pairs:
      app.kubernetes.io/name: kometa
      app.kubernetes.io/part-of: media-services
images:
  - name: ghcr.io/hononeko/k8s-config-tools
    newTag: 0.1.1@sha256:fb03e8e7910a51472309b361675f38da44ee398ab6ec64b020b660d4d0d4e400
  - name: kometateam/kometa
    newTag: v2.5.4@sha256:e3f509c3044ac011e1938dae2f7e80ea3cfe9663720a9f98683d1ea28c127e64
