# Envoy Gateway copy of seerr-ui-route seerr-ui-redirect (migration); the Traefik route stays until cutover
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: seerr-ui-route-eg
spec:
  parentRefs:
    - name: internal-gateway
      namespace: edge
      sectionName: websecure
  hostnames:
    - "seerr.kerrlab.app"
  rules:
    # Dynamic Web UI, Login, APIs & Assets (DIRECT)
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: seerr-ui
          port: 5055
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: seerr-ui-redirect-eg
spec:
  parentRefs:
    - name: internal-gateway
      namespace: edge
      sectionName: websecure
  hostnames:
    - "overseerr.kerrlab.app"
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            hostname: seerr.kerrlab.app
            statusCode: 301
