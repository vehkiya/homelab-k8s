apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cross-seed-external-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-store

  target:
    name: cross-seed-secrets
    creationPolicy: Owner

  data:
    - secretKey: API_KEY
      remoteRef:
        key: media/cross-seed
        property: API_KEY
    - secretKey: PROWLARR_API_KEY
      remoteRef:
        key: media/prowlarr
        property: PROWLARR_API_KEY
    - secretKey: SONARR_TV_API_KEY
      remoteRef:
        key: media/sonarr-tv
        property: SONARR_API_KEY
    - secretKey: SONARR_ANIME_API_KEY
      remoteRef:
        key: media/sonarr-anime
        property: SONARR_API_KEY
    - secretKey: RADARR_API_KEY
      remoteRef:
        key: media/radarr
        property: RADARR_API_KEY
    - secretKey: MWN_WEBHOOK_TOKEN
      remoteRef:
        key: automation/media-webhook-notifier
        property: webhook_token
