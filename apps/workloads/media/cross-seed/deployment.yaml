apiVersion: apps/v1
kind: Deployment
metadata:
  name: cross-seed
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cross-seed
  template:
    metadata:
      labels:
        app: cross-seed
        networking/expose-web-ui: "true"
    spec:
      initContainers:
        - name: inject-secrets
          image: ghcr.io/hononeko/k8s-config-tools
          command:
            - /bin/sh
            - -c
            - |
              if [ ! -f /config/cross-seed.db ]; then
                gomplate -f /template/config.js -o /config/config.js
              fi
          envFrom:
            - secretRef:
                name: cross-seed-secrets
          volumeMounts:
            - name: cross-seed-template-vol
              mountPath: /template
              readOnly: true
            - name: cross-seed-config-pvc
              mountPath: /config
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "50m"
              memory: "32Mi"
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
      containers:
        - name: cross-seed
          image: ghcr.io/cross-seed/cross-seed
          args:
            - daemon
          env:
            - name: TZ
              value: "Europe/Chisinau"
          ports:
            - name: web-ui
              containerPort: 2468
              protocol: TCP
          startupProbe:
            httpGet:
              path: /api/ping
              port: web-ui
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/ping
              port: web-ui
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/ping
              port: web-ui
            initialDelaySeconds: 0
            periodSeconds: 20
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 5
          resources:
            requests:
              cpu: "25m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: media
              mountPath: /data
            - name: cross-seed-config-pvc
              mountPath: /config
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
      securityContext:
        fsGroupChangePolicy: OnRootMismatch
        fsGroup: 100
        runAsGroup: 100
        runAsNonRoot: true
        runAsUser: 1027
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: media-pvc
        - name: cross-seed-template-vol
          configMap:
            name: cross-seed-config-template
        - name: cross-seed-config-pvc
          persistentVolumeClaim:
            claimName: cross-seed-config-longhorn-pvc
