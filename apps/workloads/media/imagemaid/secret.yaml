apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: imagemaid-secrets
spec:
  target:
    name: imagemaid-secrets

  secretStoreRef:
    name: openbao-store
    kind: ClusterSecretStore

  data:
    # Admin token: ImageMaid downloads the DB via /diagnostics/databases
    - secretKey: PLEX_TOKEN
      remoteRef:
        key: media/kometa
        property: PLEX_TOKEN
