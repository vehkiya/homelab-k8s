apiVersion: v1
kind: Service
metadata:
  name: jellyfin-ui
  labels:
    pool: internal-lb-pool
    # LAN (L2) announcement only from the node-type=performance node the pod is pinned to
    # (cilium/l2-announcements.yaml); Cilium's L2 lease ignores externalTrafficPolicy
    l2.kerrlab.app/node-type: performance
  annotations:
    lbipam.cilium.io/ips: "10.10.1.132"
spec:
  type: LoadBalancer
  # BGP advertises the IP only from the pod's node, and the client IP is preserved
  externalTrafficPolicy: Local
  selector:
    app: jellyfin
  ports:
    - name: web-ui
      port: 8096
      targetPort: web-ui
---
apiVersion: v1
kind: Service
metadata:
  name: jellyfin-discovery
spec:
  selector:
    app: jellyfin
  ports:
    - name: auto-discovery
      protocol: UDP
      port: 7359
      targetPort: 7359
    - name: dlna
      protocol: UDP
      port: 1900
      targetPort: 1900
