# Envoy Gateway copy of jellyfin-ui-external-route (migration); the Traefik route stays until cutover
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jellyfin-ui-external-route-eg
spec:
  parentRefs:
    - name: external-gateway
      namespace: edge
      sectionName: dmz
  hostnames:
    - "jellyfin.kerrlab.app"
  rules:
    # Upload paths (plan D3): no CrowdSec body inspection, see upload-exceptions-eg.yaml
    - name: uploads
      matches:
        - method: POST
          path:
            type: Exact
            value: /UserImage
        - method: POST
          path:
            type: RegularExpression
            value: /Items/[^/]+/Images/[^/]+(/[0-9]+)?
        - method: POST
          path:
            type: RegularExpression
            value: /Videos/[^/]+/Subtitles
        - method: POST
          path:
            type: RegularExpression
            value: /Audio/[^/]+/Lyrics
        - method: POST
          path:
            type: Exact
            value: /Branding/Splashscreen
        - method: POST
          path:
            type: Exact
            value: /ClientLog/Document
      backendRefs:
        - name: jellyfin-ui
          port: 8096
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: jellyfin-ui
          port: 8096
