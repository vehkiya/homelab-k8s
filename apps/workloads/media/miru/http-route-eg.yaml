apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: miru-route-eg
spec:
  parentRefs:
    - name: internal-gateway
      namespace: edge
      sectionName: websecure
  hostnames:
    - "miru.kerrlab.app"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: miru
          port: 8080
