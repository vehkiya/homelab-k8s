apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: media

helmCharts:
  - name: miru
    repo: oci://ghcr.io/hononeko/charts
    version: 1.3.0
    releaseName: miru
    namespace: media
    valuesFile: values/values.yml
    skipTests: true

resources:
  - secret.yaml
  - http-route-eg.yaml
  - network-policy.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: media-services

images:
  - name: ghcr.io/hononeko/miru
    newTag: 1.3.0@sha256:a0b3462222220cb07b0f48a7962ee4b5bb56b6ef409db7f4b9ef6387aa637dd1

patches:
  - target:
      kind: Deployment
      name: miru
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/ports/0/name
        value: web-ui
  - target:
      kind: Service
      name: miru
    patch: |-
      - op: replace
        path: /spec/ports/0/name
        value: web-ui
      - op: replace
        path: /spec/ports/0/targetPort
        value: web-ui
