apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: media

helmCharts:
  - name: miru
    repo: oci://ghcr.io/hononeko/charts
    version: 1.1.0
    releaseName: miru
    namespace: media
    valuesFile: values/values.yml
    skipTests: true

resources:
  - secret.yaml
  - http-route-eg.yaml
  - network-policy.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: media-services

images:
  - name: ghcr.io/hononeko/miru
    newTag: 1.2.0@sha256:e0122549385cfd7cb866edf0d00082c5f83eb66f3d631f263a2fa69d88767aff

patches:
  - target:
      kind: Deployment
      name: miru
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/ports/0/name
        value: web-ui
  - target:
      kind: Service
      name: miru
    patch: |-
      - op: replace
        path: /spec/ports/0/name
        value: web-ui
      - op: replace
        path: /spec/ports/0/targetPort
        value: web-ui
