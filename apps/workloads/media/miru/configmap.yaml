apiVersion: v1
kind: ConfigMap
metadata:
  name: miru-config
data:
  DB_ENGINE: "postgres"
  DATABASE_URL: "jdbc:postgresql://fortress.kerrlab.app:15432/miru"
  # The NAS PostgreSQL is shared by many apps; a single Miru pod needs few connections.
  DATABASE_MAX_POOL_SIZE: "5"
  AUTH_MODE: "oidc"
  AUTH_ALLOW_LOCAL_LOGIN: "false"
  OIDC_ENABLED: "true"
  OIDC_ISSUER_URL: "https://auth.kerrlab.app"
  OIDC_CLIENT_ID: "miru"
  OIDC_REDIRECT_URI: "https://miru.kerrlab.app/api/v1/auth/oidc/callback"
  OIDC_DISPLAY_NAME: "Kerrlab SSO"
  OIDC_SCOPES: "openid,profile,email,groups"
  OIDC_GROUPS_CLAIM: "groups"
  OIDC_ADMIN_GROUPS: "administrators,privileged-users"
  OIDC_USER_GROUPS: "users,app-miru-users"
  OIDC_AUTO_LINK_BY_EMAIL: "true"
  OIDC_POST_LOGOUT_REDIRECT_URI: "https://miru.kerrlab.app/login"
  TZ: "Europe/Chisinau"
