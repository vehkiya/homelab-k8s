apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: miru-policy
spec:
  endpointSelector:
    matchLabels:
      app: miru
  egress:
    - toEndpoints:
        - matchLabels:
            app: plex
      toPorts:
        - ports:
            - port: "32400"
              protocol: TCP
    - toEntities:
        - "world"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
