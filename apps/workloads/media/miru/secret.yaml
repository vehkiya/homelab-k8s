apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: miru-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-store
    kind: ClusterSecretStore
  target:
    name: miru-secrets
    creationPolicy: Owner
  data:
    - secretKey: AUTH_SESSION_SECRET
      remoteRef:
        key: media/miru
        property: AUTH_SESSION_SECRET
    - secretKey: MIRU_ENCRYPTION_KEY
      remoteRef:
        key: media/miru
        property: MIRU_ENCRYPTION_KEY
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: media/miru
        property: OIDC_CLIENT_SECRET
