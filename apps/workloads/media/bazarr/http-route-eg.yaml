# Envoy Gateway copy of bazarr-route (migration); the Traefik route stays until cutover
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bazarr-route-eg
  labels:
    edge.kerrlab.app/forward-auth: authelia
spec:
  parentRefs:
    - name: internal-gateway
      namespace: edge
      sectionName: websecure
  hostnames:
    - "bazarr.kerrlab.app"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /anime
      backendRefs:
        - name: bazarr-anime-ui
          port: 6767
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: bazarr-ui
          port: 6767
