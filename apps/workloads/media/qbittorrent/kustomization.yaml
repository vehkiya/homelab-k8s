  - name: ghcr.io/hononeko/qbit-ntfy-sidecar
    newTag: 1.1.0@sha256:99ae517544583fa65d4c41aa84cf6dfc95bd430756c5783f8a3fac0401392576
  - name: ghcr.io/qdm12/gluetun
    newTag: v3.41.3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
