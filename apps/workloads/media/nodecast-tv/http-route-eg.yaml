# Envoy Gateway copy of nodecast-tv-route (migration); the Traefik route stays until cutover
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nodecast-tv-route-eg
spec:
  parentRefs:
    - name: internal-gateway
      namespace: edge
      sectionName: websecure
  hostnames:
    - "nodecast.kerrlab.app"
  rules:
    - matches:
        - path:
            type: Exact
            value: /login.html
        - path:
            type: Exact
            value: /api/auth/login
      filters:
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: /api/auth/oidc/login
            statusCode: 302
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: keda-add-ons-http-interceptor-proxy
          namespace: networking
          port: 8080
