apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: nodecast-tv-policy
spec:
  endpointSelector:
    matchLabels:
      app: nodecast-tv

  # ----=== Ingress ===----
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: networking
            app.kubernetes.io/component: interceptor
      toPorts:
        - ports:
            - port: "3000"
              protocol: "TCP"

  # ----=== Egress ===----
  egress:
    # === Allow access to external and host network ===
    - toEntities:
        - "world"
        - "host"
        - "remote-node"
