apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: radarr-external-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-store

  target:
    name: radarr-secrets
    creationPolicy: Owner

  data:
    - secretKey: RADARR_API_KEY
      remoteRef:
        key: media/radarr
        property: RADARR_API_KEY
    - secretKey: POSTGRES_USER
      remoteRef:
        key: media/radarr
        property: POSTGRES_USER
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: media/radarr
        property: POSTGRES_PASSWORD
    - secretKey: POSTGRES_PORT
      remoteRef:
        key: media/radarr
        property: POSTGRES_PORT
    - secretKey: POSTGRES_HOST
      remoteRef:
        key: media/radarr
        property: POSTGRES_HOST
    - secretKey: POSTGRES_MAIN_DB
      remoteRef:
        key: media/radarr
        property: POSTGRES_MAIN_DB
    - secretKey: POSTGRES_LOG_DB
      remoteRef:
        key: media/radarr
        property: POSTGRES_LOG_DB