# Envoy Gateway copy of speedtest-route (migration); the Traefik route stays until cutover
# No copy of the 35 MiB buffering middleware: Envoy streams request bodies, and
# requestBuffer would hold every parallel upload in proxy memory and skew results.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: speedtest-route-eg
spec:
  parentRefs:
    - name: internal-gateway
      namespace: edge
      sectionName: websecure
  hostnames:
    - "speed.kerrlab.app"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: keda-add-ons-http-interceptor-proxy
          namespace: networking
          port: 8080
