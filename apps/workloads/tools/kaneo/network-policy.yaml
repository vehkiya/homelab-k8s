apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kaneo-policy
spec:
  endpointSelector:
    matchLabels:
      app: kaneo
  egress:
    # 1. Connection to PostgreSQL and S3 on Fortress
    - toCIDR:
        - "10.10.1.218/32"
      toPorts:
        - ports:
            - port: "15432"
              protocol: TCP
            - port: "8333"
              protocol: TCP
    # 2. Outbound internet access (OIDC/S3/webhooks)
    - toEntities:
        - "world"
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
            - port: "443"
              protocol: TCP
    # 3. Connection to Valkey
    - toEndpoints:
        - matchLabels:
            app: kaneo-valkey
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kaneo-valkey-policy
spec:
  endpointSelector:
    matchLabels:
      app: kaneo-valkey
  ingress:
    # Allow access from Kaneo
    - fromEndpoints:
        - matchLabels:
            app: kaneo
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
