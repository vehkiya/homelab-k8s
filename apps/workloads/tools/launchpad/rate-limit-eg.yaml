# Envoy Gateway copy of the Traefik rate limit (average 20, burst 60; web UI, so the burst value), per client IP
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: launchpad-rate-limit
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: launchpad-route-eg
  # Keeps the gateway's timeouts and error pages
  mergeType: StrategicMerge
  rateLimit:
    local:
      rules:
        - clientSelectors:
            - sourceCIDR:
                type: Distinct
                value: 0.0.0.0/0
          limit:
            requests: 60
            unit: Second
        - clientSelectors:
            - sourceCIDR:
                type: Distinct
                value: ::/0
          limit:
            requests: 60
            unit: Second
