apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: launchpad-route
spec:
  parentRefs:
    # Internal only; the apex has its own listener on internal-gateway
    - name: internal-gateway
      namespace: traefik
      sectionName: websecure-apex
  hostnames:
    - "kerrlab.app"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: launchpad
          port: 3000
      filters:
        - type: ExtensionRef
          extensionRef:
            group: "traefik.io"
            kind: "Middleware"
            name: "launchpad-rate-limit"
        - type: ExtensionRef
          extensionRef:
            group: "traefik.io"
            kind: "Middleware"
            name: "authelia-forward-auth"
