apiVersion: v1
kind: ServiceAccount
metadata:
  name: launchpad
  labels:
    app: launchpad
---
# Read-only, cluster-wide: route discovery and cluster telemetry
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: launchpad-reader
  labels:
    app: launchpad
rules:
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["nodes", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: launchpad-reader
  labels:
    app: launchpad
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: launchpad-reader
subjects:
  - kind: ServiceAccount
    name: launchpad
    namespace: tools
---
# ArgoCD sync status, and syncs (patching an Application's /operation)
# limited to the argocd namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: launchpad-argocd-sync
  namespace: argocd
  labels:
    app: launchpad
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list", "watch", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: launchpad-argocd-sync
  namespace: argocd
  labels:
    app: launchpad
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: launchpad-argocd-sync
subjects:
  - kind: ServiceAccount
    name: launchpad
    namespace: tools
---
# Longhorn storage pool usage for the telemetry strip
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: launchpad-longhorn-reader
  namespace: longhorn-system
  labels:
    app: launchpad
rules:
  - apiGroups: ["longhorn.io"]
    resources: ["nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: launchpad-longhorn-reader
  namespace: longhorn-system
  labels:
    app: launchpad
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: launchpad-longhorn-reader
subjects:
  - kind: ServiceAccount
    name: launchpad
    namespace: tools
---
# Sleep/wake for workloads annotated launchpad.kerrlab.app/scalable: "true" in
# games: read the workloads, and change only their replica count
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: launchpad-workload-scaler
  namespace: games
  labels:
    app: launchpad
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale", "statefulsets/scale"]
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: launchpad-workload-scaler
  namespace: games
  labels:
    app: launchpad
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: launchpad-workload-scaler
subjects:
  - kind: ServiceAccount
    name: launchpad
    namespace: tools
