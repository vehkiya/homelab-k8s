apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# No top-level `namespace:`: it would also rewrite the Roles in argocd and
# longhorn-system (rbac.yaml). Everything without an explicit namespace lands in
# `tools`, the workloads-tools ApplicationSet's destination.

labels:
  - pairs:
      app.kubernetes.io/name: launchpad

resources:
  - configmap.yaml
  - rbac.yaml
  - deployment.yaml
  - service.yaml
  - http-route.yaml
  - rate-limit.yaml
  - valkey.yaml
  - network-policy.yaml

# authelia-forward-auth in `tools` is provided by whoami's forward-auth component:
# one app per namespace owns it, the others only reference it (see media/*)

images:
  - name: ghcr.io/hononeko/homelab-launchpad
    newTag: 0.3.1@sha256:d80c7f10b2be1698b7df11850013a5b735994ad833f527e59745b18e46cfa35e
  - name: docker.io/valkey/valkey
    newTag: 9.2-alpine@sha256:cdcb7b1c7b6f1c9cb9442c71ac6275e78184657448407b2c1fdde7ee8024f4fb
