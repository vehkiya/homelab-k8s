---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keeper
  labels:
    app: keeper
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: keeper
  template:
    metadata:
      labels:
        app: keeper
        networking/expose-web-ui: "true"
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: keeper
          image: ghcr.io/ridafkih/keeper-services:2.24.1
          ports:
            - name: web-ui
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: keeper-config
            - secretRef:
                name: keeper-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1024Mi"
          livenessProbe:
            httpGet:
              path: /
              port: web-ui
              httpHeaders:
                - name: Accept
                  value: text/html
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: web-ui
              httpHeaders:
                - name: Accept
                  value: text/html
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
        - name: mcp
          image: ghcr.io/ridafkih/keeper-mcp:2.24.1
          ports:
            - name: mcp
              containerPort: 3002
              protocol: TCP
          env:
            - name: MCP_PORT
              value: "3002"
            - name: MCP_PUBLIC_URL
              value: "https://keeper.kerrlab.app/mcp"
            - name: MCP_API_URL
              value: "http://127.0.0.1:3001"
            - name: BETTER_AUTH_URL
              value: "https://keeper.kerrlab.app"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: keeper-secrets
                  key: DATABASE_URL
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: keeper-secrets
                  key: BETTER_AUTH_SECRET
          resources:
            requests:
              cpu: "20m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: mcp
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: mcp
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
