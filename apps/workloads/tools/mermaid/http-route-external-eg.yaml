# Envoy Gateway copy of mermaid-route-external (migration); the Traefik route stays until cutover
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mermaid-route-external-eg
spec:
  parentRefs:
    - name: external-gateway
      namespace: edge
      sectionName: dmz
  hostnames:
    - "mermaid.kerrlab.app"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: keda-add-ons-http-interceptor-proxy
          namespace: networking
          port: 8080
