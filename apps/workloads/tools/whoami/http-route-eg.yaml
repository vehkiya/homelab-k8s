# Envoy Gateway copy of whoami-route (migration canary); the Traefik route stays until cutover
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: whoami-route-eg
  labels:
    edge.kerrlab.app/forward-auth: authelia
spec:
  parentRefs:
    - name: internal-gateway
      namespace: edge
      sectionName: websecure
  hostnames:
    - "whoami.kerrlab.app"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: keda-add-ons-http-interceptor-proxy
          namespace: networking
          port: 8080
