fullnameOverride: "penpot"

serviceAccount:
  enabled: true
  name: "penpot"

config:
  publicUri: "https://penpot.kerrlab.app"
  # SSO-only authentication: password registration & login disabled, OIDC auto-registration enabled
  flags: "disable-registration disable-login-with-password disable-email-verification enable-login-with-oidc enable-oidc-registration enable-admin-console enable-mcp"
  existingSecret: "penpot-secrets"
  secretKeys:
    apiSecretKey: "PENPOT_SECRET_KEY"
  telemetryEnabled: false

  postgresql:
    host: "fortress.kerrlab.app"
    port: 15432
    database: "penpot"
    existingSecret: "penpot-secrets"
    secretKeys:
      usernameKey: "POSTGRES_USER"
      passwordKey: "POSTGRES_PASSWORD"

  redis:
    host: "penpot-valkey"
    port: 6379
    database: "0"

  objectsStorage:
    storageBackend: "s3"
    s3:
      region: "us-east-1"
      bucket: "penpot"
      endpointURI: "https://s3.kerrlab.app"
      existingSecret: "penpot-secrets"
      secretKeys:
        accessKeyIDKey: "AWS_ACCESS_KEY_ID"
        secretAccessKey: "AWS_SECRET_ACCESS_KEY"

  providers:
    existingSecret: "penpot-secrets"
    secretKeys:
      oidcClientSecretKey: "OIDC_CLIENT_SECRET"
    oidc:
      enabled: true
      baseURI: "https://auth.kerrlab.app"
      clientID: "penpot"
      scopes: "openid profile email"
      roles: ""

  extraEnvs:
    - name: PENPOT_SSRF_ALLOWED_HOSTS
      value: "auth.kerrlab.app fortress.kerrlab.app s3.kerrlab.app"
    - name: PENPOT_OIDC_NAME
      value: "Authelia SSO"

backend:
  replicaCount: 1
  deploymentAnnotations:
    kube-linter.io/ignore-all: "true"
  resources:
    requests:
      cpu: "100m"
      memory: "1Gi"
    limits:
      cpu: "1000m"
      memory: "2Gi"

frontend:
  replicaCount: 1
  deploymentAnnotations:
    kube-linter.io/ignore-all: "true"
  podLabels:
    networking/expose-web-ui: "true"
  resources:
    requests:
      cpu: "10m"
      memory: "64Mi"
    limits:
      cpu: "250m"
      memory: "1Gi"

exporter:
  replicaCount: 1
  deploymentAnnotations:
    kube-linter.io/ignore-all: "true"
  resources:
    requests:
      cpu: "100m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1.5Gi"

adminConsole:
  replicaCount: 1
  deploymentAnnotations:
    kube-linter.io/ignore-all: "true"
  resources:
    requests:
      cpu: "20m"
      memory: "128Mi"
    limits:
      cpu: "250m"
      memory: "256Mi"

mcp:
  replicaCount: 1
  deploymentAnnotations:
    kube-linter.io/ignore-all: "true"
  resources:
    requests:
      cpu: "20m"
      memory: "128Mi"
    limits:
      cpu: "250m"
      memory: "256Mi"

persistence:
  assets:
    enabled: false

gateway:
  enabled: false

ingress:
  enabled: false
