apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tools

labels:
  - pairs:
      app: the-lounge

resources:
  - longhorn-config-pvc.yaml

# Never prune or cascade-delete volumes from Argo; removal is manual
commonAnnotations:
  argocd.argoproj.io/sync-options: Prune=false,Delete=false
