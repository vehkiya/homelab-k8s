# Envoy Gateway copy of bentopdf-rate-limit (Traefik burst value), per client IP
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: bentopdf-external-route-rate-limit
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: bentopdf-external-route-eg
  # Keeps the gateway's timeouts and error pages
  mergeType: StrategicMerge
  rateLimit:
    local:
      rules:
        - clientSelectors:
            - sourceCIDR:
                type: Distinct
                value: 0.0.0.0/0
          limit:
            requests: 50
            unit: Second
        - clientSelectors:
            - sourceCIDR:
                type: Distinct
                value: ::/0
          limit:
            requests: 50
            unit: Second
