apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bentopdf-route
spec:
  parentRefs:
    - name: internal-gateway
      namespace: traefik
  hostnames:
    - "pdf.kerrlab.app"
  rules:
    # 1. Static Assets (Cached)
    - matches:
        - path:
            type: PathPrefix
            value: /css
        - path:
            type: PathPrefix
            value: /js
        - path:
            type: PathPrefix
            value: /images
        - path:
            type: PathPrefix
            value: /fonts
        - path:
            type: Exact
            value: /favicon.ico
        - path:
            type: PathPrefix
            value: /static
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: http-cache
      backendRefs:
        - name: keda-add-ons-http-interceptor-proxy
          namespace: networking
          port: 8080

    # 2. PDF Conversions, Uploads & App Shell (Bypass Cache)
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Cross-Origin-Opener-Policy
                value: same-origin
              - name: Cross-Origin-Embedder-Policy
                value: require-corp
      backendRefs:
        - name: keda-add-ons-http-interceptor-proxy
          namespace: networking
          port: 8080
