apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agentic-ticket-proxy-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-store
  target:
    name: agentic-ticket-proxy-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: DATABASE_USER
      remoteRef:
        key: automation/agentic-ticket-proxy
        property: POSTGRES_USER
    - secretKey: DATABASE_PASSWORD
      remoteRef:
        key: automation/agentic-ticket-proxy
        property: POSTGRES_PASSWORD
    - secretKey: KANEO_API_TOKEN
      remoteRef:
        key: automation/agentic-ticket-proxy
        property: KANEO_API_TOKEN
    - secretKey: KEYRING_PASSWORD
      remoteRef:
        key: automation/agentic-ticket-proxy
        property: KEYRING_PASSWORD
    - secretKey: TELEGRAM_BOT_TOKEN
      remoteRef:
        key: telegram/bots
        property: YAP_BOT
    - secretKey: TELEGRAM_CHAT_ID
      remoteRef:
        key: telegram/channels
        property: ENGINEERING_CHANNEL
