apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentic-ticket-proxy
  labels:
    app: agentic-ticket-proxy
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: agentic-ticket-proxy
  template:
    metadata:
      labels:
        app: agentic-ticket-proxy
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: init-creds-dirs
          image: ghcr.io/hononeko/agentic-ticket-proxy
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -e
              mkdir -p /creds/bin /creds/claude-share /creds/claude /creds/gemini /creds/gh /creds/ssh /creds/keyrings
              chmod 700 /creds/ssh /creds/keyrings
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: cli-credentials
              mountPath: /creds
      containers:
        - name: proxy
          image: ghcr.io/hononeko/agentic-ticket-proxy
          imagePullPolicy: IfNotPresent
          ports:
            - name: http-api
              containerPort: 8080
              protocol: TCP
          env:
            - name: TZ
              value: "Europe/Chisinau"
            - name: CLAUDE_CONFIG_DIR
              value: "/home/agent/.claude"
            - name: DISABLE_AUTOUPDATER
              value: "1"
            - name: GIT_CONFIG_GLOBAL
              value: "/home/agent/.config/gh/gitconfig"
            - name: KANEO_BASE_URL
              value: "http://kaneo.tools.svc.cluster.local:5173"
            - name: TELEGRAM_ALLOWED_USER_IDS
              value: "369764187"
            - name: DATABASE_URL
              value: "jdbc:postgresql://fortress.kerrlab.app:15432/atp"
          envFrom:
            - secretRef:
                name: agentic-ticket-proxy-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          startupProbe:
            httpGet:
              path: /healthz
              port: http-api
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /healthz
              port: http-api
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http-api
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: cli-credentials
              mountPath: /home/agent/.local/bin
              subPath: bin
            - name: cli-credentials
              mountPath: /home/agent/.local/share/claude
              subPath: claude-share
            - name: cli-credentials
              mountPath: /home/agent/.claude
              subPath: claude
            - name: cli-credentials
              mountPath: /home/agent/.gemini
              subPath: gemini
            - name: cli-credentials
              mountPath: /home/agent/.config/gh
              subPath: gh
            - name: cli-credentials
              mountPath: /home/agent/.ssh
              subPath: ssh
            - name: cli-credentials
              mountPath: /home/agent/.local/share/keyrings
              subPath: keyrings
            - name: worktrees-data
              mountPath: /var/lib/agent-proxy
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: cli-credentials
          persistentVolumeClaim:
            claimName: atp-cli-credentials-pvc
        - name: worktrees-data
          persistentVolumeClaim:
            claimName: atp-worktrees-data-pvc
        - name: tmp
          emptyDir: {}
