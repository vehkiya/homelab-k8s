apiVersion: apps/v1
kind: Deployment
metadata:
  name: otbr-agent
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: otbr-agent
  template:
    metadata:
      labels:
        app: otbr-agent
      annotations:
        k8s.v1.cni.cncf.io/networks: '[{ "name": "macvlan-iot", "mac": "02:00:00:00:10:00", "ips": ["192.168.4.221/24", "fd00:2:244::221/64"] }]'
    spec:
      volumes:
        - name: shared-tty
          emptyDir: {}
        - name: dev-pts
          hostPath:
            path: /dev/pts
            type: Directory
        - name: tun-device
          hostPath:
            path: /dev/net/tun
            type: CharDevice
        - name: otbr-data
          persistentVolumeClaim:
            claimName: otbr-data-pvc

      containers:
        # 1. Socat Network-to-Serial bridge
        - name: socat-tunnel
          image: alpine/socat:1.8.1.3@sha256:d85531a29ef5ba99dfb4717485c239307e2902d522a1bc010992a2728c92cfad
          command:
            - sh
            - -c
            - |
              while true; do
                echo "[socat-tunnel] Connecting to 192.168.4.46:6638..."
                rm -f /shared/ttyOTBR
                socat pty,link=/shared/ttyOTBR,raw,echo=0 tcp:192.168.4.46:6638,keepalive,keepidle=10,keepintvl=5,keepcnt=3,retry=30,interval=2
                echo "[socat-tunnel] Connection lost, retrying in 2s..."
                sleep 2
              done
          volumeMounts:
            - name: shared-tty
              mountPath: /shared
            - name: dev-pts
              mountPath: /dev/pts
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "50m"
              memory: "32Mi"
          env:
            - name: TZ
              value: "Europe/Chisinau"

        # 2. Official OpenThread Border Router Agent
        - name: otbr-agent
          image: openthread/otbr:latest@sha256:db799aed61f61a87d0cd8ae69546a973455f18b40f2cc8e6ae6dea803e5f6d35
          command:
            - sh
            - -c
            - |
              cleanup() {
                echo "[Supervisor] Cleaning up child processes..."
                [ -n "$ENTRYPOINT_PID" ] && kill -TERM "$ENTRYPOINT_PID" 2>/dev/null || true
                [ -n "$MONITOR_PID" ] && kill -TERM "$MONITOR_PID" 2>/dev/null || true
              }

              trap 'cleanup; exit 143' TERM INT HUP

              # Start official border router entrypoint
              /app/etc/docker/test/docker_entrypoint.sh spinel+hdlc+uart:///shared/ttyOTBR &
              ENTRYPOINT_PID=$!

              # Self-healing background monitor and configuration loop
              (
                sleep 5
                while true; do
                  if ! service otbr-agent status >/dev/null 2>&1; then
                    echo "[Monitor] otbr-agent is not running! Starting it..."
                    service otbr-agent start || true
                    sleep 3
                  fi
                  # Tune CCA threshold to -60 dBm so radio transmissions succeed despite
                  # ambient 2.4 GHz RF energy on Channel 15 (-65 dBm) exceeding OpenThread's -75 dBm default.
                  ot-ctl -I wpan0 ccathreshold -60 >/dev/null 2>&1 || true

                  STATE=$(ot-ctl -I wpan0 state 2>/dev/null || true)
                  case "$STATE" in
                    *disabled*)
                      echo "[Monitor] Thread is disabled. Configuring dataset and starting..."
                      ot-ctl dataset set active "$THREAD_DATASET" || true
                      ot-ctl ifconfig up || true
                      ot-ctl thread start || true
                      sleep 5
                      ;;
                    *child*|*router*|*leader*)
                      # INTENTIONAL: advertise the Thread prefix with HIGH preference so
                      # matter-server prefers this OTBR over the Google Nest Hub and Aqara
                      # Hub M3, which advertise the same prefix at MEDIUM.
                      ot-ctl br rioprf high || true
                      ot-ctl br routeprf high || true
                      ot-ctl netdata register || true
                      ;;
                  esac
                  sleep 15
                done
              ) &
              MONITOR_PID=$!

              # Supervise the entrypoint: exit with it so the container restarts
              while true; do
                if ! kill -0 "$ENTRYPOINT_PID" 2>/dev/null; then
                  wait "$ENTRYPOINT_PID"
                  EXIT_CODE=$?
                  echo "[Supervisor] Entrypoint process ($ENTRYPOINT_PID) exited with status $EXIT_CODE"
                  cleanup
                  exit "$EXIT_CODE"
                fi

                sleep 2
              done
          env:
            - name: TZ
              value: "Europe/Chisinau"
            - name: INFRA_INTERFACE
              value: "net1"
            - name: BACKBONE_INTERFACE
              value: "net1"
            - name: RADIO_URL
              value: "spinel+hdlc+uart:///shared/ttyOTBR"
            - name: NAT64
              value: "0"
            - name: DNS64
              value: "0"
            - name: FIREWALL
              value: "0"
            - name: THREAD_DATASET
              valueFrom:
                secretKeyRef:
                  name: otbr-credentials
                  key: dataset
          securityContext:
            privileged: true
          volumeMounts:
            - name: shared-tty
              mountPath: /shared
            - name: dev-pts
              mountPath: /dev/pts
            - name: tun-device
              mountPath: /dev/net/tun
            - name: otbr-data
              mountPath: /var/lib/thread
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"

        # 3. User-space NAT proxy (github.com/hononeko/thread-udp-proxy). It relays
        # matter-server's UDP/5540 traffic, which reaches this pod through the
        # high-preference route above, into the Thread mesh with this pod as the
        # source, so replies come back through it. Matter sessions are not bound
        # to IP. Shares the pod's network namespace, so it sees net1 and wpan0.
        # Its client sockets are bound to wpan0, so it only relays into the mesh,
        # whatever the Thread prefix is: don't pin one, the OMR prefix changes
        # whenever the border routers elect a new one.
        - name: thread-udp-proxy
          image: ghcr.io/hononeko/thread-udp-proxy:1.0.0@sha256:ec8ec1c529f3bf68883a53526153c314b421d3fe8216f9a5b68657de66d67ee7
          env:
            - name: TZ
              value: "Europe/Chisinau"
            - name: PROXY_INTERFACE
              value: "net1"
            - name: PROXY_THREAD_INTERFACE
              value: "wpan0"
            - name: PROXY_PORT
              value: "5540"
          ports:
            - name: health
              containerPort: 9090
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          securityContext:
            runAsNonRoot: true
            # distroless "nonroot"; numeric so the kubelet can verify runAsNonRoot
            runAsUser: 65532
            runAsGroup: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              # Raw packet socket on net1; without it the binary can't execute.
              add: ["NET_RAW"]
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "250m"
              memory: "32Mi"
