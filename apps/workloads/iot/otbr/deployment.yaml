apiVersion: apps/v1
kind: Deployment
metadata:
  name: otbr-agent
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: otbr-agent
  template:
    metadata:
      labels:
        app: otbr-agent
      annotations:
        k8s.v1.cni.cncf.io/networks: '[{ "name": "macvlan-iot", "mac": "02:00:00:00:10:00", "ips": ["192.168.4.221/24", "fd00:2:244::221/64"] }]'
    spec:
      volumes:
        - name: shared-tty
          emptyDir: {}
        - name: dev-pts
          hostPath:
            path: /dev/pts
            type: Directory
        - name: tun-device
          hostPath:
            path: /dev/net/tun
            type: CharDevice
        - name: otbr-data
          persistentVolumeClaim:
            claimName: otbr-data-pvc
        - name: otbr-config
          configMap:
            name: otbr-config
            defaultMode: 0755

      containers:
        # 1. Socat Network-to-Serial bridge
        - name: socat-tunnel
          image: alpine/socat
          command:
            - sh
            - -c
            - |
              while true; do
                echo "[socat-tunnel] Connecting to 192.168.4.46:6638..."
                rm -f /shared/ttyOTBR
                socat pty,link=/shared/ttyOTBR,raw,echo=0 tcp:192.168.4.46:6638,keepalive,keepidle=10,keepintvl=5,keepcnt=3,retry=30,interval=2
                echo "[socat-tunnel] Connection lost, retrying in 2s..."
                sleep 2
              done
          volumeMounts:
            - name: shared-tty
              mountPath: /shared
            - name: dev-pts
              mountPath: /dev/pts
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "50m"
              memory: "32Mi"
          env:
            - name: TZ
              value: "Europe/Chisinau"

        # 2. OpenThread Border Router. s6-overlay (/init) runs otbr-agent and otbr-web;
        # otbr-config (configMap) runs as a legacy s6 service once otbr-agent is ready.
        - name: otbr-agent
          image: openthread/border-router
          env:
            - name: TZ
              value: "Europe/Chisinau"
            - name: OT_RCP_DEVICE
              value: "spinel+hdlc+uart:///shared/ttyOTBR"
            - name: OT_INFRA_IF
              value: "net1"
            - name: OT_THREAD_IF
              value: "wpan0"
            - name: THREAD_DATASET
              valueFrom:
                secretKeyRef:
                  name: otbr-credentials
                  key: dataset
          securityContext:
            privileged: true
          volumeMounts:
            - name: shared-tty
              mountPath: /shared
            - name: dev-pts
              mountPath: /dev/pts
            - name: tun-device
              mountPath: /dev/net/tun
            # The image links /var/lib/thread to /data/thread
            - name: otbr-data
              mountPath: /data/thread
            - name: otbr-config
              mountPath: /etc/services.d/otbr-config/run
              subPath: run
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"

        # 3. User-space NAT proxy (github.com/hononeko/thread-udp-proxy). It relays
        # matter-server's UDP/5540 traffic, which reaches this pod through the
        # high-preference route above, into the Thread mesh with this pod as the
        # source, so replies come back through it. Matter sessions are not bound
        # to IP. Shares the pod's network namespace, so it sees net1 and wpan0.
        # Its client sockets are bound to wpan0, so it only relays into the mesh,
        # whatever the Thread prefix is: don't pin one, the OMR prefix changes
        # whenever the border routers elect a new one.
        - name: thread-udp-proxy
          image: ghcr.io/hononeko/thread-udp-proxy
          env:
            - name: TZ
              value: "Europe/Chisinau"
            - name: PROXY_INTERFACE
              value: "net1"
            - name: PROXY_THREAD_INTERFACE
              value: "wpan0"
            - name: PROXY_PORT
              value: "5540"
          ports:
            - name: health
              containerPort: 9090
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          securityContext:
            runAsNonRoot: true
            # distroless "nonroot"; numeric so the kubelet can verify runAsNonRoot
            runAsUser: 65532
            runAsGroup: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              # Raw packet socket on net1; without it the binary can't execute.
              add: ["NET_RAW"]
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "250m"
              memory: "32Mi"
