apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: otbr-policy
spec:
  endpointSelector:
    matchLabels:
      app: otbr-agent

  # ----=== Ingress ===----
  ingress:
    # Allow mDNS, Thread discovery & Multicast Ingress
    - fromCIDR:
        - 192.168.4.0/24
        - fd00::/8
        - fc00::/7
        - fe80::/10
        - 224.0.0.0/4
        - ff00::/8

    # Allow Prometheus to scrape thread-udp-proxy's metrics
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP

  # ----=== Egress ===----
  egress:
    # Egress to Serial-over-IP Coordinator (SLZB-06M)
    - toCIDR:
        - 192.168.4.46/32
      toPorts:
        - ports:
            - port: "6638"
              protocol: TCP

    # Egress to IoT VLAN, Thread Subnets & Multicast
    - toCIDR:
        - 192.168.4.0/24
        - fd00::/8
        - fc00::/7
        - fe80::/10
        - 224.0.0.0/4
        - ff00::/8
