apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: thread-udp-proxy
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: otbr-agent
  podMetricsEndpoints:
    # thread-udp-proxy's health and metrics server (relay counters and latency histograms)
    - port: health
      path: /metrics
      interval: 30s
