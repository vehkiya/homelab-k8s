apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mosquitto-passwordfile-es
spec:
  target:
    name: mosquitto-passwordfile

  secretStoreRef:
    name: openbao-store
    kind: ClusterSecretStore

  data:
    - secretKey: password_key
      remoteRef:
        key: iot/mosquitto
        property: password_key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mosquitto-credentials-es
spec:
  target:
    name: mosquitto-credentials

  secretStoreRef:
    name: openbao-store
    kind: ClusterSecretStore

  data:
    - secretKey: user
      remoteRef:
        key: iot/mosquitto
        property: user
    - secretKey: password
      remoteRef:
        key: iot/mosquitto
        property: password
---
# The exporter's own read-only MQTT user; its password hash is also in password_key (the broker's passwordfile).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mqtt-exporter-credentials-es
spec:
  target:
    name: mqtt-exporter-credentials

  secretStoreRef:
    name: openbao-store
    kind: ClusterSecretStore

  data:
    - secretKey: user
      remoteRef:
        key: iot/mosquitto
        property: exporter_user
    - secretKey: password
      remoteRef:
        key: iot/mosquitto
        property: exporter_password
