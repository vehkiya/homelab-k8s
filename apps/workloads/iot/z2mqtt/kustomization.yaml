apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: iot

labels:
  - pairs:
      app.kubernetes.io/name: z2mqtt

resources:
  - network-policy.yaml
  - deployment.yaml
  - service.yaml
  - http-route.yaml
  - persistence
# Hashed name: a config change rolls the Deployment
configMapGenerator:
  - name: zigbee2mqtt-config
    files:
      - configuration.yaml=config/configuration.yaml
components:
  - ../../../common/forward-auth
images:
  - name: busybox
    newTag: 1.38@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
  - name: ghcr.io/koenkk/zigbee2mqtt
    newTag: 2.14.2@sha256:addbfb08fcef2e4477de1535636118241e10d13e898fbe4d9faba8a4d7396311
