apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: iot

labels:
  - pairs:
      app.kubernetes.io/name: z2mqtt

resources:
  - network-policy.yaml
  - deployment.yaml
  - service.yaml
  - http-route.yaml
  - persistence
# The name gets a hash of the content, so a config change rolls the Deployment (an init container copies the file into
# the PVC at start, where Zigbee2MQTT may also write to it).
configMapGenerator:
  - name: zigbee2mqtt-config
    files:
      - configuration.yaml=config/configuration.yaml
components:
  - ../../../common/forward-auth
images:
  - name: busybox
    newTag: 1.38@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
  - name: ghcr.io/koenkk/zigbee2mqtt
    newTag: 2.14.2@sha256:addbfb08fcef2e4477de1535636118241e10d13e898fbe4d9faba8a4d7396311
