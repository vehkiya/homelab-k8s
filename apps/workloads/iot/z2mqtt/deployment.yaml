# 8-z2m-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zigbee2mqtt
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: zigbee2mqtt
  template:
    metadata:
      labels:
        app: zigbee2mqtt
        networking/expose-web-ui: "true"
    spec:
      initContainers:
        - name: copy-config
          image: busybox
          command:
            - "sh"
            - "-c"
            - "cp /config/configuration.yaml /data/configuration.yaml"
          volumeMounts:
            - name: config # Mount the read-only configmap
              mountPath: /config
            - name: data # Mount the read-write persistent volume
              mountPath: /data
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "25m"
              memory: "32Mi"
      containers:
        - name: zigbee2mqtt
          image: ghcr.io/koenkk/zigbee2mqtt
          ports:
            - containerPort: 8080
              name: web-ui
          # z2m can stay running after losing its coordinator while its shutdown hangs
          # with the frontend already closed (Traefik 503, MQTT still connected). The
          # frontend answering is the cheapest end-to-end liveness signal it has.
          startupProbe:
            httpGet:
              path: /
              port: web-ui
            periodSeconds: 5
            failureThreshold: 36 # up to 3 minutes for the adapter to come up
          livenessProbe:
            httpGet:
              path: /
              port: web-ui
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: web-ui
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          env:
            - name: ZIGBEE2MQTT_CONFIG_MQTT_SERVER
              value: "mqtt://mosquitto-svc.iot.svc.cluster.local"
            - name: ZIGBEE2MQTT_CONFIG_MQTT_USER
              valueFrom:
                secretKeyRef:
                  name: mosquitto-credentials
                  key: user
            - name: ZIGBEE2MQTT_CONFIG_MQTT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mosquitto-credentials
                  key: password
          volumeMounts:
            - name: data
              mountPath: /app/data
          resources:
            requests:
              cpu: "10m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: zigbee2mqtt-data-pvc
        - name: config
          configMap:
            name: zigbee2mqtt-config
