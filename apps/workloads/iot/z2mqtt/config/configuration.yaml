permit_join: false

mqtt:
  base_topic: zigbee2mqtt
  server: 'mqtt://mosquitto-svc.iot.svc.cluster.local'
  # user and password: ZIGBEE2MQTT_CONFIG_MQTT_USER/PASSWORD, from the mosquitto-credentials Secret

# Ethernet coordinator
serial:
  port: tcp://192.168.4.36:6638
  baudrate: 115200
  adapter: ember
  rtscts: false

frontend:
  port: 8080
  enabled: true
  url: 'https://zigbee.kerrlab.app'
homeassistant:
  enabled: true
  discovery_topic: 'homeassistant'
  status_topic: 'homeassistant/status'

# Timeouts in minutes
availability:
  enabled: true
  active:
    timeout: 10
  passive:
    timeout: 1500

advanced:
  transmit_power: 20
  log_level: info
  log_output:
    - console
    # /app/data/log on the PVC, rotated (last 10 runs)
    - file
