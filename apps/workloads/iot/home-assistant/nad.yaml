apiVersion: "k8s.cni.cncf.io/v1"
kind: NetworkAttachmentDefinition
metadata:
  name: macvlan-iot
spec:
  config: |-
    {
      "cniVersion": "0.3.1",
      "type": "macvlan",
      "master": "bond0.2",
      "mode": "bridge",
      "mtu": 1280,
      "capabilities": { "ips": true },
      "ipam": {
        "type": "static",
        "routes": [
          { "dst": "224.0.0.0/4" },
          { "dst": "ff00::/8" }
        ]
      }
    }
# Note: No "0.0.0.0/0" route here.
# This forces IPv4 (DNS/HA) to use the Cluster Network (eth0).
#
# Static IPAM: every pod MUST set "mac" and "ips" in its network annotation.
# host-local kept a separate pool per node and handed the same IP to pods on
# different nodes. Reserved range 192.168.4.220-230 / fd00:2:244::220-230:
#   .221 / ::221  otbr-agent      02:00:00:00:10:00
#   .222 / ::222  matter-server   02:00:00:00:20:00
#   .223 / ::223  home-assistant  02:00:00:00:30:00
#   .224 / ::224  go2rtc          02:00:00:00:40:00
