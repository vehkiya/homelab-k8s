apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: iot

labels:
  - pairs:
      app.kubernetes.io/name: home-assistant

resources:
  - deployment.yaml
  - service.yaml
  - http-route.yaml
  - http-route-eg.yaml
  - nad.yaml
  - network-policy.yaml
  - external-secret.yaml
  - persistence

configMapGenerator:
  - name: home-assistant-config
    files:
      - configuration.yaml.template=template/configuration.yaml
      - pill_separator.yaml=template/pill_separator.yaml
      - patch_frosted_glass.py=template/patch_frosted_glass.py
  - name: home-assistant-wallpapers
    files:
      - frosted-glass-dark-bpr.jpg=template/wallpapers/frosted-glass-dark-bpr.jpg
      - frosted-glass-light-bpr.jpg=template/wallpapers/frosted-glass-light-bpr.jpg

images:
  - name: ghcr.io/home-operations/home-assistant
    newTag: 2026.11.1@sha256:c129b1e4190273254d93d413fe2a083233c9202d84cb08f84dddb01861df432e
  - name: ghcr.io/hononeko/k8s-config-tools
    newTag: 0.1.1@sha256:fb03e8e7910a51472309b361675f38da44ee398ab6ec64b020b660d4d0d4e400
