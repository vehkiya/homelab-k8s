apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: iot

labels:
  - pairs:
      app.kubernetes.io/name: home-assistant

resources:
  - deployment.yaml
  - service.yaml
  - http-route.yaml
  - http-route-eg.yaml
  - nad.yaml
  - network-policy.yaml
  - external-secret.yaml
  - persistence

configMapGenerator:
  - name: home-assistant-config
    files:
      - configuration.yaml.template=template/configuration.yaml
      - pill_separator.yaml=template/pill_separator.yaml
      - patch_frosted_glass.py=template/patch_frosted_glass.py
      - frosted-glass-overrides.yaml=template/frosted-glass-overrides.yaml
  - name: home-assistant-wallpapers
    files:
      - frosted-glass-dark-bpr.jpg=template/wallpapers/frosted-glass-dark-bpr.jpg
      - frosted-glass-light-bpr.jpg=template/wallpapers/frosted-glass-light-bpr.jpg

images:
  - name: ghcr.io/home-operations/home-assistant
    newTag: 2026.11.2@sha256:28ae630554f1f2dd43ecbdecad9d974f09f02b17a0a769a290ceec094ec427dc
  - name: ghcr.io/hononeko/k8s-config-tools
    newTag: 0.1.2@sha256:659cbeceefffbfd34b98957d3c6d5e3f0ac6a5fb3887efe4c4bbbe45787cc75f
