apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: home-assistant-recorder
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-store
    kind: ClusterSecretStore
  target:
    name: home-assistant-recorder
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        RECORDER_DB_URL: "postgresql://{{ .RECORDER_DB_USER }}:{{ .RECORDER_DB_PASSWORD }}@fortress.kerrlab.app:15432/{{ .RECORDER_DB_NAME }}"
  data:
    - secretKey: RECORDER_DB_USER
      remoteRef:
        key: iot/home-assistant
        property: RECORDER_DB_USER
    - secretKey: RECORDER_DB_PASSWORD
      remoteRef:
        key: iot/home-assistant
        property: RECORDER_DB_PASSWORD
    - secretKey: RECORDER_DB_NAME
      remoteRef:
        key: iot/home-assistant
        property: RECORDER_DB_NAME
