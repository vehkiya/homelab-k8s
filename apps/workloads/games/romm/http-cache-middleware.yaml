apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: http-cache
  namespace: games
spec:
  plugin:
    souin:
      default_cache:
        ttl: 86400s
        max_cacheable_body_bytes: 10485760
        timeout:
          backend: 30s
          cache: 5s
        allowed_http_verbs:
          - GET
          - HEAD
        regex:
          exclude: ".*(/auth|/login|/oauth|/token|/verify|/users|/admin|/gateway|/ws|/download|/process|/upload).*"
        badger:
          configuration:
            Dir: "/plugins-storage/souin-badger"
            ValueDir: "/plugins-storage/souin-badger"
            MemTableSize: 67108864
            ValueLogFileSize: 268435456
            ValueThreshold: 1024
      log_level: info
