# Upload exception (plan D3): replaces the gateway CrowdSec policy (edge/crowdsec) on the
# uploads rule without bodyToExtAuth, so bodies over 1 MiB pass instead of getting 413.
# Bans, URI and header rules still apply.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: romm-uploads-crowdsec
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: romm-ui-external-route-eg
      sectionName: uploads
  extAuth:
    grpc:
      backendRefs:
        - name: crowdsec-envoy-bouncer
          namespace: security
          port: 8080
      # Prefer the replica on the proxy's own node (each node is its own zone)
      backendSettings:
        loadBalancer:
          type: LeastRequest
          zoneAware:
            preferLocal:
              minEndpointsThreshold: 1
    timeout: 2s
    failOpen: true
