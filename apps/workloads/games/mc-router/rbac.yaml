apiVersion: v1
kind: ServiceAccount
metadata:
  name: mc-router
  namespace: games
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mc-router
  namespace: games
rules:
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: [""]
    resources: ["services", "pods"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mc-router
  namespace: games
subjects:
  - kind: ServiceAccount
    name: mc-router
    namespace: games
roleRef:
  kind: Role
  name: mc-router
  apiGroup: rbac.authorization.k8s.io
