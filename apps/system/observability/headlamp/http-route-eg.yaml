# Envoy Gateway copy of headlamp-route (migration); the Traefik route stays until cutover
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: headlamp-route-eg
spec:
  parentRefs:
    - name: internal-gateway
      namespace: edge
      sectionName: websecure
  hostnames:
    - "cluster.kerrlab.app"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: headlamp
          port: 80
