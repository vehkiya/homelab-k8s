clusterRoleBinding:
  create: false

resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi

config:
  sessionTTL: null
  oidc:
    secret:
      create: false
    externalSecret:
      enabled: true
      name: headlamp-oidc-credentials
    scopes: "openid profile email groups"
    useAccessToken: false
    usePKCE: true
    useCookie: true
    issuerURL: "https://auth.kerrlab.app"
