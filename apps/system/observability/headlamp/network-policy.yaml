apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: headlamp-egress
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: headlamp
  egress:
    # 1. Allow Kubernetes API Access (OIDC Hairpin is handled by ccnp-allow-oidc-client-egress)
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: "TCP"

