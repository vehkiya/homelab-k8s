apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - name: spegel
    repo: oci://ghcr.io/spegel-org/helm-charts
    version: 0.7.4
    releaseName: spegel
    namespace: spegel
    valuesFile: values/values.yaml

namespace: spegel
resources:
  - namespace.yaml
  - network-policy.yaml

configMapGenerator:
  - name: spegel-dashboard
    options:
      labels:
        grafana_dashboard: "1"
    files:
      - spegel.json=dashboards/spegel.json
generatorOptions:
  disableNameSuffixHash: true
