prometheus:
  prometheusSpec:
    retention: 15d
    retentionSize: 40GiB
    walCompression: true
    enableFeatures:
      - memory-snapshot-on-shutdown
      - new-service-discovery-manager
    resources:
      requests:
        cpu: 100m
        memory: 1536Mi
      limits:
        cpu: 2000m
        memory: 3072Mi
    securityContext:
      fsGroup: 2000
      runAsNonRoot: true
      runAsUser: 1000
    containers:
      - name: prometheus
        securityContext:
          readOnlyRootFilesystem: false
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes: [ "ReadWriteOnce" ]
          resources:
            requests:
              storage: 50Gi # Adjust size as needed

alertmanager:
  alertmanagerSpec:
    useExistingSecret: true
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes: [ "ReadWriteOnce" ]
          resources:
            requests:
              storage: 10Gi # Adjust
grafana:
  deploymentStrategy:
    type: Recreate
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1024Mi
  persistence:
    enabled: true
    storageClassName: longhorn
    accessModes: [ "ReadWriteOnce" ]
    size: 10Gi
  admin:
    existingSecret: "app-secrets-grafana"
    userKey: user
    passwordKey: password
  sidecar:
    dashboards:
      startupProbe:
        httpGet:
          port: 8081
    datasources:
      startupProbe:
        httpGet:
          port: 8082

coreDns:
  enabled: true
  service:
    enabled: true
    port: 9153
    targetPort: 9153

    ipDualStack:
      enabled: false
      ipFamilies: [ "IPv6", "IPv4" ]
      ipFamilyPolicy: "PreferDualStack"
    selector:
      k8s-app: coredns

kubeProxy:
  enabled: false

# Expose Cilium policy validity and Argo CD tracking as metrics, for the alerts in cilium-alerts.yaml
kube-state-metrics:
  rbac:
    extraRules:
      - apiGroups: ["cilium.io"]
        resources: ["ciliumnetworkpolicies", "ciliumclusterwidenetworkpolicies"]
        verbs: ["list", "watch"]
  customResourceState:
    enabled: true
    config:
      kind: CustomResourceStateMetrics
      spec:
        resources:
          - groupVersionKind:
              group: cilium.io
              version: v2
              kind: CiliumNetworkPolicy
            metricNamePrefix: kube_cilium_networkpolicy
            labelsFromPath:
              name: [metadata, name]
              namespace: [metadata, namespace]
            metrics:
              - name: info
                help: "One series per CiliumNetworkPolicy"
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      uid: [metadata, uid]
              # Only emitted when the annotation exists (kube-state-metrics skips the series otherwise)
              - name: argocd_tracked
                help: "CiliumNetworkPolicy managed by Argo CD, with its tracking id"
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      argocd_tracking_id: [metadata, annotations, "argocd.argoproj.io/tracking-id"]
              - name: condition
                help: "CiliumNetworkPolicy status conditions (1 = True)"
                each:
                  type: Gauge
                  gauge:
                    path: [status, conditions]
                    labelsFromPath:
                      type: [type]
                    valueFrom: [status]
          - groupVersionKind:
              group: cilium.io
              version: v2
              kind: CiliumClusterwideNetworkPolicy
            metricNamePrefix: kube_cilium_clusterwidenetworkpolicy
            labelsFromPath:
              name: [metadata, name]
            metrics:
              - name: info
                help: "One series per CiliumClusterwideNetworkPolicy"
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      uid: [metadata, uid]
              # Only emitted when the annotation exists (kube-state-metrics skips the series otherwise)
              - name: argocd_tracked
                help: "CiliumClusterwideNetworkPolicy managed by Argo CD, with its tracking id"
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      argocd_tracking_id: [metadata, annotations, "argocd.argoproj.io/tracking-id"]
              - name: condition
                help: "CiliumClusterwideNetworkPolicy status conditions (1 = True)"
                each:
                  type: Gauge
                  gauge:
                    path: [status, conditions]
                    labelsFromPath:
                      type: [type]
                    valueFrom: [status]
