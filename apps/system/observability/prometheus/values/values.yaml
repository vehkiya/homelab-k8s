prometheus:
  prometheusSpec:
    retention: 15d
    retentionSize: 40Gi
    walCompression: true
    enableFeatures:
      - memory-snapshot-on-shutdown
      - new-service-discovery-manager
    resources:
      requests:
        cpu: 100m
        memory: 1536Mi
      limits:
        cpu: 2000m
        memory: 3072Mi
    securityContext:
      fsGroup: 2000
      runAsNonRoot: true
      runAsUser: 1000
    containers:
      - name: prometheus
        securityContext:
          readOnlyRootFilesystem: false
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes: [ "ReadWriteOnce" ]
          resources:
            requests:
              storage: 50Gi # Adjust size as needed

alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes: [ "ReadWriteOnce" ]
          resources:
            requests:
              storage: 10Gi # Adjust
grafana:
  deploymentStrategy:
    type: Recreate
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1024Mi
  persistence:
    enabled: true
    storageClassName: longhorn
    accessModes: [ "ReadWriteOnce" ]
    size: 10Gi
  admin:
    existingSecret: "app-secrets-grafana"
    userKey: user
    passwordKey: password
  sidecar:
    dashboards:
      startupProbe:
        httpGet:
          port: 8081
    datasources:
      startupProbe:
        httpGet:
          port: 8082

coreDns:
  enabled: true
  service:
    enabled: true
    port: 9153
    targetPort: 9153

    ipDualStack:
      enabled: false
      ipFamilies: [ "IPv6", "IPv4" ]
      ipFamilyPolicy: "PreferDualStack"
    selector:
      k8s-app: coredns

kubeProxy:
  enabled: false
