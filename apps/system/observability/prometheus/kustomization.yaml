apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: observability
helmCharts:
  - name: kube-prometheus-stack
    repo: https://prometheus-community.github.io/helm-charts
    version: 92.16.1
    releaseName: kube-prometheus-stack
    namespace: observability
    valuesFile: values/values.yaml
    includeCRDs: true
resources:
  - secrets.yaml
  - network-policies.yaml
  - http-route.yaml
  - critical-alerts.yaml
  - cilium-alerts.yaml
  - argocd-alerts.yaml

patches:
  - path: patch-grafana-deployment.yaml
  - path: patch-grafana-service.yaml

configMapGenerator:
  - name: iot-communication-dashboard
    options:
      labels:
        grafana_dashboard: "1"
    files:
      - iot-communication.json=dashboards/iot-communication.json
generatorOptions:
  disableNameSuffixHash: true
