apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: grafana-rules
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
      app.kubernetes.io/instance: kube-prometheus-stack
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: traefik
            app.kubernetes.io/name: traefik
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
  egress:
    - toEntities:
        - kube-apiserver
    - toServices:
        - k8sService:
            serviceName: kubernetes
            namespace: default
    - toCIDR:
        - "10.96.0.1/32"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: coredns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toServices:
        - k8sService:
            serviceName: coredns
            namespace: kube-system
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: prometheus
            app.kubernetes.io/instance: kube-prometheus-stack-prometheus
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
            - port: "443"
              protocol: TCP
        # 6. Allow connecting to Alertmanager
    - toServices:
        - k8sService:
            serviceName: kube-prometheus-stack-alertmanager
            namespace: observability
      toPorts:
        - ports:
            - port: "9093"
              protocol: TCP
        # 7. Allow connecting to Loki
    - toServices:
        - k8sService:
            serviceName: loki
            namespace: observability
      toPorts:
        - ports:
            - port: "3100"
              protocol: TCP
---
