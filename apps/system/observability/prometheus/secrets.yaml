apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app-secrets-grafana
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-store
  target:
    name: app-secrets-grafana
    creationPolicy: Owner
    template:
      metadata:
        labels:
          app: grafana
  data:
    - secretKey: user
      remoteRef:
        key: observability/grafana
        property: username
    - secretKey: password
      remoteRef:
        key: observability/grafana
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-kube-prometheus-stack-alertmanager
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-store
  target:
    name: alertmanager-kube-prometheus-stack-alertmanager
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        alertmanager.yaml: |
          global:
            resolve_timeout: 5m

          inhibit_rules:
            - source_matchers:
                - severity = "critical"
              target_matchers:
                - severity =~ "warning|info"
              equal: ['namespace', 'alertname']
            - source_matchers:
                - alertname = "KubeNodeNotReady"
              target_matchers:
                - alertname =~ "TargetDown|KubeletDown|KubePodNotReady|KubeNodeUnreachable"
              equal: ['node']

          route:
            group_by: ['category', 'namespace', 'alertname']
            group_wait: 30s
            group_interval: 5m
            repeat_interval: 12h
            receiver: 'null'
            routes:
              - receiver: 'null'
                matchers:
                  - alertname =~ "Watchdog|InfoInhibitor|CPUThrottlingHigh|KubeletTooManyPods|KubeHPA.*"
              - receiver: 'telegram-admin'
                matchers:
                  - alertname =~ "KubeNodeNotReady|KubeNodeUnreachable|NodeFilesystemSpaceFillingUp|NodeFilesystemAlmostOutOfSpace|NodeHardwarePressure|KubePersistentVolumeFillingUp|KubePersistentVolumeErrors|KubePersistentVolumeUnbound|CertManagerCertExpiringSoon|CertManagerCertNotReady|ExternalSecretSyncFailed|CoreDNSDown|TraefikHigh5xxErrorRate|CiliumAgentDown|CriticalNamespacePodCrashLooping|KubePodCrashLooping|KubeDeploymentReplicasMismatch"
                continue: false
              - receiver: 'telegram-admin'
                matchers:
                  - severity = "critical"
                continue: false

          receivers:
            - name: 'null'
            - name: 'telegram-admin'
              telegram_configs:
                - bot_token: "{{ .root_bot }}"
                  chat_id: {{ .admin_channel }}
                  parse_mode: 'HTML'
                  send_resolved: true
                  message: |
                    {{ "{{" }} if eq .Status "firing" {{ "}}" }}🔥 <b>[FIRING:{{ "{{" }} .Alerts.Firing | len {{ "}}" }}]</b>{{ "{{" }} else {{ "}}" }}✅ <b>[RESOLVED]</b>{{ "{{" }} end {{ "}}" }} <b>{{ "{{" }} .CommonLabels.alertname {{ "}}" }}</b>
                    {{ "{{" }} if .CommonLabels.category {{ "}}" }}<b>Category:</b> {{ "{{" }} .CommonLabels.category {{ "}}" }}
                    {{ "{{" }} end {{ "}}" }}<b>Severity:</b> {{ "{{" }} .CommonLabels.severity | title {{ "}}" }}
                    {{ "{{" }} if .CommonLabels.namespace {{ "}}" }}<b>Namespace:</b> <code>{{ "{{" }} .CommonLabels.namespace {{ "}}" }}</code>
                    {{ "{{" }} end {{ "}}" }}{{ "{{" }} if .CommonLabels.node {{ "}}" }}<b>Node:</b> <code>{{ "{{" }} .CommonLabels.node {{ "}}" }}</code>
                    {{ "{{" }} end {{ "}}" }}{{ "{{" }} if .CommonLabels.pod {{ "}}" }}<b>Pod:</b> <code>{{ "{{" }} .CommonLabels.pod {{ "}}" }}</code>
                    {{ "{{" }} end {{ "}}" }}{{ "{{" }} if .CommonLabels.persistentvolumeclaim {{ "}}" }}<b>PVC:</b> <code>{{ "{{" }} .CommonLabels.persistentvolumeclaim {{ "}}" }}</code>
                    {{ "{{" }} end {{ "}}" }}{{ "{{" }} if .CommonLabels.name {{ "}}" }}<b>Name:</b> <code>{{ "{{" }} .CommonLabels.name {{ "}}" }}</code>
                    {{ "{{" }} end {{ "}}" }}{{ "{{" }} if .CommonAnnotations.summary {{ "}}" }}<b>Summary:</b> {{ "{{" }} .CommonAnnotations.summary | html {{ "}}" }}
                    {{ "{{" }} end {{ "}}" }}{{ "{{" }} if .CommonAnnotations.description {{ "}}" }}<b>Description:</b> {{ "{{" }} .CommonAnnotations.description | html {{ "}}" }}
                    {{ "{{" }} end {{ "}}" }}
                    {{ "{{" }} if eq .Status "firing" {{ "}}" }}#alert #{{ "{{" }} .CommonLabels.severity {{ "}}" }}{{ "{{" }} if .CommonLabels.category {{ "}}" }} #{{ "{{" }} .CommonLabels.category | toLower {{ "}}" }}{{ "{{" }} end {{ "}}" }}{{ "{{" }} if .CommonLabels.namespace {{ "}}" }} #{{ "{{" }} .CommonLabels.namespace {{ "}}" }}{{ "{{" }} end {{ "}}" }}{{ "{{" }} else {{ "}}" }}#resolved{{ "{{" }} if .CommonLabels.namespace {{ "}}" }} #{{ "{{" }} .CommonLabels.namespace {{ "}}" }}{{ "{{" }} end {{ "}}" }}{{ "{{" }} end {{ "}}" }}
  data:
    - secretKey: admin_channel
      remoteRef:
        key: telegram/channels
        property: ADMIN_CHANNEL
    - secretKey: root_bot
      remoteRef:
        key: telegram/bots
        property: ROOT_BOT