apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: homelab-envoy-gateway-alerts
  namespace: observability
  labels:
    app: kube-prometheus-stack
    release: kube-prometheus-stack
spec:
  groups:
    - name: homelab.envoy-gateway.rules
      rules:
        # 1. A proxy fleet DaemonSet has nodes without a ready Envoy
        - alert: EnvoyProxyFleetUnavailable
          expr: kube_daemonset_status_number_unavailable{namespace="envoy-gateway-system"} > 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "Envoy proxy fleet {{ $labels.daemonset }} has unavailable pods"
            description: "{{ $value }} node(s) have no ready {{ $labels.daemonset }} pod. With externalTrafficPolicy Local those nodes drop out of the VIP."

        # 2. Controller below 2 replicas (new or restarted proxies get no config without it)
        - alert: EnvoyGatewayControllerDegraded
          expr: kube_deployment_status_replicas_available{namespace="envoy-gateway-system", deployment="envoy-gateway"} < 2
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Envoy Gateway controller has {{ $value }} available replica(s)"
            description: "The Envoy Gateway controller is below 2 replicas; a restarted proxy cannot become ready without it."

        # 3. A proxy rejected an xDS update and keeps serving its previous config
        - alert: EnvoyXdsUpdateRejected
          expr: sum by (pod, __name__) (increase({namespace="envoy-gateway-system", __name__=~"envoy_(listener_manager_lds|cluster_manager_cds)_update_rejected"}[10m])) > 0
          labels:
            severity: critical
          annotations:
            summary: "Envoy {{ $labels.pod }} rejected an xDS update ({{ $labels.__name__ }})"
            description: "The proxy kept its last good configuration. A restarted proxy will start without the rejected listeners or clusters. Check the controller logs."

        # 4. Proxy pods are generated by the controller and never pass CI linting
        - alert: EnvoyProxyContainerWithoutLimits
          expr: |
            (count by (namespace, pod, container) (kube_pod_container_info{namespace="envoy-gateway-system"})
              unless count by (namespace, pod, container) (kube_pod_container_resource_limits{namespace="envoy-gateway-system", resource="memory"}))
            or
            (count by (namespace, pod, container) (kube_pod_container_info{namespace="envoy-gateway-system"})
              unless count by (namespace, pod, container) (kube_pod_container_resource_limits{namespace="envoy-gateway-system", resource="cpu"}))
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.pod }}/{{ $labels.container }} has no CPU or memory limit"
            description: "A container in envoy-gateway-system runs without limits (AGENTS.md section 2). Set them in the EnvoyProxy resource or the chart values."

        # 5. Routes labeled for forward-auth in a namespace without the policy that enforces it
        - alert: EnvoyForwardAuthPolicyMissing
          expr: |
            count by (namespace) (kube_httproute_forward_auth{forward_auth="authelia"})
              unless on (namespace)
            count by (namespace) (kube_envoy_securitypolicy_info{name="authelia-forward-auth"})
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Forward-auth routes in {{ $labels.namespace }} are served without authentication"
            description: "{{ $value }} HTTPRoute(s) in {{ $labels.namespace }} carry edge.kerrlab.app/forward-auth=authelia, but the namespace has no authelia-forward-auth SecurityPolicy. Include apps/common/forward-auth in one app of that namespace."

        # 6. DMZ bouncer below 2 replicas (the CrowdSec policy fails open without it)
        - alert: CrowdSecEnvoyBouncerDegraded
          expr: kube_deployment_status_replicas_available{namespace="security", deployment="crowdsec-envoy-bouncer"} < 2
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "CrowdSec Envoy bouncer has {{ $value }} available replica(s)"
            description: "The DMZ fleet's ext_authz bouncer is below 2 replicas. At 0 the DMZ serves traffic without bans or WAF (failOpen)."

        - alert: CrowdSecEnvoyBouncerDown
          expr: (kube_deployment_status_replicas_available{namespace="security", deployment="crowdsec-envoy-bouncer"} or on() vector(0)) == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "CrowdSec Envoy bouncer is down: DMZ traffic is unfiltered"
            description: "No crowdsec-envoy-bouncer replica is available. The edge/crowdsec SecurityPolicy fails open, so DMZ requests skip CrowdSec bans and AppSec."

        # 7. Bouncer not polling LAPI (or vector(0): fires even if it never registered)
        - alert: CrowdSecEnvoyBouncerNotPulling
          expr: (sum(rate(cs_lapi_bouncer_requests_total{bouncer=~"envoy.*", route="/v1/decisions/stream"}[10m])) or on() vector(0)) == 0
          for: 10m
          labels:
            severity: critical
            category: Security
          annotations:
            summary: "CrowdSec Envoy bouncer is not pulling decisions"
            description: "CrowdSec LAPI has received no decision stream polls from the Envoy bouncer for more than 10 minutes. Check the bouncer key (BOUNCER_KEY_envoy) and the bouncer logs."

