apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: homelab-envoy-gateway-alerts
  namespace: observability
  labels:
    app: kube-prometheus-stack
    release: kube-prometheus-stack
spec:
  groups:
    - name: homelab.envoy-gateway.rules
      rules:
        # 1. A proxy fleet DaemonSet has nodes without a ready Envoy
        - alert: EnvoyProxyFleetUnavailable
          expr: kube_daemonset_status_number_unavailable{namespace="envoy-gateway-system"} > 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "Envoy proxy fleet {{ $labels.daemonset }} has unavailable pods"
            description: "{{ $value }} node(s) have no ready {{ $labels.daemonset }} pod. With externalTrafficPolicy Local those nodes drop out of the VIP."

        # 2. Controller below 2 replicas (new or restarted proxies get no config without it)
        - alert: EnvoyGatewayControllerDegraded
          expr: kube_deployment_status_replicas_available{namespace="envoy-gateway-system", deployment="envoy-gateway"} < 2
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Envoy Gateway controller has {{ $value }} available replica(s)"
            description: "The Envoy Gateway controller is below 2 replicas; a restarted proxy cannot become ready without it."

        # 3. A proxy rejected an xDS update and keeps serving its previous config
        # (one clause per resource type: increase() drops __name__)
        - alert: EnvoyXdsUpdateRejected
          expr: |
            (
              label_replace(sum by (pod) (increase(envoy_listener_manager_lds_update_rejected{namespace="envoy-gateway-system"}[10m])), "xds", "listeners (LDS)", "", "")
              or label_replace(sum by (pod) (increase(envoy_http_rds_update_rejected{namespace="envoy-gateway-system"}[10m])), "xds", "routes (RDS)", "", "")
              or label_replace(sum by (pod) (increase(envoy_cluster_manager_cds_update_rejected{namespace="envoy-gateway-system"}[10m])), "xds", "clusters (CDS)", "", "")
              or label_replace(sum by (pod) (increase(envoy_cluster_update_rejected{namespace="envoy-gateway-system"}[10m])), "xds", "endpoints (EDS)", "", "")
              or label_replace(sum by (pod) (increase(envoy_sds_update_rejected{namespace="envoy-gateway-system"}[10m])), "xds", "secrets (SDS)", "", "")
            ) > 0
          labels:
            severity: critical
          annotations:
            summary: "Envoy {{ $labels.pod }} rejected an xDS update ({{ $labels.xds }})"
            description: "The proxy kept its last good configuration. A restarted proxy will start without the rejected listeners or clusters. Check the controller logs."

        # 4. Proxy pods are generated by the controller and never pass CI linting
        - alert: EnvoyProxyContainerWithoutLimits
          expr: |
            (count by (namespace, pod, container) (kube_pod_container_info{namespace="envoy-gateway-system"})
              unless count by (namespace, pod, container) (kube_pod_container_resource_limits{namespace="envoy-gateway-system", resource="memory"}))
            or
            (count by (namespace, pod, container) (kube_pod_container_info{namespace="envoy-gateway-system"})
              unless count by (namespace, pod, container) (kube_pod_container_resource_limits{namespace="envoy-gateway-system", resource="cpu"}))
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.pod }}/{{ $labels.container }} has no CPU or memory limit"
            description: "A container in envoy-gateway-system runs without limits (AGENTS.md section 2). Set them in the EnvoyProxy resource or the chart values."

        # 5. Routes labeled for forward-auth in a namespace without the policy that enforces it
        - alert: EnvoyForwardAuthPolicyMissing
          expr: |
            count by (namespace) (kube_httproute_forward_auth{forward_auth="authelia"})
              unless on (namespace)
            count by (namespace) (kube_envoy_securitypolicy_info{name="authelia-forward-auth"})
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Forward-auth routes in {{ $labels.namespace }} are served without authentication"
            description: "{{ $value }} HTTPRoute(s) in {{ $labels.namespace }} carry edge.kerrlab.app/forward-auth=authelia, but the namespace has no authelia-forward-auth SecurityPolicy. Add the namespace to apps/system/networking/policies/forward-auth."

        # 6. DMZ bouncer below 2 replicas (the CrowdSec policy fails open without it)
        - alert: CrowdSecEnvoyBouncerDegraded
          expr: kube_deployment_status_replicas_available{namespace="security", deployment="crowdsec-envoy-bouncer"} < 2
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "CrowdSec Envoy bouncer has {{ $value }} available replica(s)"
            description: "The DMZ fleet's ext_authz bouncer is below 2 replicas. At 0 the DMZ serves traffic without bans or WAF (failOpen)."

        - alert: CrowdSecEnvoyBouncerDown
          expr: (kube_deployment_status_replicas_available{namespace="security", deployment="crowdsec-envoy-bouncer"} or on() vector(0)) == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "CrowdSec Envoy bouncer is down: DMZ traffic is unfiltered"
            description: "No crowdsec-envoy-bouncer replica is available. The edge/crowdsec SecurityPolicy fails open, so DMZ requests skip CrowdSec bans and AppSec."

        # 7. Bouncer not polling LAPI (or vector(0): fires even if it never registered)
        - alert: CrowdSecEnvoyBouncerNotPulling
          expr: (sum(rate(cs_lapi_bouncer_requests_total{bouncer=~"envoy.*", route="/v1/decisions/stream"}[10m])) or on() vector(0)) == 0
          for: 10m
          labels:
            severity: critical
            category: Security
          annotations:
            summary: "CrowdSec Envoy bouncer is not pulling decisions"
            description: "CrowdSec LAPI has received no decision stream polls from the Envoy bouncer for more than 10 minutes. Check the bouncer key (BOUNCER_KEY_envoy) and the bouncer logs."

        # 8. 5xx ratio per fleet and listener (replaces TraefikHigh5xxErrorRate)
        - alert: EnvoyHigh5xxRate
          expr: |
            (
              sum by (fleet, envoy_http_conn_manager_prefix) (label_replace(rate(envoy_http_downstream_rq_xx{namespace="envoy-gateway-system", envoy_response_code_class="5", envoy_http_conn_manager_prefix=~"https?-[0-9]+"}[5m]), "fleet", "$1", "pod", "envoy-(dmz|internal)-.*"))
                / sum by (fleet, envoy_http_conn_manager_prefix) (label_replace(rate(envoy_http_downstream_rq_xx{namespace="envoy-gateway-system", envoy_http_conn_manager_prefix=~"https?-[0-9]+"}[5m]), "fleet", "$1", "pod", "envoy-(dmz|internal)-.*"))
            ) * 100 > 10
            and
            sum by (fleet, envoy_http_conn_manager_prefix) (label_replace(rate(envoy_http_downstream_rq_xx{namespace="envoy-gateway-system", envoy_http_conn_manager_prefix=~"https?-[0-9]+"}[5m]), "fleet", "$1", "pod", "envoy-(dmz|internal)-.*")) > 0.1
          for: 5m
          labels:
            severity: critical
            category: Networking
          annotations:
            summary: "{{ $value | humanize }}% of {{ $labels.fleet }} responses on {{ $labels.envoy_http_conn_manager_prefix }} are 5xx"
            description: "More than 10% of responses on the {{ $labels.fleet }} fleet's {{ $labels.envoy_http_conn_manager_prefix }} listener were 5xx for 5 minutes. The access logs' response_code_details show whether upstreams or Envoy produced them."

        # 9. Envoy Gateway drops a rejected policy: CrowdSec fails open, forward-auth answers 500,
        # a ClientTrafficPolicy loses its client-IP rewrite and header stripping
        - alert: EnvoyPolicyNotAccepted
          expr: min by (namespace, name, customresource_kind) ({__name__=~"kube_envoy_(securitypolicy|clienttrafficpolicy)_accepted"}) == 0
          for: 5m
          labels:
            severity: critical
            category: Security
          annotations:
            summary: "{{ $labels.customresource_kind }} {{ $labels.namespace }}/{{ $labels.name }} is not accepted"
            description: "Envoy Gateway rejected the policy for at least one Gateway and serves its targets without it. The reason is in status.ancestors of the {{ $labels.customresource_kind }}."

        - alert: EnvoyBackendTrafficPolicyNotAccepted
          expr: min by (namespace, name) (kube_envoy_backendtrafficpolicy_accepted) == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "BackendTrafficPolicy {{ $labels.namespace }}/{{ $labels.name }} is not accepted"
            description: "Its rate limits, timeouts, load balancing or error pages are not applied to the targeted routes. The reason is in status.ancestors."

        # 10. A policy replaced by a more specific one (rule 1). edge/crowdsec is replaced by design:
        # upload exceptions and forward-auth take its place on their routes
        - alert: EnvoyPolicyOverridden
          expr: |
            max by (namespace, name, customresource_kind) ({__name__=~"kube_envoy_(securitypolicy|backendtrafficpolicy|clienttrafficpolicy)_overridden"}) == 1
              unless on (namespace, name, customresource_kind) kube_envoy_securitypolicy_overridden{namespace="edge", name="crowdsec"}
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.customresource_kind }} {{ $labels.namespace }}/{{ $labels.name }} is overridden"
            description: "Another policy replaces it on some targets, which can drop gateway defaults such as CrowdSec, timeouts or error pages. The overriding policies are listed in status.ancestors."

        # 11. Bouncer calls failing while the bouncer has endpoints (hung, unreachable, timing out).
        # At 0 endpoints the policy is rejected instead (alert 9 and CrowdSecEnvoyBouncerDown)
        - alert: CrowdSecEnvoyChecksFailingOpen
          expr: sum(rate(envoy_http_ext_authz_failure_mode_allowed{namespace="envoy-gateway-system", pod=~"envoy-dmz-.*"}[5m])) > 0
          for: 5m
          labels:
            severity: critical
            category: Security
          annotations:
            summary: "DMZ requests pass without CrowdSec checks"
            description: "Envoy let {{ $value | humanize }} req/s through on failOpen because the bouncer call failed. Bans and AppSec are not enforced, and each request waits up to the 2 s ext_authz timeout. Check the bouncer pods and the DMZ fleet's egress to security/crowdsec-envoy-bouncer:8080."

        # 12. Forward-auth calls failing: with failOpen false Envoy answers 403
        # (error counts both policies; only CrowdSec calls fail open)
        - alert: EnvoyForwardAuthErrors
          expr: |
            (
              sum by (fleet) (label_replace(increase(envoy_http_ext_authz_error{namespace="envoy-gateway-system"}[10m]), "fleet", "$1", "pod", "envoy-(dmz|internal)-.*"))
                - sum by (fleet) (label_replace(increase(envoy_http_ext_authz_failure_mode_allowed{namespace="envoy-gateway-system"}[10m]), "fleet", "$1", "pod", "envoy-(dmz|internal)-.*"))
            ) > 5
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Forward-auth checks fail on the {{ $labels.fleet }} fleet"
            description: "{{ $value | humanize }} Authelia ext_authz calls failed in 10 minutes, and forward-auth routes answer 403 until Authelia responds. Check the Authelia pods and the fleet's egress to security/authelia:9091."

        # 13. No controller replica holds the leader lease
        - alert: EnvoyGatewayControllerNoLeader
          expr: (sum(leader_election_master_status{namespace="envoy-gateway-system"}) or on() vector(0)) < 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Envoy Gateway controller has no leader"
            description: "No controller replica holds the leader lease, so policy and route statuses and the proxy DaemonSets and Services are not reconciled."
