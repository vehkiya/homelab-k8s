apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Gateway API CRDs (standard channel) and the safe-upgrades admission policy.
# The Traefik chart stopped shipping them in 40.2.0.
resources:
  # renovate: datasource=github-releases depName=kubernetes-sigs/gateway-api
  - https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.7.0/standard-install.yaml

# Deleting a CRD deletes every object of its kind (all HTTPRoutes and Gateways),
# so never let Argo prune or delete them.
commonAnnotations:
  argocd.argoproj.io/sync-options: Prune=false,Delete=false
