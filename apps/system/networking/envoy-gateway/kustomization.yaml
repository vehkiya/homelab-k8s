apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: envoy-gateway-system
helmCharts:
  # Envoy Gateway CRDs only; the Gateway API CRDs come from apps/system/networking/gateway-api
  - name: gateway-crds-helm
    repo: oci://docker.io/envoyproxy
    version: v1.10.0
    releaseName: envoy-gateway-crds
    namespace: envoy-gateway-system
    valuesInline:
      crds:
        gatewayAPI:
          enabled: false
        envoyGateway:
          enabled: true
  - name: gateway-helm
    repo: oci://docker.io/envoyproxy
    version: v1.10.0
    releaseName: envoy-gateway
    namespace: envoy-gateway-system
    valuesFile: values/envoy-gateway.yaml

resources:
  - network-policy.yaml
  - proxy-network-policy.yaml
  - servicemonitor.yaml
  - podmonitor.yaml

# From the gateway-addons-helm chart (v1.10.0)
configMapGenerator:
  - name: envoy-gateway-dashboards
    options:
      labels:
        grafana_dashboard: "1"
    files:
      - envoy-proxy-global.json=dashboards/envoy-proxy-global.json
      - envoy-clusters.json=dashboards/envoy-clusters.json
      - envoy-gateway-global.json=dashboards/envoy-gateway-global.json
      - envoy-gateway-resources.json=dashboards/envoy-gateway-resources.json
generatorOptions:
  disableNameSuffixHash: true

images:
  - name: dhi.io/envoy-gateway
    newTag: 1.10.0@sha256:229708b8baa31a31a1a83ffaaa84aacb16c29d2e7aa06d290cdb66bfa088c757

# Deleting a CRD deletes every object of its kind
patches:
  - target:
      kind: CustomResourceDefinition
    patch: |-
      - op: add
        path: /metadata/annotations/argocd.argoproj.io~1sync-options
        value: Prune=false,Delete=false
