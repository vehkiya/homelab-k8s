# Container ports: listeners below 1024 are shifted by 10000 (443 -> 10443, 80 -> 10080)
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cnp-envoy-internal
spec:
  description: "Internal proxy fleet: LAN, Tailscale and in-cluster clients in; xDS and backends out."
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: proxy
      gateway.envoyproxy.io/owning-gateway-namespace: edge
      gateway.envoyproxy.io/owning-gateway-name: internal-gateway
  ingress:
    - fromCIDR:
        - "10.10.1.0/24"
        - "192.168.1.0/24"
        - "192.168.4.0/24"
        - "192.168.11.0/24"
        - "192.168.29.0/24"
        - "100.64.0.0/10"
      toPorts:
        - ports:
            - port: "10080"
              protocol: TCP
            - port: "10443"
              protocol: TCP
            - port: "10443"
              protocol: UDP
            - port: "32400"
              protocol: TCP
    # In-cluster clients (OIDC hairpin, health probes of routed hosts)
    - fromEntities:
        - cluster
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "10080"
              protocol: TCP
            - port: "10443"
              protocol: TCP
            - port: "10443"
              protocol: UDP
            - port: "32400"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "19001"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: envoy-gateway-system
            control-plane: envoy-gateway
      toPorts:
        - ports:
            - port: "18000"
              protocol: TCP
    - toEntities:
        - cluster
---
# Accepts traffic only from Cloudflare (443) and the internet (Plex). No
# in-cluster entities: any pod reaching :10443 could forge CF-Connecting-IP.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cnp-envoy-dmz
spec:
  description: "DMZ proxy fleet: Cloudflare and Plex clients in; xDS, the CrowdSec bouncer and the DMZ backends out."
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: proxy
      gateway.envoyproxy.io/owning-gateway-namespace: edge
      gateway.envoyproxy.io/owning-gateway-name: external-gateway
  ingress:
    - fromCIDR:
        - "173.245.48.0/20"
        - "103.21.244.0/22"
        - "103.22.200.0/22"
        - "103.31.4.0/22"
        - "141.101.64.0/18"
        - "108.162.192.0/18"
        - "190.93.240.0/20"
        - "188.114.96.0/20"
        - "197.234.240.0/22"
        - "198.41.128.0/17"
        - "162.158.0.0/15"
        - "104.16.0.0/13"
        - "104.24.0.0/14"
        - "172.64.0.0/13"
        - "131.0.72.0/22"
        - "2400:cb00::/32"
        - "2606:4700::/32"
        - "2803:f800::/32"
        - "2405:b500::/32"
        - "2405:8100::/32"
        - "2a06:98c0::/29"
        - "2c0f:f248::/32"
      toPorts:
        - ports:
            - port: "10443"
              protocol: TCP
            - port: "10443"
              protocol: UDP
    - fromEntities:
        - world
      toPorts:
        - ports:
            - port: "32400"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "19001"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: envoy-gateway-system
            control-plane: envoy-gateway
      toPorts:
        - ports:
            - port: "18000"
              protocol: TCP
    # CrowdSec ext_authz
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: security
            app.kubernetes.io/name: crowdsec-envoy-bouncer
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # Backends that opt in with networking/expose-dmz (Authelia included: auth route and F1 ext-authz).
    # The namespace expression is required: without it a CNP selects its own namespace only.
    - toEndpoints:
        - matchLabels:
            networking/expose-dmz: "true"
          matchExpressions:
            - key: k8s:io.kubernetes.pod.namespace
              operator: Exists
      toPorts:
        - ports:
            - port: "web-ui"
              protocol: TCP
            - port: "http-api"
              protocol: TCP
    # Scale-to-zero DMZ routes (romm, bentopdf, mermaid, whoami)
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: networking
            app.kubernetes.io/component: interceptor
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # Helm-rendered or multi-component DMZ backends, selected explicitly
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: automation
            app.kubernetes.io/name: koshin
            app.kubernetes.io/component: proxy
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: automation
            app.kubernetes.io/name: n8n
      toPorts:
        - ports:
            - port: "5678"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: comms
          matchExpressions:
            - key: app
              operator: In
              values: [api, app-proxy, gateway, livekit, media-proxy, static-proxy]
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
            - port: "7880"
              protocol: TCP
