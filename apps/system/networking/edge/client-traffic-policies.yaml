# Per-listener client settings. Section-level policies don't merge, so each
# one carries the full set.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: internal-websecure
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: internal-gateway
      sectionName: websecure
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: internal-gateway
      sectionName: websecure-apex
  headers:
    requestID: PreserveOrGenerate
    withUnderscoresAction: DropHeader
    earlyRequestHeaders:
      remove:
        - X-Forwarded-For
        - X-Real-Ip
        - X-Envoy-External-Address
        - Remote-User
        - Remote-Groups
        - Remote-Name
        - Remote-Email
    # Returned to the client, as Traefik's request-id plugin does
    lateResponseHeaders:
      set:
        - name: X-Request-Id
          value: "%REQ(x-request-id)%"
  path:
    escapedSlashesAction: RejectRequest
  tls:
    minVersion: "1.3"
  http3: {}
  timeout:
    tcp:
      tlsHandshakeTimeout: 10s
    http:
      requestReceivedTimeout: 60s
      streamIdleTimeout: 1h
