apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: "cnp-traefik-perimeter"
spec:
  description: "Allows external traffic to Traefik (80/443) and allows Traefik to talk to k8s API and backend services."
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: traefik

  ingress:
    # Rule 1a: Allow Cloudflare proxy ranges to DMZ entrypoint (8443)
    - fromCIDR:
        - "173.245.48.0/20"
        - "103.21.244.0/22"
        - "103.22.200.0/22"
        - "103.31.4.0/22"
        - "141.101.64.0/18"
        - "108.162.192.0/18"
        - "190.93.240.0/20"
        - "188.114.96.0/20"
        - "197.234.240.0/22"
        - "198.41.128.0/17"
        - "162.158.0.0/15"
        - "104.16.0.0/13"
        - "104.24.0.0/14"
        - "172.64.0.0/13"
        - "131.0.72.0/22"
        - "2400:cb00::/32"
        - "2606:4700::/32"
        - "2803:f800::/32"
        - "2405:b500::/32"
        - "2405:8100::/32"
        - "2a06:98c0::/29"
        - "2c0f:f248::/32"
      toPorts:
        - ports:
            # === DMZ entrypoint ===
            - port: "8443"
              protocol: "UDP"
            - port: "8443"
              protocol: "TCP"

    # Rule 1b: Allow public internet and cluster to Plex entrypoint (32443)
    - fromEntities:
        - "world"
        - "cluster"
      toPorts:
        - ports:
            # === Plex entrypoint ===
            - port: "32443"
              protocol: "TCP"

    # Rule 1c: Allow the NAS to DMZ entrypoint (8443)
    # NAS containers pin auth.kerrlab.app to the DMZ VIP for OIDC
    - fromCIDR:
        - "10.10.1.218/32"
      toPorts:
        - ports:
            - port: "8443"
              protocol: "TCP"

    # Rule 2: Allow cluster, host, and remote-node to internal web (8000), DMZ (8443), and websecure (9443)
    - fromEntities:
        - "cluster"
        - "host"
        - "remote-node"
      toPorts:
        - ports:
            # === Internal web, DMZ, & websecure entrypoints ===
            - port: "8000"
              protocol: "TCP"
            - port: "8443"
              protocol: "UDP"
            - port: "8443"
              protocol: "TCP"
            - port: "9443"
              protocol: "UDP"
            - port: "9443"
              protocol: "TCP"

    # Rule 3: Allow trusted internal LAN, VLANs, and Tailscale VPN to internal web (8000), websecure (9443), and Plex (32443)
    - fromCIDR:
        - "10.10.1.0/24"
        - "192.168.1.0/24"
        - "192.168.4.0/24"
        - "192.168.11.0/24"
        - "192.168.29.0/24"
        - "100.64.0.0/10"
      toPorts:
        - ports:
            # === Internal web & websecure entrypoints ===
            - port: "8000"
              protocol: "TCP"
            - port: "9443"
              protocol: "UDP"
            - port: "9443"
              protocol: "TCP"
            # === Plex entrypoint ===
            - port: "32443"
              protocol: "TCP"

    # Rule 4: Allow Prometheus in observability namespace to scrape metrics (9100)
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "9100"
              protocol: "TCP"


  egress:
    # Rule 1: Allow Traefik to talk to kube-apiserver and cluster backends
    - toEntities:
        - "kube-apiserver"
        - "cluster"
---
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: "cnp-traefik-internal-services"
spec:
  description: "Allow Traefik to access internal error-pages service."
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: "error-pages"
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: "traefik"
            k8s:io.kubernetes.pod.namespace: "traefik"
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP