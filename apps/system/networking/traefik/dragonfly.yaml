apiVersion: v1
kind: Service
metadata:
  name: traefik-dragonfly
  labels:
    app.kubernetes.io/name: traefik-dragonfly
    app.kubernetes.io/component: cache
spec:
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP
  selector:
    app.kubernetes.io/name: traefik-dragonfly
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traefik-dragonfly
  labels:
    app.kubernetes.io/name: traefik-dragonfly
    app.kubernetes.io/component: cache
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: traefik-dragonfly
  template:
    metadata:
      labels:
        app.kubernetes.io/name: traefik-dragonfly
    spec:
      containers:
        - name: dragonfly
          image: ghcr.io/dragonflydb/dragonfly
          args:
            - "--proactor_threads=1"
            - "--force_epoll"
            - "--version_check=false"
            - "--maxmemory=256mb"
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "20m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
