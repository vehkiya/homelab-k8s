apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: traefik-dashboard-auth-secret
spec:
  target:
    name: traefik-dashboard-auth-secret
    template:
      type: kubernetes.io/basic-auth


  secretStoreRef:
    name: openbao-store
    kind: ClusterSecretStore

  data:
    - secretKey: username
      remoteRef:
        key: traefik/dashboard-auth
        property: username
    - secretKey: password
      remoteRef:
        key: traefik/dashboard-auth
        property: password