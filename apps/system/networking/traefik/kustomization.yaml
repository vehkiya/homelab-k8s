apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "1"

namespace: traefik
helmCharts:
  - name: traefik
    repo: https://traefik.github.io/charts
    version: 42.0.0
    releaseName: traefik
    namespace: traefik
    valuesFile: values/traefik-config.yaml
    includeCRDs: true

resources:
  - certificate.yaml
  - bouncer-secret.yaml
  - services.yaml
  - gateways.yaml
  - network-policy.yaml
  - error-pages.yaml
  - http-route.yaml
  - servicemonitor.yaml

configMapGenerator:
  - name: traefik-dashboard
    options:
      labels:
        grafana_dashboard: "1"
    files:
      - traefik.json=dashboards/traefik.json
generatorOptions:
  disableNameSuffixHash: true

images:
  - name: ghcr.io/tarampampam/error-pages
    newTag: 4.2.6@sha256:87434ca4b6461dbd956967922d5fe3eec2fba6ea46d7e8cdb0fac7e54bf78fc0
  - name: dhi.io/traefik
    newTag: 3.7.15@sha256:e4a8980654bc0d7bf683d9c495c4e94313d282ac7eeac51da6713e6fd9aa8b6e
