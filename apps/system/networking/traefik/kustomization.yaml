apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "1"

namespace: traefik
helmCharts:
  - name: traefik
    repo: https://traefik.github.io/charts
    version: 41.7.0
    releaseName: traefik
    namespace: traefik
    valuesFile: values/traefik-config.yaml
    includeCRDs: true

resources:
  - certificate.yaml
  - bouncer-secret.yaml
  - services.yaml
  - gateways.yaml
  - network-policy.yaml
  - error-pages.yaml
  - http-route.yaml
  - servicemonitor.yaml

configMapGenerator:
  - name: traefik-dashboard
    options:
      labels:
        grafana_dashboard: "1"
    files:
      - traefik.json=dashboards/traefik.json
generatorOptions:
  disableNameSuffixHash: true

images:
  - name: ghcr.io/tarampampam/error-pages
    newTag: 4.2.5@sha256:6d42b5d6e1a014fa2373e3587f9e85c25589a089fd5f6fc4f2a496858f5e365d
  - name: dhi.io/traefik
    newTag: 3.7.13@sha256:f3f03c346b8ef599c1ef8a975066d96561270c9737884dab222414e8d0fee473
