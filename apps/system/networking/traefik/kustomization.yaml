apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "1"

namespace: traefik
helmCharts:
  - name: traefik
    repo: https://traefik.github.io/charts
    version: 41.7.1
    releaseName: traefik
    namespace: traefik
    valuesFile: values/traefik-config.yaml
    includeCRDs: true

resources:
  - certificate.yaml
  - bouncer-secret.yaml
  - services.yaml
  - gateways.yaml
  - network-policy.yaml
  - error-pages.yaml
  - http-route.yaml
  - servicemonitor.yaml

configMapGenerator:
  - name: traefik-dashboard
    options:
      labels:
        grafana_dashboard: "1"
    files:
      - traefik.json=dashboards/traefik.json
generatorOptions:
  disableNameSuffixHash: true

images:
  - name: ghcr.io/tarampampam/error-pages
    newTag: 4.2.6@sha256:87434ca4b6461dbd956967922d5fe3eec2fba6ea46d7e8cdb0fac7e54bf78fc0
  - name: dhi.io/traefik
    newTag: 3.7.14@sha256:c4603d597dbee2de21132e784e49ea5ee8f8a6a87d7e8ddc6f41d70d435bffd5
