apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "1"

namespace: traefik
helmCharts:
  - name: traefik
    repo: https://traefik.github.io/charts
    version: 42.2.0
    releaseName: traefik
    namespace: traefik
    valuesFile: values/traefik-config.yaml
    includeCRDs: true

resources:
  - certificate.yaml
  - bouncer-secret.yaml
  - services.yaml
  - gateways.yaml
  - network-policy.yaml
  - error-pages.yaml
  - http-route.yaml
  - servicemonitor.yaml

configMapGenerator:
  - name: traefik-dashboard
    options:
      labels:
        grafana_dashboard: "1"
    files:
      - traefik.json=dashboards/traefik.json
generatorOptions:
  disableNameSuffixHash: true

images:
  - name: ghcr.io/tarampampam/error-pages
    newTag: 4.2.7@sha256:f59453fef7ca963c2239cbb021896c71e6f375d85e5ef3f9c6495c1367a7de4e
  - name: dhi.io/traefik
    newTag: 3.7.16@sha256:17b412cf3383e3d1d940e14d4fc8f0a5fc4690486f4728d9a9309c7996d52cab
