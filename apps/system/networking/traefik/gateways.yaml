# internal-gateway.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: internal-gateway
spec:
  gatewayClassName: traefik
  listeners:
    - name: websecure
      protocol: HTTPS
      port: 9443
      hostname: "*.kerrlab.app"
      tls:
        mode: Terminate
        certificateRefs:
          - name: kerrlab-app-tls
            kind: Secret
      allowedRoutes:
        namespaces:
          from: All # Or "Same" if all internal routes are in 'traefik' ns
    # The apex (the "*.kerrlab.app" listener never matches it): the launchpad in tools
    - name: websecure-apex
      protocol: HTTPS
      port: 9443
      hostname: "kerrlab.app"
      tls:
        mode: Terminate
        certificateRefs:
          - name: kerrlab-app-tls
            kind: Secret
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: tools
---
# external-gateway.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: external-gateway
spec:
  gatewayClassName: traefik
  listeners:
    - name: dmz
      protocol: HTTPS
      port: 8443
      hostname: "*.kerrlab.app" # Or your public domain
      tls:
        mode: Terminate
        certificateRefs:
          - name: kerrlab-app-tls
            kind: Secret
      allowedRoutes:
        namespaces:
          from: All # Allows any HTTPRoute from any namespace to attach
---
# plex-gateway.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: plex-gateway
spec:
  gatewayClassName: traefik
  listeners:
    - name: plex
      protocol: HTTPS
      port: 32443
      hostname: "plex.kerrlab.app"
      tls:
        mode: Terminate
        certificateRefs:
          - name: kerrlab-app-tls
            kind: Secret
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: media
