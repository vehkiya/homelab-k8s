image:
  registry: dhi.io
  repository: traefik
  tag: 3.7.13

providers:
  kubernetesCRD:
    enabled: true
    allowCrossNamespace: false
    safeNaming: true
  kubernetesGateway:
    enabled: true
    nativeLBByDefault: true
    # Gateway API v1.6 serves TCPRoute/UDPRoute only as v1; 3.7 still watches
    # v1alpha2 when this is on, which stalls the Gateway provider.
    experimentalChannel: false
  kubernetesIngress:
    enabled: false
# Allow the Gateway to expose HTTPRoute from all namespaces
deployment:
  kind: DaemonSet
  goMemLimitPercentage: 0.75
  additionalVolumes:
    - name: crowdsec-plugin-vol
      image:
        # renovate: datasource=github-releases depName=maxlerebourg/crowdsec-bouncer-traefik-plugin
        reference: ghcr.io/vehkiya/crowdsec-bouncer-traefik-plugin:v1.7.1
    - name: requestid-plugin-vol
      image:
        # renovate: datasource=github-releases depName=mdklapwijk/traefik-plugin-request-id
        reference: ghcr.io/vehkiya/traefik-plugin-request-id:v0.1.1
    - name: realip-plugin-vol
      image:
        # renovate: datasource=github-releases depName=hononeko/traefik-plugin-cloudflare-realip
        reference: ghcr.io/vehkiya/traefik-plugin-cloudflare-realip:v0.1.0
    - name: crowdsec-bouncer-key-vol
      secret:
        secretName: crowdsec-bouncer-key

additionalVolumeMounts:
  - name: crowdsec-bouncer-key-vol
    mountPath: /etc/crowdsec-bouncer
    readOnly: true

# Start the replacement pod before stopping the old one, so a node never lacks a local Traefik
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0 # @schema type:[integer, string, null]
    maxSurge: 1
ingressClass:
  enabled: false

ingressRoute:
  dashboard:
    enabled: false # Migrated to Gateway API HTTPRoute in http-route.yaml
  healthcheck:
    enabled: false
log:
  level: WARN
accessLog:
  enabled: true
  format: json
  fields:
    # Drop all request/response headers by default; apps send credentials in
    # headers (X-Plex-Token, X-Emby-Token, ...), so keep only an allowlist.
    headers:
      defaultMode: drop
      names:
        User-Agent: keep # Required by the CrowdSec Traefik log parser
        Referer: keep
        X-Forwarded-For: keep
        X-Request-Id: keep
        Cf-Connecting-Ip: keep

ports:
  traefik:
    http:
      aliasHeadersStrategy: delete
  metrics:
    http:
      aliasHeadersStrategy: delete
  web:
    port: 8000
    exposedPort: 80
    http:
      aliasHeadersStrategy: delete
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    port: 9443
    http:
      aliasHeadersStrategy: delete
      middlewares:
        - traefik_request-id@kubernetescrd
        - traefik_error-pages@kubernetescrd
      encodedCharacters:
        allowEncodedSlash: false
        allowEncodedBackSlash: false
        allowEncodedNullCharacter: false
        allowEncodedSemicolon: false
        allowEncodedPercent: false
        allowEncodedQuestionMark: false
        allowEncodedHash: false
      tls:
        enabled: true
    http3:
      enabled: true
      advertisedPort: 443
    forwardedHeaders:
      trustedIPs: [ ]
    proxyProtocol:
      trustedIPs: [ ]
    observability:
      metrics: true
  dmz:
    port: 8443
    expose:
      default: true
    http:
      aliasHeadersStrategy: delete
      middlewares:
        # First, so every later middleware and backend sees the real client IP
        - traefik_cloudflare-realip@kubernetescrd
        - traefik_crowdsec-bouncer@kubernetescrd
        - traefik_request-id@kubernetescrd
        - traefik_error-pages@kubernetescrd
      encodedCharacters:
        allowEncodedSlash: false
        allowEncodedBackSlash: false
        allowEncodedNullCharacter: false
        allowEncodedSemicolon: false
        allowEncodedPercent: false
        allowEncodedQuestionMark: false
        allowEncodedHash: false
      # We will terminate TLS here
      tls:
        enabled: true
    http3:
      enabled: true
      advertisedPort: 443
    forwardedHeaders:
      # Cloudflare proxy ranges. Anchored so the crowdsec and cloudflare-realip
      # middlewares below reuse the same list; update it here only.
      trustedIPs: &trustedProxyIPs
        - 173.245.48.0/20
        - 103.21.244.0/22
        - 103.22.200.0/22
        - 103.31.4.0/22
        - 141.101.64.0/18
        - 108.162.192.0/18
        - 190.93.240.0/20
        - 188.114.96.0/20
        - 197.234.240.0/22
        - 198.41.128.0/17
        - 162.158.0.0/15
        - 104.16.0.0/13
        - 104.24.0.0/14
        - 172.64.0.0/13
        - 131.0.72.0/22
        - 2400:cb00::/32
        - 2606:4700::/32
        - 2803:f800::/32
        - 2405:b500::/32
        - 2405:8100::/32
        - 2a06:98c0::/29
        - 2c0f:f248::/32
    proxyProtocol:
      trustedIPs: [ ]
    observability:
      metrics: true
  plex:
    port: 32443
    expose:
      default: false
    http:
      aliasHeadersStrategy: delete
      middlewares:
        - traefik_crowdsec-bouncer@kubernetescrd
        - traefik_request-id@kubernetescrd
      encodedCharacters:
        allowEncodedSlash: false
        allowEncodedBackSlash: false
        allowEncodedNullCharacter: false
        allowEncodedSemicolon: false
        allowEncodedPercent: false
        allowEncodedQuestionMark: false
        allowEncodedHash: false
      tls:
        enabled: true
    forwardedHeaders:
      trustedIPs: []
    proxyProtocol:
      trustedIPs: []
    observability:
      metrics: true
gateway:
  enabled: false # Created manually in gateways.yaml
tlsStore:
  default:
    defaultCertificate:
      secretName: kerrlab-app-tls
service:
  enabled: false # Created manually in services.yaml
extraObjects:
  - apiVersion: traefik.io/v1alpha1
    kind: Middleware
    metadata:
      name: cloudflare-realip
      namespace: traefik
    spec:
      plugin:
        cloudflarerealip:
          trustedCIDRs: *trustedProxyIPs
  - apiVersion: traefik.io/v1alpha1
    kind: Middleware
    metadata:
      name: authelia-forward-auth
      namespace: traefik
    spec:
      forwardAuth:
        address: "http://authelia.security.svc.cluster.local:9091/api/authz/forward-auth"
        trustForwardHeader: true
        maxResponseBodySize: 2097152
        authResponseHeaders:
          - "Remote-User"
          - "Remote-Groups"
          - "Remote-Email"
          - "Remote-Name"
  - apiVersion: traefik.io/v1alpha1
    kind: Middleware
    metadata:
      name: crowdsec-bouncer
      namespace: traefik
    spec:
      plugin:
        crowdsec:
          enabled: true
          crowdsecLapiScheme: http
          crowdsecLapiHost: crowdsec-service.security.svc.cluster.local:8080
          crowdsecLapiKeyFile: "/etc/crowdsec-bouncer/bouncer-key"
          updateIntervalSeconds: 60
          # Stream mode caches decisions in memory. Setting -1 disables fail-closed behavior on LAPI
          # poll failures so transient LAPI downtime or rollouts never block DMZ traffic (cached bans remain).
          # Note: Existing cached bans expire over time based on their original TTL. If LAPI stays down
          # prolonged periods (or Traefik restarts while LAPI is down, starting with an empty cache),
          # protection degrades silently. This state is monitored by the CrowdSecTraefikBouncerNotPulling alert.
          updateMaxFailure: -1
          crowdsecMode: stream
          crowdsecAppsecEnabled: true
          crowdsecAppsecHost: crowdsec-appsec-service.security.svc.cluster.local:7422
          # Fail-open if AppSec is unreachable so WAF restarts do not drop legitimate DMZ traffic (LAPI bans still protect).
          crowdsecAppsecUnreachableBlock: false
          # Fail-closed only if AppSec is active but returns an internal 500 error on a specific inspected request.
          crowdsecAppsecFailureBlock: true
          forwardedHeadersTrustedIPs: *trustedProxyIPs
          clientTrustedIPs:
            - 127.0.0.1/32
            - 10.0.0.0/8
            - 100.64.0.0/10
            - 192.168.1.0/24
            - 192.168.11.0/24
            - 192.168.29.0/24
  - apiVersion: traefik.io/v1alpha1
    kind: TLSOption
    metadata:
      name: default
      namespace: traefik
    spec:
      minVersion: VersionTLS13
      sniStrict: false
      alpnProtocols:
        - h2
        - http/1.1

  - apiVersion: traefik.io/v1alpha1
    kind: Middleware
    metadata:
      name: error-pages
      namespace: traefik
    spec:
      errors:
        status:
          - "502-504"
        service:
          name: error-pages-svc
          port: 8080
        query: "/{status}.html"
  - apiVersion: traefik.io/v1alpha1
    kind: Middleware
    metadata:
      name: request-id
      namespace: traefik
    spec:
      plugin:
        requestid:
          headerName: "X-Request-Id"
experimental:
  fastProxy:
    enabled: true
  localPlugins:
    crowdsec:
      moduleName: "github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin"
      mountPath: "/plugins-local/src/github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin"
      type: localPath
      volumeName: crowdsec-plugin-vol
    requestid:
      moduleName: "github.com/mdklapwijk/traefik-plugin-request-id"
      mountPath: "/plugins-local/src/github.com/mdklapwijk/traefik-plugin-request-id"
      type: localPath
      volumeName: requestid-plugin-vol
    cloudflarerealip:
      moduleName: "github.com/hononeko/traefik-plugin-cloudflare-realip"
      mountPath: "/plugins-local/src/github.com/hononeko/traefik-plugin-cloudflare-realip"
      type: localPath
      volumeName: realip-plugin-vol

additionalArguments:
  - "--serversTransport.maxIdleConnsPerHost=50"
  - "--serversTransport.forwardingTimeouts.dialTimeout=10s"
  - "--serversTransport.forwardingTimeouts.idleConnTimeout=90s"

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1024Mi
