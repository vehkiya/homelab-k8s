apiVersion: batch/v1
kind: CronJob
metadata:
  name: talos-backup
  namespace: talos-backup
  labels:
    app.kubernetes.io/name: talos-backup
spec:
  schedule: "30 2 * * *" # Daily at 02:30 AM
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: talos-backup
        spec:
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 65534
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: snapshotter
              image: alpine:3.21.3@sha256:a8560b36e8b8210634f77d9f7f9efd7ffa463e380b75e2e74aff4511df3ef88c
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -c
                - |
                  set -euo pipefail

                  BACKUP_DIR="/backups"
                  TIMESTAMP="$(date +"%Y%m%d_%H%M%S")"
                  SNAPSHOT_FILE="etcd-${TIMESTAMP}.snap"
                  SNAPSHOT_PATH="${BACKUP_DIR}/${SNAPSHOT_FILE}"

                  echo ">>> Starting Talos etcd snapshot..."
                  /talosctl-bin/talosctl -e 10.10.1.250 -n 10.10.1.250 etcd snapshot "${SNAPSHOT_PATH}"

                  echo ">>> Compressing snapshot with gzip..."
                  gzip -9 "${SNAPSHOT_PATH}"

                  COMPRESSED_PATH="${SNAPSHOT_PATH}.gz"
                  FILE_SIZE="$(du -h "${COMPRESSED_PATH}" | cut -f1)"
                  echo ">>> Snapshot completed: ${COMPRESSED_PATH} (${FILE_SIZE})"

                  RETENTION_DAYS="${RETENTION_DAYS:-14}"
                  echo ">>> Pruning etcd snapshots older than ${RETENTION_DAYS} days..."
                  find "${BACKUP_DIR}" -name "etcd-*.snap.gz" -type f -mtime +"${RETENTION_DAYS}" -print -delete

                  echo ">>> Backup run finished successfully."
              env:
                - name: RETENTION_DAYS
                  value: "14"
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: backup-storage
                  mountPath: /backups
                  subPath: system/talos-backup
                - name: talosctl-bin
                  mountPath: /talosctl-bin
                  readOnly: true
                - name: talos-secrets
                  mountPath: /var/run/secrets/talos.dev
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: backup-storage
              persistentVolumeClaim:
                claimName: talos-backup-nfs-pvc
            - name: talosctl-bin
              image:
                reference: ghcr.io/siderolabs/talosctl:v1.14.0@sha256:ff9b1177abf0874e963261c4937ce5f5e8080adde6ae49b4e13195f37bee1a67
                pullPolicy: IfNotPresent
            - name: talos-secrets
              secret:
                secretName: talos-backup-secrets
            - name: tmp
              emptyDir: {}
