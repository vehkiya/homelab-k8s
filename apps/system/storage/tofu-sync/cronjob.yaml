apiVersion: batch/v1
kind: CronJob
metadata:
  name: tofu-sync
  namespace: tofu-sync
  labels:
    app.kubernetes.io/name: tofu-sync
spec:
  schedule: "0 3 * * *" # Daily at 03:00 AM
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: tofu-sync
        spec:
          serviceAccountName: tofu-sync
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: rclone
              image: rclone/rclone:1.75.1@sha256:45401ad7410db1d67ffdb58e19059ad20b0d8e0285a60e38bbec55cc1019c7a5
              imagePullPolicy: IfNotPresent
              command:
                - /usr/local/bin/rclone
              args:
                - sync
                - r2:tofu
                - seaweedfs:homelab-k8s-terraform
                - --verbose
                - --fast-list
                - --bind
                - 0.0.0.0
              envFrom:
                - secretRef:
                    name: tofu-sync-secrets
              env:
                - name: RCLONE_CACHE_DIR
                  value: /tmp/rclone
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
                - name: config
                  mountPath: /config/rclone
          volumes:
            - name: tmp
              emptyDir: {}
            - name: config
              emptyDir: {}
