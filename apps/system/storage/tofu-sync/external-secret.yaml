apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tofu-sync-secrets
  namespace: tofu-sync
  labels:
    app.kubernetes.io/name: tofu-sync
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-store
  target:
    name: tofu-sync-secrets
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        RCLONE_CONFIG_R2_TYPE: "s3"
        RCLONE_CONFIG_R2_PROVIDER: "Cloudflare"
        RCLONE_CONFIG_R2_ENDPOINT: "{{ .R2_ENDPOINT }}"
        RCLONE_CONFIG_R2_ACCESS_KEY_ID: "{{ .R2_ACCESS_KEY_ID }}"
        RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: "{{ .R2_SECRET_ACCESS_KEY }}"
        RCLONE_CONFIG_R2_REGION: "auto"

        RCLONE_CONFIG_SEAWEEDFS_TYPE: "s3"
        RCLONE_CONFIG_SEAWEEDFS_PROVIDER: "Other"
        RCLONE_CONFIG_SEAWEEDFS_ENDPOINT: "https://s3.kerrlab.app"
        RCLONE_CONFIG_SEAWEEDFS_ACCESS_KEY_ID: "{{ .SW_ACCESS_KEY_ID }}"
        RCLONE_CONFIG_SEAWEEDFS_SECRET_ACCESS_KEY: "{{ .SW_SECRET_ACCESS_KEY }}"
        RCLONE_CONFIG_SEAWEEDFS_REGION: "us-east-1"
  data:
    - secretKey: R2_ENDPOINT
      remoteRef:
        key: tofu-sync/tofu-sync
        property: R2_ENDPOINT
    - secretKey: R2_ACCESS_KEY_ID
      remoteRef:
        key: tofu-sync/tofu-sync
        property: R2_ACCESS_KEY_ID
    - secretKey: R2_SECRET_ACCESS_KEY
      remoteRef:
        key: tofu-sync/tofu-sync
        property: R2_SECRET_ACCESS_KEY
    - secretKey: SW_ACCESS_KEY_ID
      remoteRef:
        key: platform/s3/backup-filers
        property: AWS_ACCESS_KEY_ID
    - secretKey: SW_SECRET_ACCESS_KEY
      remoteRef:
        key: platform/s3/backup-filers
        property: AWS_SECRET_ACCESS_KEY
