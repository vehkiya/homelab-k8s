apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: longhorn-system
helmCharts:
  - name: longhorn
    namespace: longhorn-system
    repo: https://charts.longhorn.io
    version: 1.13.0
    releaseName: longhorn
    valuesFile: values/values.yaml
    includeCRDs: true
resources:
  - longhorn-http-route.yaml
  - longhorn-http-route-eg.yaml
  - network-policy.yaml
  - storageclass-retain.yaml
  - storageclass-single-replica.yaml
  - s3-backup-secret.yaml
  - backup-job.yaml
  - volume-trimmer.yaml
components:
  - ../../../common/forward-auth

images:
  - name: ghcr.io/hononeko/k8s-config-tools
    newTag: 0.1.2@sha256:659cbeceefffbfd34b98957d3c6d5e3f0ac6a5fb3887efe4c4bbbe45787cc75f

patches:
  - path: patch-longhorn-ui-deployment.yaml
  - path: patch-longhorn-frontend-service.yaml