apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: longhorn-system
helmCharts:
  - name: longhorn
    namespace: longhorn-system
    repo: https://charts.longhorn.io
    version: 1.12.1
    releaseName: longhorn
    valuesFile: values/values.yaml
    includeCRDs: true
resources:
  - longhorn-namespace.yaml
  - longhorn-http-route.yaml
  - network-policy.yaml
  - storageclass-retain.yaml
  - s3-backup-secret.yaml
  - backup-job.yaml
  - volume-trimmer.yaml

images:
  - name: ghcr.io/hononeko/k8s-config-tools
    newTag: 0.1.1@sha256:fb03e8e7910a51472309b361675f38da44ee398ab6ec64b020b660d4d0d4e400

patches:
  - path: patch-longhorn-ui-deployment.yaml
  - path: patch-longhorn-frontend-service.yaml