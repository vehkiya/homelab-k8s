# Authelia Configuration
log:
  level: "info"
  format: "json"

server:
  address: "tcp://0.0.0.0:9091"
  buffers:
    read: 32768
    write: 32768

session:
  name: authelia_session
  # This should match the root domain you are protecting
  # Secrets are read from mounted Secret files by Authelia's template filter (X_AUTHELIA_CONFIG_FILTERS=template)
  secret: {{ secret "/secrets/authelia/SESSION_SECRET" | quote }}
  same_site: "lax"
  inactivity: "1h"
  expiration: "8h"
  remember_me: "1M"
  cookies:
    - domain: "kerrlab.app"
      authelia_url: "https://auth.kerrlab.app"
      same_site: "lax"

  redis:
    host: "authelia-dragonfly.security.svc.cluster.local"
    port: 6379
    password: {{ secret "/secrets/authelia/REDIS_PASSWORD" | quote }}
    timeout: "5s"
    max_retries: 0
    maximum_active_connections: 32
    minimum_idle_connections: 4

# Identity Validation
identity_validation:
  elevated_session:
    require_second_factor: true
    skip_second_factor: false
  ## Reset Password flow. Adjusts how the reset password flow operates.
  reset_password:
    ## Maximum allowed time before the JWT is generated and when the user uses it in the duration common syntax.
    # jwt_lifespan: '5 minutes'

    ## The algorithm used for the Reset Password JWT.
    # jwt_algorithm: 'HS256'

    ## The secret key used to sign and verify the JWT.
    jwt_secret: {{ secret "/secrets/authelia/JWT_SECRET" | quote }}

# Regulation settings
regulation:
  max_retries: 3
  find_time: "2m"
  ban_time: "15m"

# Storage configuration using PostgreSQL
storage:
  encryption_key: {{ secret "/secrets/authelia/STORAGE_ENCRYPTION_KEY" | quote }}
  postgres:
    timeout: "10s"
    address: "tcp://fortress.kerrlab.app:15432"
    database: authelia-db
    username: authelia_user
    # Read from the mounted authelia-secrets Secret
    password: {{ secret "/secrets/authelia/STORAGE_PASSWORD" | quote }}

# Notifier configuration (SMTP example)
notifier:
  smtp:
    address: "smtp://smtp.protonmail.ch:587"
    sender: "Authelia <accounts@kerrlab.app>"
    username: {{ secret "/secrets/authelia/SMTP_USERNAME" | quote }}
    password: {{ secret "/secrets/authelia/SMTP_PASSWORD" | quote }}
    subject: "[Authelia] {title}"
    tls:
      server_name: "smtp.protonmail.ch"
      skip_verify: false

# Authentication backend using LDAP
authentication_backend:
  ldap:
    implementation: "lldap"
    address: "ldaps://lldap.security.svc.cluster.local:636"
    start_tls: false
    tls:
      server_name: "lldap.kerrlab.app"
      skip_verify: false
    base_dn: "dc=ldap,dc=kerrlab,dc=app"
    additional_users_dn: "ou=people"
    additional_groups_dn: "ou=groups"
    user: "uid=authelia,ou=people,dc=ldap,dc=kerrlab,dc=app"
    password: {{ secret "/secrets/authelia/LDAP_PASSWORD" | quote }}
    timeout: "10s"

# Access control rules
access_control:
  default_policy: deny
  rules:
    # 1. Admin Only (Infrastructure dashboards via Forward Auth)
    - domain: "proxy.kerrlab.app"
      policy: two_factor
      subject:
        - ["group:administrators"]
    # Deny everyone else; without this, non-admins fall through to the *.kerrlab.app catch-all
    - domain: "proxy.kerrlab.app"
      policy: deny

    # 2. Privileged & Admin Only (Indexers, Downloaders via Forward Auth)
    - domain: &privileged_domains
        - "prowlarr.kerrlab.app"
        - "qbittorrent.kerrlab.app"
        - "sonarr.kerrlab.app"
        - "sonarr-tv.kerrlab.app"
        - "sonarr-anime.kerrlab.app"
        - "radarr.kerrlab.app"
        - "bazarr.kerrlab.app"
        - "posterizarr.kerrlab.app"
        - "download.kerrlab.app" # qBittorrent web UI
      policy: two_factor
      subject:
        - ["group:administrators"]
        - ["group:privileged-users"]
    # Deny everyone else on the same domains (shared via the anchor above); without this,
    # other users fall through to the *.kerrlab.app catch-all
    - domain: *privileged_domains
      policy: deny

    # 3. Selective Per-App Entitlements (Allowing global users + specific guest grants)
    - domain: "recipes.kerrlab.app"
      policy: two_factor
      subject:
        - ["group:administrators"]
        - ["group:privileged-users"]
        - ["group:users"]
        - ["group:app-mealie-users"]

    - domain: "romm.kerrlab.app"
      policy: two_factor
      subject:
        - ["group:administrators"]
        - ["group:privileged-users"]
        - ["group:users"]
        - ["group:app-romm-users"]

    - domain: "bar.kerrlab.app"
      policy: two_factor
      subject:
        - ["group:administrators"]
        - ["group:privileged-users"]
        - ["group:users"]
        - ["group:app-bar-assistant-users"]
        - ["group:guests"]

    - domain: "kaneo.kerrlab.app"
      policy: two_factor
      subject:
        - ["group:administrators"]
        - ["group:privileged-users"]
        - ["group:users"]
        - ["group:app-kaneo-users"]

    # 4. Catch-all for standard services (*.kerrlab.app)
    - domain: "*.kerrlab.app"
      policy: two_factor
      subject:
        - ["group:administrators"]
        - ["group:privileged-users"]
        - ["group:users"]

totp:
  disable: false
  issuer: "kerrlab.app"
  algorithm: "sha1"
  digits: 6
  period: 30
  skew: 1
  secret_size: 32
  allowed_algorithms:
    - "SHA1"
    - "SHA256"
  allowed_digits:
    - 6
  allowed_periods:
    - 30
  disable_reuse_security_policy: false

webauthn:
  disable: false
  enable_passkey_login: true
  experimental_enable_passkey_uv_two_factors: true
  display_name: "Kerrlab SSO"
  attestation_conveyance_preference: "none"
  timeout: "60 seconds"
  filtering:
    permitted_aaguids: []
    prohibited_aaguids: []
    prohibit_backup_eligibility: false
  selection_criteria:
    attachment: ""
    discoverability: "preferred"
    user_verification: "preferred"
  metadata:
    enabled: false
    validate_trust_anchor: true
    validate_entry: true
    validate_entry_permit_zero_aaguid: false
    validate_status: true
    validate_status_permitted: []
    validate_status_prohibited:
      - "REVOKED"
      - "USER_KEY_PHYSICAL_COMPROMISE"
      - "USER_KEY_REMOTE_COMPROMISE"
      - "USER_VERIFICATION_BYPASS"
      - "ATTESTATION_KEY_COMPROMISE"

identity_providers:
  oidc:
    hmac_secret: {{ secret "/secrets/authelia/OIDC_HMAC_SECRET" | quote }}
    jwks:
      - key_id: 'oidc_pk'
        key: {{ secret "/secrets/jwks/oidc_private.pem" | mindent 10 "|" | msquote }}
    claims_policies:
      with_email:
        id_token:
          [
            "email",
            "email_verified",
            "alt_emails",
            "preferred_username",
            "name",
          ]
      with_groups:
        id_token:
          - "email"
          - "email_verified"
          - "preferred_username"
          - "name"
          - "groups"
    authorization_policies:
      admin_only_policy:
        default_policy: 'deny'
        rules:
          - policy: 'two_factor'
            subject:
              - ["group:administrators"]
      privileged_users_policy:
        default_policy: 'deny'
        rules:
          - policy: 'two_factor'
            subject:
              - ["group:administrators"]
              - ["group:privileged-users"]
      autobrr_policy:
        default_policy: 'deny'
        rules:
          - policy: 'two_factor'
            subject:
              - ["group:administrators"]
              - ["group:privileged-users"]
              - ["group:app-autobrr-users"]
      general_policy:
        default_policy: 'deny'
        rules:
          - policy: 'two_factor'
            subject:
              - ["group:administrators"]
              - ["group:privileged-users"]
              - ["group:users"]
      one_factor_general_policy:
        default_policy: 'deny'
        rules:
          - policy: 'one_factor'
            subject:
              - ["group:administrators"]
              - ["group:privileged-users"]
              - ["group:users"]
      mealie_policy:
        default_policy: 'deny'
        rules:
          - policy: 'two_factor'
            subject:
              - ["group:administrators"]
              - ["group:privileged-users"]
              - ["group:users"]
              - ["group:app-mealie-users"]
      romm_policy:
        default_policy: 'deny'
        rules:
          - policy: 'two_factor'
            subject:
              - ["group:administrators"]
              - ["group:privileged-users"]
              - ["group:users"]
              - ["group:app-romm-users"]
      kaneo_policy:
        default_policy: 'deny'
        rules:
          - policy: 'two_factor'
            subject:
              - ["group:administrators"]
              - ["group:privileged-users"]
              - ["group:users"]
              - ["group:app-kaneo-users"]
      nodecast_policy:
        default_policy: 'deny'
        rules:
          - policy: 'two_factor'
            subject:
              - ["group:administrators"]
              - ["group:privileged-users"]
              - ["group:users"]
              - ["group:app-nodecast-users"]
      fluxer_policy:
        default_policy: 'deny'
        rules:
          - policy: 'two_factor'
            subject:
              - ["group:administrators"]
              - ["group:privileged-users"]
              - ["group:users"]
              - ["group:app-fluxer-users"]
      bar_assistant_policy:
        default_policy: 'deny'
        rules:
          - policy: 'two_factor'
            subject:
              - ["group:administrators"]
              - ["group:privileged-users"]
              - ["group:users"]
              - ["group:app-bar-assistant-users"]
              - ["group:guests"]
      guest_allowed_policy:
        default_policy: 'deny'
        rules:
          - policy: 'two_factor'
            subject:
              - ["group:administrators"]
              - ["group:privileged-users"]
              - ["group:users"]
              - ["group:guests"]
      penpot_policy:
        default_policy: 'deny'
        rules:
          - policy: 'two_factor'
            subject:
              - ["group:administrators"]
              - ["group:privileged-users"]
              - ["group:users"]
              - ["group:app-penpot-users"]
    clients:
      # ---- === Bar Assistant === ----
      - client_id: "bar-assistant"
        client_name: "Bar Assistant"
        client_secret: {{ secret "/secrets/oidc-clients/BAR_ASSISTANT_SECRET" | quote }}
        public: false
        authorization_policy: "bar_assistant_policy"
        consent_mode: "pre-configured"
        pre_configured_consent_duration: "30 days"
        redirect_uris:
          - "https://bar.kerrlab.app/oauth/callback"
        claims_policy: "with_email"
        scopes:
          - "openid"
          - "email"
          - "profile"
          - "groups"
          - "offline_access"
        response_types:
          - "code"
        grant_types:
          - "authorization_code"
        userinfo_signed_response_alg: "none"
        token_endpoint_auth_method: "client_secret_post"
      # ---- === Mealie === ----
      - client_id: "mealie"
        client_name: "Mealie"
        client_secret: {{ secret "/secrets/oidc-clients/MEALIE_SECRET" | quote }}
        public: false
        authorization_policy: "mealie_policy"
        require_pkce: true
        pkce_challenge_method: "S256"
        consent_mode: "pre-configured"
        pre_configured_consent_duration: "30 days"
        redirect_uris:
          - "https://recipes.kerrlab.app/login"
          - "https://recipes.kerrlab.app/login?direct=1"
        claims_policy: "with_groups"
        scopes:
          - "openid"
          - "email"
          - "profile"
          - "groups"
          - "offline_access"
        response_types:
          - "code"
        grant_types:
          - "authorization_code"
        access_token_signed_response_alg: "none"
        userinfo_signed_response_alg: "none"
        token_endpoint_auth_method: "client_secret_basic"
      # ---- === Autobrr === ----
      - client_id: "autobrr"
        client_name: "Autobrr"
        client_secret: {{ secret "/secrets/oidc-clients/AUTOBRR_SECRET" | quote }}
        public: false
        authorization_policy: "autobrr_policy"
        require_pkce: false
        pkce_challenge_method: ""
        consent_mode: "pre-configured"
        pre_configured_consent_duration: "30 days"
        redirect_uris:
          - "https://autobrr.kerrlab.app/api/auth/oidc/callback"
        scopes:
          - "openid"
          - "email"
          - "profile"
          - "groups"
          - "offline_access"
        response_types:
          - "code"
        grant_types:
          - "authorization_code"
        access_token_signed_response_alg: "none"
        userinfo_signed_response_alg: "RS256"
        token_endpoint_auth_method: "client_secret_post"
      # ---- === Headlamp === ----
      - client_id: "headlamp"
        client_name: "Headlamp"
        client_secret: {{ secret "/secrets/oidc-clients/HEADLAMP_SECRET" | quote }}
        public: false
        require_pkce: true
        pkce_challenge_method: "S256"
        authorization_policy: "admin_only_policy"
        grant_types:
          - "authorization_code"
        response_types:
          - "code"
        consent_mode: "pre-configured"
        pre_configured_consent_duration: "30 days"
        redirect_uris:
          - "https://cluster.kerrlab.app/oidc-callback"
        claims_policy: "with_groups"
        scopes:
          - "openid"
          - "profile"
          - "email"
          - "groups"
          - "offline_access"
        userinfo_signed_response_alg: "RS256"
        token_endpoint_auth_method: "client_secret_post"
      # ---- === RomM === ----
      - client_id: "romm"
        client_name: "RomM"
        client_secret: {{ secret "/secrets/oidc-clients/ROMM_SECRET" | quote }}
        public: false
        authorization_policy: "romm_policy"
        grant_types:
          - "authorization_code"
        response_types:
          - "code"
        consent_mode: "pre-configured"
        pre_configured_consent_duration: "30 days"
        redirect_uris:
          - "https://romm.kerrlab.app/api/oauth/openid"
        claims_policy: "with_groups"
        scopes:
          - "openid"
          - "email"
          - "profile"
          - "groups"
          - "offline_access"
        userinfo_signed_response_alg: "RS256"
        token_endpoint_auth_method: "client_secret_basic"
      # ---- === NodeCast === ----
      - client_id: "nodecast"
        client_name: "NodeCast"
        client_secret: {{ secret "/secrets/oidc-clients/NODECAST_SECRET" | quote }}
        public: false
        authorization_policy: "nodecast_policy"
        grant_types:
          - "authorization_code"
        response_types:
          - "code"
        consent_mode: "pre-configured"
        pre_configured_consent_duration: "30 days"
        redirect_uris:
          - "https://nodecast.kerrlab.app/api/auth/oidc/callback"
        claims_policy: "with_groups"
        scopes:
          - "openid"
