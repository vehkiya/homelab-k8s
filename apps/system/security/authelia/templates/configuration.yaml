      # ---- === OpenBao === ----
      - client_id: "openbao"
        client_name: "OpenBao"
        client_secret: {{ secret "/secrets/oidc-clients/OPENBAO_SECRET" | quote }}
        public: false
        authorization_policy: "admin_only_policy"
        require_pkce: true
