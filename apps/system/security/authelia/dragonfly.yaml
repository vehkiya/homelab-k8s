apiVersion: v1
kind: Service
metadata:
  name: authelia-dragonfly
  labels:
    app: authelia-dragonfly
spec:
  ports:
    - name: redis
      port: 6379
      targetPort: redis
  selector:
    app: authelia-dragonfly
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authelia-dragonfly
  labels:
    app: authelia-dragonfly
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: authelia-dragonfly
  template:
    metadata:
      labels:
        app: authelia-dragonfly
    spec:
      containers:
        - name: dragonfly
          image: ghcr.io/dragonflydb/dragonfly
          args:
            - "--dbfilename=dump"
            - "--dir=/data"
            - "--proactor_threads=1"
            - "--snapshot_cron=*/15 * * * *"
            - "--force_epoll"
            - "--version_check=false"
          env:
            - name: DFLY_requirepass
              valueFrom:
                secretKeyRef:
                  name: authelia-secrets
                  key: REDIS_PASSWORD
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "20m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: data
              mountPath: /data
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      volumes:
        - name: data
          emptyDir: {}
