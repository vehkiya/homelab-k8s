apiVersion: v1
kind: Service
metadata:
  name: authelia-dragonfly
  labels:
    app: authelia-dragonfly
spec:
  ports:
    - name: redis
      port: 6379
      targetPort: redis
  selector:
    app: authelia-dragonfly
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authelia-dragonfly
  labels:
    app: authelia-dragonfly
spec:
  replicas: 1
  # In-memory only (no volume): surge a new pod and retire the old one only once
  # the new one passes readiness, so Authelia always has a reachable session
  # store. Sessions held by the old pod are still dropped on rollout.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: authelia-dragonfly
  template:
    metadata:
      labels:
        app: authelia-dragonfly
    spec:
      containers:
        - name: dragonfly
          image: ghcr.io/dragonflydb/dragonfly
          args:
            # Empty dbfilename disables snapshot load on start and save on shutdown;
            # there is no persistent volume, so snapshots would be discarded anyway.
            - "--dbfilename="
            - "--proactor_threads=1"
            # Stay below the 512Mi container limit to leave headroom for overhead.
            - "--maxmemory=384mb"
            - "--force_epoll"
            - "--version_check=false"
          env:
            - name: DFLY_requirepass
              valueFrom:
                secretKeyRef:
                  name: authelia-secrets
                  key: REDIS_PASSWORD
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "20m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
