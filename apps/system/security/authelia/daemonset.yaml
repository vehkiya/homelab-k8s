# authelia/daemonset.yaml
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: authelia
  labels:
    app: authelia
spec:
  selector:
    matchLabels:
      app: authelia
  # Start the replacement pod before stopping the old one, so a node never lacks a local Authelia
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: authelia
        networking/expose-web-ui: "true"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        runAsGroup: 10000
        fsGroup: 10000
      enableServiceLinks: false
      containers:
        - name: authelia
          image: ghcr.io/authelia/authelia
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: web-ui
              containerPort: 9091
              protocol: TCP
          env:
            # Authelia renders /config/configuration.yml itself and reads secrets from the
            # mounted files via {{ secret "..." }}; nothing is written to disk.
            - name: X_AUTHELIA_CONFIG_FILTERS
              value: "template"
          startupProbe:
            httpGet:
              path: /api/health
              port: web-ui
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: web-ui
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /api/health
              port: web-ui
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: secrets
              mountPath: /secrets/authelia
              readOnly: true
            - name: oidc-client-secrets
              mountPath: /secrets/oidc-clients
              readOnly: true
            - name: jwks
              mountPath: /secrets/jwks
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: authelia-config
        - name: secrets
          secret:
            secretName: authelia-secrets
        - name: oidc-client-secrets
          secret:
            secretName: authelia-oidc-secrets
        - name: jwks
          secret:
            secretName: authelia-secrets-files
            items:
              - key: oidc_private.pem
                path: oidc_private.pem
