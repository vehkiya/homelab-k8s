apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: authelia-policy
spec:
  endpointSelector:
    matchLabels:
      app: authelia

  # Ingress to 9091 (web-ui) and from the host is allowed by the global
  # ccnp-allow-ingress-authelia policy (apps/bootstrap/cilium/global-network-policies.yaml)
  ingress:
    # Prometheus metrics scrape
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "9959"
              protocol: TCP

  # This defines the allowed outbound (egress) traffic
  egress:
    - toEndpoints:
        - matchLabels:
            app: authelia-dragonfly
      toPorts:
        - ports:
            - port: "6379"
              protocol: "TCP"
    - toEndpoints:
        - matchLabels:
            app: lldap
      toPorts:
        - ports:
            - port: "6360"
              protocol: TCP
    # Connection to external PostgreSQL DB on Synology
    - toCIDR:
        - 10.10.1.218/32
      toPorts:
        - ports:
            - port: "15432"
              protocol: TCP
    # No NTP egress: the startup NTP check is disabled (ntp.disable_startup_check)
    - toEntities:
        - "world"
      toPorts:
        - ports:
            # HTTPS (only used by WebAuthn MDS, which is currently disabled)
            - port: "443"
              protocol: TCP
            # SMTP submission with STARTTLS (notifier: smtp.protonmail.ch:587)
            - port: "587"
              protocol: TCP
