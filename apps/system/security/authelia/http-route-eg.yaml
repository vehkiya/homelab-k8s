# Envoy Gateway copy of authelia (migration); the Traefik route stays until cutover
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: authelia-eg
spec:
  parentRefs:
    - name: internal-gateway
      namespace: edge
      sectionName: websecure
  hostnames:
    - "auth.kerrlab.app"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: authelia
          port: 9091
