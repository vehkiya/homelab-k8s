# authelia/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: authelia
  labels:
    app: authelia
spec:
  # In-cluster only (Traefik forward-auth and the auth.kerrlab.app route); nothing outside the
  # cluster used the former LoadBalancer IP, and Cilium policy blocked it anyway.
  type: ClusterIP
  ports:
    - port: 9091
      targetPort: web-ui
      protocol: TCP
      name: web-ui
  # Only honored once Cilium service topology is enabled (loadBalancer.serviceTopology);
  # today Cilium ignores the EndpointSlice node hints and spreads traffic across all nodes.
  trafficDistribution: PreferSameNode
  selector:
    app: authelia
