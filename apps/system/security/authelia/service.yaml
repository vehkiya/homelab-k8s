# authelia/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: authelia
  labels:
    app: authelia
spec:
  # In-cluster only (Traefik forward-auth and the auth.kerrlab.app route); nothing outside the
  # cluster used the former LoadBalancer IP, and Cilium policy blocked it anyway.
  type: ClusterIP
  ports:
    - port: 9091
      targetPort: web-ui
      protocol: TCP
      name: web-ui
    # Scraped per pod by the authelia ServiceMonitor; Cilium policy only admits Prometheus
    - port: 9959
      targetPort: metrics
      protocol: TCP
      name: metrics
  # Keeps forward-auth calls on the node-local Authelia pod. Cilium honors the EndpointSlice
  # node hints since service topology (loadBalancer.serviceTopology) was enabled on 2026-10-04.
  trafficDistribution: PreferSameNode
  selector:
    app: authelia
