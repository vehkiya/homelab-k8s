# Envoy Gateway copy of lldap-route (migration); the Traefik route stays until cutover
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: lldap-route-eg
  namespace: security
spec:
  hostnames:
    - lldap.kerrlab.app
  parentRefs:
    - name: internal-gateway
      namespace: edge
      sectionName: websecure
  rules:
    - backendRefs:
        - name: lldap
          port: 17170
      matches:
        - path:
            type: PathPrefix
            value: /
