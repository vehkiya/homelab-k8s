apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: lldap-policy
  namespace: security
spec:
  endpointSelector:
    matchLabels:
      app: lldap
  ingress:
    # Allow LDAPS query access from Authelia and Jellyfin
    - fromEndpoints:
        - matchLabels:
            app: authelia
            k8s:io.kubernetes.pod.namespace: security
        - matchLabels:
            app: jellyfin
            k8s:io.kubernetes.pod.namespace: media
      toPorts:
        - ports:
            - port: "636"
              protocol: TCP
            - port: "6360"
              protocol: TCP
  egress:
    # 1. Connection to external PostgreSQL DB on Synology
    - toCIDR:
        - 10.10.1.218/32
      toPorts:
        - ports:
            - port: "15432"
              protocol: TCP
