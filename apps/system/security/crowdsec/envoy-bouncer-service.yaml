apiVersion: v1
kind: Service
metadata:
  name: crowdsec-envoy-bouncer
  labels:
    app.kubernetes.io/name: crowdsec-envoy-bouncer
spec:
  selector:
    app.kubernetes.io/name: crowdsec-envoy-bouncer
  ports:
    - name: grpc
      port: 8080
      targetPort: grpc
      protocol: TCP
      appProtocol: kubernetes.io/h2c
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
