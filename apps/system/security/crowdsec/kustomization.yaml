apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: security

resources:
  - secrets.yaml
  - network-policy.yaml
  - bouncer-unifi.yaml
  - cronjob-prune.yaml
  - pdb.yaml
  - blocklist-mirror.yaml

helmCharts:
  - name: crowdsec
    repo: https://crowdsecurity.github.io/helm-charts
    version: 0.24.2
    releaseName: crowdsec
    namespace: security
    valuesFile: values.yaml

configMapGenerator:
  - name: crowdsec-config-template
    files:
      - config.yaml=templates/config.yaml
  - name: crowdsec-agent-config
    files:
      - config.yaml.local=templates/agent-config.yaml
  - name: crowdsec-dashboards
    options:
      labels:
        grafana_dashboard: "1"
    files:
      - crowdsec-overview.json=dashboards/crowdsec-overview.json
      - crowdsec-metrics.json=dashboards/crowdsec-metrics.json
generatorOptions:
  disableNameSuffixHash: true

images:
  - name: ghcr.io/hononeko/k8s-config-tools
    newTag: 0.1.1@sha256:fb03e8e7910a51472309b361675f38da44ee398ab6ec64b020b660d4d0d4e400
  - name: ghcr.io/teifun2/cs-unifi-bouncer
    newTag: v1.4.0@sha256:6d68590366ed57b38bc4c30b99849299b686023174e58847ccc94059ab9d5f2b
  - name: alpine/k8s
    newTag: 1.37.1@sha256:712dc5385d1c1a3f83b747fa9e40f64d433a97f72ff42f9755ff7dd1f62846e4
  - name: crowdsecurity/blocklist-mirror
    newTag: v0.0.6@sha256:41ded9bfba0fc914b1a7be061ef2217c14fe5c300d0cb663b332f6566144f0c2
  - name: python
    newTag: 3.13-alpine@sha256:2d9aefe2fef018a7eb2c13064c89c71929800fd2e5dccdbf52ea5da5bb8d929a

