apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: security

resources:
  - secrets.yaml
  - network-policy.yaml
  - bouncer-unifi.yaml
  - cronjob-unifi-sync.yaml
  - pdb.yaml
  - blocklist-mirror-deployment.yaml
  - blocklist-mirror-service.yaml
  - blocklist-mirror-http-route.yaml
  - blocklist-mirror-http-route-eg.yaml
  - blocklist-mirror-servicemonitor.yaml
  - blocklist-mirror-alerts.yaml
  - envoy-bouncer-deployment.yaml
  - envoy-bouncer-service.yaml
  - envoy-bouncer-pdb.yaml
  - envoy-bouncer-servicemonitor.yaml
  - envoy-bouncer-reference-grant.yaml

helmCharts:
  - name: crowdsec
    repo: https://crowdsecurity.github.io/helm-charts
    version: 0.24.3
    releaseName: crowdsec
    namespace: security
    valuesFile: values.yaml

configMapGenerator:
  - name: crowdsec-config-template
    files:
      - config.yaml=templates/config.yaml
  - name: crowdsec-agent-config
    files:
      - config.yaml.local=templates/agent-config.yaml
  - name: crowdsec-dashboards
    options:
      labels:
        grafana_dashboard: "1"
    files:
      - crowdsec-overview.json=dashboards/crowdsec-overview.json
      - crowdsec-metrics.json=dashboards/crowdsec-metrics.json
generatorOptions:
  disableNameSuffixHash: true

images:
  - name: ghcr.io/hononeko/k8s-config-tools
    newTag: 0.1.1@sha256:fb03e8e7910a51472309b361675f38da44ee398ab6ec64b020b660d4d0d4e400
  - name: ghcr.io/teifun2/cs-unifi-bouncer
    newTag: v1.5.0@sha256:543f732286daf2262f2adea7f7bf3aada57e7ec75f8b1c2baf00e96e0a9649c5
  - name: alpine/k8s
    newTag: 1.37.2@sha256:dcb7185e112a453aa72f426754849a97357727ef8f40168fb208c8cf59952042
  - name: ghcr.io/hononeko/cs-edl-bouncer
    newTag: 0.5.0@sha256:49e59064626c180579bf8412fb679c834b6e36d3e35f0a7fb0a3c4022061b06e
  - name: ghcr.io/kdwils/envoy-proxy-bouncer
    newTag: v0.8.3@sha256:f5a68a85481641a3bcb17d0b1e90b661b2e6ce2424c17585bf236ffe46a178cc
