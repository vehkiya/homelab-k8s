apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: security

resources:
  - secrets.yaml
  - network-policy.yaml
  - cronjob-unifi-sync.yaml
  - cronjob-prune.yaml
  - pdb.yaml
  - blocklist-mirror-deployment.yaml
  - blocklist-mirror-service.yaml
  - blocklist-mirror-http-route.yaml
  - blocklist-mirror-servicemonitor.yaml
  - blocklist-mirror-alerts.yaml

helmCharts:
  - name: crowdsec
    repo: https://crowdsecurity.github.io/helm-charts
    version: 0.24.2
    releaseName: crowdsec
    namespace: security
    valuesFile: values.yaml

configMapGenerator:
  - name: crowdsec-config-template
    files:
      - config.yaml=templates/config.yaml
  - name: crowdsec-agent-config
    files:
      - config.yaml.local=templates/agent-config.yaml
  - name: crowdsec-dashboards
    options:
      labels:
        grafana_dashboard: "1"
    files:
      - crowdsec-overview.json=dashboards/crowdsec-overview.json
      - crowdsec-metrics.json=dashboards/crowdsec-metrics.json
generatorOptions:
  disableNameSuffixHash: true

images:
  - name: ghcr.io/hononeko/k8s-config-tools
    newTag: 0.1.1@sha256:fb03e8e7910a51472309b361675f38da44ee398ab6ec64b020b660d4d0d4e400
  - name: alpine/k8s
    newTag: 1.37.1@sha256:712dc5385d1c1a3f83b747fa9e40f64d433a97f72ff42f9755ff7dd1f62846e4
  - name: ghcr.io/hononeko/cs-edl-bouncer
    newTag: 0.4.0@sha256:f210998cac8997f0e74837667660db593f8bdd74d724c3bf64d5ee3edbd320cc
