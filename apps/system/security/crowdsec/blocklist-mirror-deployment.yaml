apiVersion: apps/v1
kind: Deployment
metadata:
  name: crowdsec-blocklist-mirror
  namespace: security
  labels:
    app.kubernetes.io/name: crowdsec-blocklist-mirror
    app.kubernetes.io/instance: crowdsec-blocklist-mirror
    app.kubernetes.io/part-of: crowdsec
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: crowdsec-blocklist-mirror
  template:
    metadata:
      labels:
        app.kubernetes.io/name: crowdsec-blocklist-mirror
        app.kubernetes.io/instance: crowdsec-blocklist-mirror
        app.kubernetes.io/part-of: crowdsec
        networking/expose-http-api: "true"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bouncer
          image: ghcr.io/hononeko/cs-edl-bouncer:0.1.0
          env:
            - name: CROWDSEC_URL
              value: "http://crowdsec-service:8080"
            - name: CROWDSEC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: crowdsec-secrets
                  key: LAPI_KEY
            - name: CROWDSEC_UPDATE_INTERVAL
              value: "30s"
            - name: EDL_SHARD_SIZE
              value: "9500"
          ports:
            - name: http-api
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http-api
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: http-api
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
