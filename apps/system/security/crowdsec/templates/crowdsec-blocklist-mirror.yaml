config_version: v1.0
crowdsec_config:
  lapi_url: http://crowdsec-service:8080/
  lapi_key: ${BOUNCER_API_KEY}
  update_frequency: 30s
  insecure_skip_verify: false
  supported_decisions_types:
    - ban
blocklists:
  - format: plain_text
    endpoint: /security/blocklist.txt
    aggregate: true
    authentication:
      type: none
listen_uri: 127.0.0.1:41412
metrics:
  enabled: true
  endpoint: /metrics
log_media: stdout
log_level: info
enable_access_logs: false
