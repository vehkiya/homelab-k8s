db_config:
  type: postgresql
  user: {{ .Env.DB_USER }}
  password: {{ .Env.DB_PASSWORD }}
  db_name: {{ .Env.DB_NAME }}
  host: {{ .Env.DB_HOST }}
  port: {{ .Env.DB_PORT }}
  sslmode: disable
  flush:
    max_items: 5000
    max_age: 7d
    # Every pod IP that uses a bouncer key gets its own <name>@<ip> entry, so each
    # Traefik/bouncer rollout leaves stale ones behind. Live bouncers pull every
    # 30-60s; parent entries (no last_pull) are never matched. A live entry deleted
    # after a long LAPI outage is recreated on its next pull with a full resync.
    bouncers_autodelete:
      api_key: 1h
      cert: 72h
    agents_autodelete:
      cert: 12h
      login_password: 12h
api:
  server:
    auto_registration:
      enabled: true
      token: "${REGISTRATION_TOKEN}"
      allowed_ranges:
        - "127.0.0.1/32"
        - "10.244.0.0/16"
        - "10.0.0.0/8"
        - "100.64.0.0/10"
