container_runtime: containerd

config:
  config.yaml.local: ""

# --- Local API Configuration ---
lapi:
  enabled: true
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                k8s-app: crowdsec
                type: lapi
            topologyKey: kubernetes.io/hostname
  persistentVolume:
    data:
      enabled: false # SQLite is disabled, PostgreSQL handles persistence
    config:
      enabled: false # Configuration persistence disabled for stateless replicas

  env:
    - name: BOUNCER_KEY_traefik
      valueFrom:
        secretKeyRef:
          name: crowdsec-secrets
          key: LAPI_KEY
    - name: BOUNCER_KEY_unifi
      valueFrom:
        secretKeyRef:
          name: crowdsec-secrets
          key: UNIFI_BUN_KEY
    - name: BOUNCER_KEY_blocklist_mirror
      valueFrom:
        secretKeyRef:
          name: crowdsec-secrets
          key: BLOCKLIST_MIRROR_BUN_KEY
    - name: ENROLL_KEY
      valueFrom:
        secretKeyRef:
          name: crowdsec-secrets
          key: ENROLL_KEY
    - name: ENROLL_INSTANCE_NAME
      value: "homelab-k8s-lapi"

  # Template configuration rendering via gomplate init container
  extraInitContainers:
    - name: inject-secrets
      image: ghcr.io/hononeko/k8s-config-tools
      command: ["gomplate", "-f", "/template/config.yaml", "-o", "/share/config.yaml.local"]
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 50m
          memory: 64Mi
      env:
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: crowdsec-secrets
              key: db-user
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: crowdsec-secrets
              key: db-password
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: crowdsec-secrets
              key: db-host
        - name: DB_PORT
          valueFrom:
            secretKeyRef:
              name: crowdsec-secrets
              key: db-port
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: crowdsec-secrets
              key: db-name
      volumeMounts:
        - name: crowdsec-template-vol
          mountPath: /template
        - name: crowdsec-config-share
          mountPath: /share

  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: kube-prometheus-stack

  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

  extraVolumes:
    - name: crowdsec-template-vol
      configMap:
        name: crowdsec-config-template
    - name: crowdsec-config-share
      emptyDir: {}

  extraVolumeMounts:
    - name: crowdsec-config-share
      mountPath: /etc/crowdsec/config.yaml.local
      subPath: config.yaml.local

# --- Agent Configuration ---
agent:
  enabled: true
  # Log acquisition configuration
  acquisition:
    - namespace: traefik
      podName: traefik-*
      program: traefik
      poll_without_inotify: true
    - namespace: security
      podName: authelia-[a-z0-9][a-z0-9][a-z0-9][a-z0-9][a-z0-9]
      program: authelia
      poll_without_inotify: true
    - namespace: media
      podName: jellyfin-*
      program: jellyfin
      poll_without_inotify: true
    - namespace: media
      podName: plex-*
      program: plex
      poll_without_inotify: true
  env:
    - name: COLLECTIONS
      value: >-
        crowdsecurity/traefik
        crowdsecurity/http-cve
        crowdsecurity/whitelist-good-actors
        crowdsecurity/base-http-scenarios
        LePresidente/authelia
        crowdsecurity/http-dos
        LePresidente/jellyfin
        crowdsecurity/plex
    - name: SCENARIOS
      value: "crowdsecurity/ban-defcon-drop_range"
    - name: POSTOVERFLOWS
      value: "crowdsecurity/ipv6_to_range"
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: kube-prometheus-stack
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
  extraVolumes:
    - name: agent-config-local
      configMap:
        name: crowdsec-agent-config
  extraVolumeMounts:
    - name: agent-config-local
      mountPath: /etc/crowdsec/config.yaml.local
      subPath: config.yaml.local
# --- AppSec (WAF) Configuration ---
appsec:
  enabled: true
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                k8s-app: crowdsec
                type: appsec
            topologyKey: kubernetes.io/hostname
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: kube-prometheus-stack
  acquisitions:
    - source: appsec
      listen_addr: "0.0.0.0:7422"
      path: /
      appsec_config: crowdsecurity/appsec-default
      labels:
        type: appsec
  env:
    - name: COLLECTIONS
      value: "crowdsecurity/appsec-virtual-patching crowdsecurity/appsec-generic-rules"
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
