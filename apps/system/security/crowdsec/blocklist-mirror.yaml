apiVersion: v1
kind: ConfigMap
metadata:
  name: crowdsec-blocklist-mirror-config
  namespace: security
  labels:
    app.kubernetes.io/name: crowdsec-blocklist-mirror
    app.kubernetes.io/instance: crowdsec-blocklist-mirror
    app.kubernetes.io/part-of: crowdsec
data:
  crowdsec-blocklist-mirror.yaml: |
    config_version: v1.0
    crowdsec_config:
      lapi_url: http://crowdsec-service:8080/
      lapi_key: ${BOUNCER_API_KEY}
      update_frequency: 30s
      insecure_skip_verify: false
      supported_decisions_types:
        - ban
    blocklists:
      - format: plain_text
        endpoint: /security/blocklist.txt
        aggregate: true
        authentication:
          type: none
    listen_uri: 127.0.0.1:41412
    metrics:
      enabled: true
      endpoint: /metrics
    log_media: stdout
    log_level: info
    enable_access_logs: false
  chunker.go: |
    package main

    import (
    	"fmt"
    	"io"
    	"log"
    	"net/http"
    	"os"
    	"path/filepath"
    	"sort"
    	"strings"
    	"time"
    )

    const (
    	chunkSize = 9500
    	listsDir  = "/tmp/www/lists"
    	v4URL     = "http://127.0.0.1:41412/security/blocklist.txt?ipv4only"
    	v6URL     = "http://127.0.0.1:41412/security/blocklist.txt?ipv6only"
    )

    var httpClient = &http.Client{
    	Timeout: 15 * time.Second,
    }

    func initFiles() {
    	if err := os.MkdirAll(listsDir, 0755); err != nil {
    		log.Printf("[chunker] Failed to create lists directory: %v", err)
    	}
    	initialFiles := []string{"ipv4-0.txt", "ipv4-1.txt", "ipv4-2.txt", "ipv6-0.txt"}
    	header := []byte("# CrowdSec EDL shard (initializing)\n")
    	for _, fn := range initialFiles {
    		fp := filepath.Join(listsDir, fn)
    		if _, err := os.Stat(fp); os.IsNotExist(err) {
    			if err := os.WriteFile(fp, header, 0644); err != nil {
    				log.Printf("[chunker] Failed to initialize %s: %v", fn, err)
    			}
    		}
    	}
    }

    func fetchIPs(url string) ([]string, error) {
    	req, err := http.NewRequest(http.MethodGet, url, nil)
    	if err != nil {
    		return nil, err
    	}
    	req.Header.Set("User-Agent", "CrowdSec-EDL-Chunker/1.0")

    	resp, err := httpClient.Do(req)
    	if err != nil {
    		return nil, err
    	}
    	defer resp.Body.Close()

    	if resp.StatusCode != http.StatusOK {
    		return nil, fmt.Errorf("unexpected status %d from %s", resp.StatusCode, url)
    	}

    	body, err := io.ReadAll(resp.Body)
    	if err != nil {
    		return nil, err
    	}

    	raw := string(body)
    	seen := make(map[string]struct{})
    	var entries []string

    	lines := strings.Split(raw, "\n")
    	for _, line := range lines {
    		line = strings.TrimSpace(line)
    		if line == "" || strings.HasPrefix(line, "#") {
    			continue
    		}
    		if _, exists := seen[line]; !exists {
    			seen[line] = struct{}{}
    			entries = append(entries, line)
    		}
    	}

    	sort.Strings(entries)
    	return entries, nil
    }

    func updateShards(family string, items []string, minShards int) error {
    	var chunks [][]string
    	for i := 0; i < len(items); i += chunkSize {
    		end := i + chunkSize
    		if end > len(items) {
    			end = len(items)
    		}
    		chunks = append(chunks, items[i:end])
    	}

    	numShards := len(chunks)
    	if numShards < minShards {
    		numShards = minShards
    	}

    	for idx := 0; idx < numShards; idx++ {
    		var shardItems []string
    		if idx < len(chunks) {
    			shardItems = chunks[idx]
    		}

    		filename := fmt.Sprintf("%s-%d.txt", family, idx)
    		targetPath := filepath.Join(listsDir, filename)
    		tempPath := filepath.Join(listsDir, fmt.Sprintf(".%s.tmp", filename))

    		var builder strings.Builder
    		builder.WriteString(fmt.Sprintf("# CrowdSec EDL shard (count: %d)\n", len(shardItems)))
    		for _, item := range shardItems {
    			builder.WriteString(item)
    			builder.WriteByte('\n')
    		}

    		if err := os.WriteFile(tempPath, []byte(builder.String()), 0644); err != nil {
    			return fmt.Errorf("failed to write temp shard %s: %w", tempPath, err)
    		}

    		if err := os.Rename(tempPath, targetPath); err != nil {
    			return fmt.Errorf("failed to rename temp shard to %s: %w", targetPath, err)
    		}
    	}

    	return nil
    }

    func syncLists() error {
    	v4Items, err := fetchIPs(v4URL)
    	if err != nil {
    		return fmt.Errorf("fetching IPv4: %w", err)
    	}

    	v6Items, err := fetchIPs(v6URL)
    	if err != nil {
    		return fmt.Errorf("fetching IPv6: %w", err)
    	}

    	if err := updateShards("ipv4", v4Items, 3); err != nil {
    		return fmt.Errorf("updating IPv4 shards: %w", err)
    	}

    	if err := updateShards("ipv6", v6Items, 1); err != nil {
    		return fmt.Errorf("updating IPv6 shards: %w", err)
    	}

    	log.Printf("[chunker] Sync succeeded: %d IPv4 entries, %d IPv6 entries", len(v4Items), len(v6Items))
    	return nil
    }

    func backgroundSync() {
    	log.Println("[chunker] Starting background sync goroutine...")
    	initialSyncDone := false
    	for {
    		err := syncLists()
    		if err != nil {
    			if !initialSyncDone {
    				log.Printf("[chunker] Waiting for mirror on 127.0.0.1:41412: %v", err)
    				time.Sleep(2 * time.Second)
    			} else {
    				log.Printf("[chunker] Sync error: %v", err)
    				time.Sleep(60 * time.Second)
    			}
    			continue
    		}

    		initialSyncDone = true
    		time.Sleep(60 * time.Second)
    	}
    }

    func handleLists(w http.ResponseWriter, r *http.Request) {
    	if r.Method != http.MethodGet && r.Method != http.MethodHead {
    		http.Error(w, "Method Not Allowed", http.StatusMethodNotAllowed)
    		return
    	}

    	filename := strings.TrimPrefix(r.URL.Path, "/lists/")
    	if filename == "" || strings.Contains(filename, "/") || strings.Contains(filename, "\\") || strings.Contains(filename, "..") {
    		http.Error(w, "Invalid filename", http.StatusBadRequest)
    		return
    	}

    	targetPath := filepath.Join(listsDir, filename)
    	data, err := os.ReadFile(targetPath)
    	if err != nil {
    		if os.IsNotExist(err) {
    			http.Error(w, "File Not Found", http.StatusNotFound)
    		} else {
    			http.Error(w, "Internal Server Error", http.StatusInternalServerError)
    		}
    		return
    	}

    	w.Header().Set("Content-Type", "text/plain; charset=utf-8")
    	w.Header().Set("Content-Length", fmt.Sprintf("%d", len(data)))
    	w.WriteHeader(http.StatusOK)
    	if r.Method != http.MethodHead {
    		_, _ = w.Write(data)
    	}
    }

    func handleHealthz(w http.ResponseWriter, r *http.Request) {
    	if r.Method != http.MethodGet && r.Method != http.MethodHead {
    		http.Error(w, "Method Not Allowed", http.StatusMethodNotAllowed)
    		return
    	}
    	body := []byte("ok\n")
    	w.Header().Set("Content-Type", "text/plain; charset=utf-8")
    	w.Header().Set("Content-Length", fmt.Sprintf("%d", len(body)))
    	w.WriteHeader(http.StatusOK)
    	if r.Method != http.MethodHead {
    		_, _ = w.Write(body)
    	}
    }

    func main() {
    	initFiles()
    	go backgroundSync()

    	mux := http.NewServeMux()
    	mux.HandleFunc("/healthz", handleHealthz)
    	mux.HandleFunc("/lists/", handleLists)

    	server := &http.Server{
    		Addr:              ":8080",
    		Handler:           mux,
    		ReadHeaderTimeout: 5 * time.Second,
    	}

    	log.Printf("[chunker] Serving EDL on :8080")
    	if err := server.ListenAndServe(); err != nil && err != http.ErrServerClosed {
    		log.Fatalf("[chunker] Server error: %v", err)
    	}
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crowdsec-blocklist-mirror
  namespace: security
  labels:
    app.kubernetes.io/name: crowdsec-blocklist-mirror
    app.kubernetes.io/instance: crowdsec-blocklist-mirror
    app.kubernetes.io/part-of: crowdsec
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: crowdsec-blocklist-mirror
  template:
    metadata:
      labels:
        app.kubernetes.io/name: crowdsec-blocklist-mirror
        app.kubernetes.io/instance: crowdsec-blocklist-mirror
        app.kubernetes.io/part-of: crowdsec
        networking/expose-http-api: "true"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: build-chunker
          image: golang:1.24-alpine@sha256:8bee1901f1e530bfb4a7850aa7a479d17ae3a18beb6e09064ed54cfd245b7191
          command:
            - go
            - build
            - -ldflags=-s -w
            - -o
            - /bin-out/chunker
            - /config/chunker.go
          env:
            - name: CGO_ENABLED
              value: "0"
            - name: GOCACHE
              value: /tmp/go-cache
            - name: GOPATH
              value: /tmp/go
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: bin-out
              mountPath: /bin-out
            - name: tmp
              mountPath: /tmp
      containers:
        - name: mirror
          image: crowdsecurity/blocklist-mirror:v0.0.6@sha256:41ded9bfba0fc914b1a7be061ef2217c14fe5c300d0cb663b332f6566144f0c2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: BOUNCER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: crowdsec-secrets
                  key: LAPI_KEY
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /etc/crowdsec/bouncers/crowdsec-blocklist-mirror.yaml
              subPath: crowdsec-blocklist-mirror.yaml
              readOnly: true
            - name: tmp
              mountPath: /tmp
        - name: chunker
          image: crowdsecurity/blocklist-mirror:v0.0.6@sha256:41ded9bfba0fc914b1a7be061ef2217c14fe5c300d0cb663b332f6566144f0c2
          command:
            - /bin-out/chunker
          ports:
            - name: http-api
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http-api
          readinessProbe:
            httpGet:
              path: /healthz
              port: http-api
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: bin-out
              mountPath: /bin-out
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: crowdsec-blocklist-mirror-config
        - name: bin-out
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: crowdsec-blocklist-mirror
  namespace: security
  labels:
    app.kubernetes.io/name: crowdsec-blocklist-mirror
    app.kubernetes.io/instance: crowdsec-blocklist-mirror
    app.kubernetes.io/part-of: crowdsec
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: crowdsec-blocklist-mirror
  ports:
    - name: http-api
      port: 8080
      targetPort: http-api
      protocol: TCP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: crowdsec-blocklist-mirror-route
  namespace: security
  labels:
    app.kubernetes.io/name: crowdsec-blocklist-mirror
    app.kubernetes.io/instance: crowdsec-blocklist-mirror
    app.kubernetes.io/part-of: crowdsec
spec:
  hostnames:
    - blocklist.kerrlab.app
  parentRefs:
    - name: internal-gateway
      namespace: traefik
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: crowdsec-blocklist-mirror
          port: 8080
