apiVersion: v1
kind: ServiceAccount
metadata:
  name: crowdsec-prune-sa
  namespace: security
  labels:
    app.kubernetes.io/name: crowdsec-prune
    app.kubernetes.io/part-of: crowdsec
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: crowdsec-prune-role
  namespace: security
  labels:
    app.kubernetes.io/name: crowdsec-prune
    app.kubernetes.io/part-of: crowdsec
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: crowdsec-prune-rb
  namespace: security
  labels:
    app.kubernetes.io/name: crowdsec-prune
    app.kubernetes.io/part-of: crowdsec
subjects:
  - kind: ServiceAccount
    name: crowdsec-prune-sa
    namespace: security
roleRef:
  kind: Role
  name: crowdsec-prune-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: crowdsec-prune-machines
  namespace: security
  labels:
    app.kubernetes.io/name: crowdsec-prune
    app.kubernetes.io/part-of: crowdsec
spec:
  schedule: "0 */6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: crowdsec-prune
            app.kubernetes.io/part-of: crowdsec
        spec:
          serviceAccountName: crowdsec-prune-sa
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            fsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: prune
              image: alpine/k8s:1.37.0@sha256:b421c2e9419edb98db39b6ab641669f4db7bb2acf354f22450c6b7e7176d1ff4
              command:
                - kubectl
                - exec
                - -n
                - security
                - deploy/crowdsec-lapi
                - -c
                - crowdsec-lapi
                - --
                - cscli
                - machines
                - prune
                - --duration
                - 1h
                - --force
              env:
                - name: HOME
                  value: /tmp
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
