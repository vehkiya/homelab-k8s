apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: meilisearch-policy
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: meilisearch
  # ----=== Ingress ===----
  ingress:
    # === Allow access from Bar Assistant ===
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": home
            "app": bar-assistant
      toPorts:
        - ports:
            - port: "7700"
              protocol: TCP
    # === Allow access from Fluxer API and Worker ===
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": comms
            "app": api
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": comms
            "app": worker
      toPorts:
        - ports:
            - port: "7700"
              protocol: TCP
    # === Allow access from Traefik and the internal Envoy fleet ===
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": traefik
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: envoy-gateway-system
            gateway.envoyproxy.io/owning-gateway-namespace: edge
            gateway.envoyproxy.io/owning-gateway-name: internal-gateway
      toPorts:
        - ports:
            - port: "7700"
              protocol: TCP
