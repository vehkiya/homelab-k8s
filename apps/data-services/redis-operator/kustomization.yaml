apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: data-services
helmCharts:
  - name: redis-operator
    repo: https://ot-container-kit.github.io/helm-charts/
    version: 0.26.1
    releaseName: redis-operator
    includeCRDs: true
    valuesInline:
      resources:
        requests:
          cpu: 20m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 256Mi

resources:
  - network-policy.yaml