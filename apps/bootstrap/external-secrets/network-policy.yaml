apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: external-secrets-all-policies
spec:
  description: "Shared rules for the External Secrets controller, webhook and cert-controller"
  endpointSelector:
    matchExpressions:
      # The chart labels the three components by name only (no app.kubernetes.io/component)
      - { key: app.kubernetes.io/name, operator: In, values: [ external-secrets, external-secrets-cert-controller, external-secrets-webhook ] }
  ingress:
    # Allow Prometheus in observability namespace to scrape metrics (8080)
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "8080"
              protocol: "TCP"
  egress:
    # Kubernetes API. The kubernetes Service resolves to the control-plane nodes on 6443, which
    # carry the kube-apiserver identity (also on the host identity of a control-plane node).
    - toEntities:
        - "kube-apiserver"
      toPorts:
        - ports:
            - port: "6443"
              protocol: "TCP"
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: external-secrets-controller-policy
spec:
  description: "Allow the External Secrets controller to reach OpenBao"
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: external-secrets
  egress:
    # OpenBao (bao.kerrlab.app) behind the Synology reverse proxy
    - toCIDR:
        - "10.10.1.218/32"
      toPorts:
        - ports:
            - port: "443"
              protocol: "TCP"
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: external-secrets-webhook-ingress
spec:
  description: "Allow the Kubernetes API server to call the validating webhook"
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: external-secrets-webhook
  ingress:
    # The webhook listens on 10250 (--port=10250); the Service maps 443 to it
    - fromEntities:
        - "kube-apiserver"
      toPorts:
        - ports:
            - port: "10250"
              protocol: "TCP"
