apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: external-secrets
# Make serverSideApply=true
helmCharts:
  - name: external-secrets
    repo: https://charts.external-secrets.io
    version: 2.14.0
    releaseName: external-secrets
    namespace: external-secrets
    includeCRDs: true
    valuesFile: values.yaml

resources:
  - openbao-cluster-secret-store.yaml
  - rbac-auth-delegator.yaml
  - network-policy.yaml
images:
  - name: dhi.io/external-secrets
    newTag: 2.14.0@sha256:3a41d3441b3089e4044d2028055f87064fbd51a8ed1a2d2236f88b6a9e3309a6

configMapGenerator:
  - name: external-secrets-dashboard
    options:
      labels:
        grafana_dashboard: "1"
    files:
      - external-secrets.json=dashboards/external-secrets.json
generatorOptions:
  disableNameSuffixHash: true
