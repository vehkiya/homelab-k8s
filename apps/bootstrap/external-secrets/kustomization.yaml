apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: external-secrets
# Make serverSideApply=true
helmCharts:
  - name: external-secrets
    repo: https://charts.external-secrets.io
    version: 2.11.0
    releaseName: external-secrets
    namespace: external-secrets
    includeCRDs: true
    valuesFile: values.yaml

resources:
  - openbao-cluster-secret-store.yaml
  - rbac-auth-delegator.yaml
  - network-policy.yaml
images:
  - name: dhi.io/external-secrets
    newTag: 2.11.0@sha256:fcae3ee5b00c32a364cf14d0ab2d3f3b7dbcfd36ab7cf0603b8cc5603c0a057b
