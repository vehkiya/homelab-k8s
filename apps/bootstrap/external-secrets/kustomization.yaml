apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: external-secrets
# Make serverSideApply=true
helmCharts:
  - name: external-secrets
    repo: https://charts.external-secrets.io
    version: 2.13.0
    releaseName: external-secrets
    namespace: external-secrets
    includeCRDs: true
    valuesFile: values.yaml

resources:
  - openbao-cluster-secret-store.yaml
  - rbac-auth-delegator.yaml
  - network-policy.yaml
images:
  - name: dhi.io/external-secrets
    newTag: 2.12.0@sha256:b5ba63e4ba3dab850b647651fa059da431d371351aa1e315008f3401041a601a

configMapGenerator:
  - name: external-secrets-dashboard
    options:
      labels:
        grafana_dashboard: "1"
    files:
      - external-secrets.json=dashboards/external-secrets.json
generatorOptions:
  disableNameSuffixHash: true
