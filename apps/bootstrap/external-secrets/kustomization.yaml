apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: external-secrets
# Make serverSideApply=true
helmCharts:
  - name: external-secrets
    repo: https://charts.external-secrets.io
    version: 2.14.0
    releaseName: external-secrets
    namespace: external-secrets
    includeCRDs: true
    valuesFile: values.yaml

resources:
  - openbao-cluster-secret-store.yaml
  - rbac-auth-delegator.yaml
  - network-policy.yaml
images:
  - name: dhi.io/external-secrets
    newTag: 2.13.0@sha256:e65f51a760c97361e231ad9a6e7885e625268394e0b1dd53607ee1a2180b308b

configMapGenerator:
  - name: external-secrets-dashboard
    options:
      labels:
        grafana_dashboard: "1"
    files:
      - external-secrets.json=dashboards/external-secrets.json
generatorOptions:
  disableNameSuffixHash: true
