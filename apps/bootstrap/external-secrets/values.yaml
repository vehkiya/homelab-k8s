    repository: dhi.io/external-secrets
    tag: 2.11.0
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi

certController:
  image:
    repository: dhi.io/external-secrets
    tag: 2.11.0
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi

serviceMonitor:
  enabled: true
  additionalLabels:
    release: kube-prometheus-stack

grafanaDashboard:
  enabled: true
  sidecarLabel: "grafana_dashboard"
  sidecarLabelValue: "1"


