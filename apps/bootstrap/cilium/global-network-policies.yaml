apiVersion: "cilium.io/v2"
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: "ccnp-global-default-deny"
spec:
  description: "This policy establishes the cluster-wide zero-trust baseline. It selects all endpoints and applies a default-deny for all ingress and egress traffic."
  endpointSelector: {}
  ingress:
    - {}
  egress:
    - {}
---
apiVersion: "cilium.io/v2"
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: "ccnp-allow-health-probes"
spec:
  description: "Allows kubelet liveness/readiness probes and host-level communication from the 'host' and 'health' entities."
  endpointSelector: {}
  ingress:
    - fromEntities:
        - "host"
        - "health"
---
apiVersion: "cilium.io/v2"
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: "ccnp-allow-egress-dns"
spec:
  description: "Allows all Cilium-managed endpoints to send DNS queries to CoreDNS."
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: coredns
      toPorts:
        - ports:
            - port: "53"
              protocol: "UDP"
            - port: "53"
              protocol: "TCP"
---
apiVersion: "cilium.io/v2"
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: "ccnp-allow-web-ui-ingress-traefik"
spec:
  description: "Allows all Cilium-managed endpoints to receive ingress traffic from Traefik."
  endpointSelector:
    matchLabels:
      networking/expose-web-ui: "true"
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: traefik
            app.kubernetes.io/name: traefik
      toPorts:
        - ports:
            - port: "web-ui"
              protocol: "TCP"
---
apiVersion: "cilium.io/v2"
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: "ccnp-allow-http-api-ingress-traefik"
spec:
  description: "Allows all Cilium-managed endpoints to receive ingress traffic from Traefik."
  endpointSelector:
    matchLabels:
      networking/expose-http-api: "true"
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: traefik
            app.kubernetes.io/name: traefik
      toPorts:
        - ports:
            - port: "http-api"
              protocol: "TCP"
---
# 5. Global OIDC Client Egress to Traefik (for https://auth.kerrlab.app Hairpin)
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: ccnp-allow-oidc-client-egress
spec:
  endpointSelector:
    matchLabels:
      networking/oidc-client: "true"
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: traefik
            k8s:io.kubernetes.pod.namespace: traefik
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
            - port: "9443"
              protocol: TCP
    - toCIDR:
        - 10.10.1.16/32
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
