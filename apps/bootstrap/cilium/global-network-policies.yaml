apiVersion: "cilium.io/v2"
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: "ccnp-global-default-deny"
spec:
  description: "This policy establishes the cluster-wide zero-trust baseline. It selects all endpoints and applies a default-deny for all ingress and egress traffic."
  endpointSelector: {}
  ingress:
    - {}
  egress:
    - {}
---
apiVersion: "cilium.io/v2"
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: "ccnp-allow-health-probes"
spec:
  description: "Allows kubelet liveness/readiness probes and host-level communication from the 'host' and 'health' entities."
  endpointSelector: {}
  ingress:
    - fromEntities:
        - "host"
        - "health"
---
apiVersion: "cilium.io/v2"
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: "ccnp-allow-cilium-health"
spec:
  description: "Lets the agents on other nodes probe this node's Cilium health endpoint (TCP 4240, ICMP). Probes come from node IPs: remote-node, or kube-apiserver on control-plane nodes."
  endpointSelector:
    matchLabels:
      "reserved:health": ""
  ingress:
    - fromEntities:
        - "remote-node"
        - "kube-apiserver"
---
apiVersion: "cilium.io/v2"
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: "ccnp-allow-egress-dns"
spec:
  description: "Allows all Cilium-managed endpoints to send DNS queries to CoreDNS."
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: coredns
      toPorts:
        - ports:
            - port: "53"
              protocol: "UDP"
            - port: "53"
              protocol: "TCP"
---
apiVersion: "cilium.io/v2"
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: "ccnp-allow-web-ui-ingress-traefik"
spec:
  description: "Allows all Cilium-managed endpoints to receive ingress traffic from Traefik."
  endpointSelector:
    matchLabels:
      networking/expose-web-ui: "true"
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: traefik
            app.kubernetes.io/name: traefik
      toPorts:
        - ports:
            - port: "web-ui"
              protocol: "TCP"
---
apiVersion: "cilium.io/v2"
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: "ccnp-allow-http-api-ingress-traefik"
spec:
  description: "Allows all Cilium-managed endpoints to receive ingress traffic from Traefik."
  endpointSelector:
    matchLabels:
      networking/expose-http-api: "true"
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: traefik
            app.kubernetes.io/name: traefik
      toPorts:
        - ports:
            - port: "http-api"
              protocol: "TCP"
---
apiVersion: "cilium.io/v2"
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: "ccnp-allow-web-ui-ingress-envoy-internal"
spec:
  description: "Allows endpoints labeled networking/expose-web-ui to receive ingress traffic from the internal Envoy Gateway fleet."
  endpointSelector:
    matchLabels:
      networking/expose-web-ui: "true"
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: envoy-gateway-system
            gateway.envoyproxy.io/owning-gateway-namespace: edge
            gateway.envoyproxy.io/owning-gateway-name: internal-gateway
      toPorts:
        - ports:
            - port: "web-ui"
              protocol: "TCP"
---
apiVersion: "cilium.io/v2"
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: "ccnp-allow-http-api-ingress-envoy-internal"
spec:
  description: "Allows endpoints labeled networking/expose-http-api to receive ingress traffic from the internal Envoy Gateway fleet."
  endpointSelector:
    matchLabels:
      networking/expose-http-api: "true"
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: envoy-gateway-system
            gateway.envoyproxy.io/owning-gateway-namespace: edge
            gateway.envoyproxy.io/owning-gateway-name: internal-gateway
      toPorts:
        - ports:
            - port: "http-api"
              protocol: "TCP"
---
apiVersion: "cilium.io/v2"
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: "ccnp-allow-web-ui-ingress-envoy-dmz"
spec:
  description: "Allows endpoints labeled networking/expose-dmz and networking/expose-web-ui to receive ingress traffic from the DMZ Envoy Gateway fleet."
  endpointSelector:
    matchLabels:
      networking/expose-dmz: "true"
      networking/expose-web-ui: "true"
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: envoy-gateway-system
            gateway.envoyproxy.io/owning-gateway-namespace: edge
            gateway.envoyproxy.io/owning-gateway-name: external-gateway
      toPorts:
        - ports:
            - port: "web-ui"
              protocol: "TCP"
---
apiVersion: "cilium.io/v2"
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: "ccnp-allow-http-api-ingress-envoy-dmz"
spec:
  description: "Allows endpoints labeled networking/expose-dmz and networking/expose-http-api to receive ingress traffic from the DMZ Envoy Gateway fleet."
  endpointSelector:
    matchLabels:
      networking/expose-dmz: "true"
      networking/expose-http-api: "true"
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: envoy-gateway-system
            gateway.envoyproxy.io/owning-gateway-namespace: edge
            gateway.envoyproxy.io/owning-gateway-name: external-gateway
      toPorts:
        - ports:
            - port: "http-api"
              protocol: "TCP"
---
# 5. Global OIDC Client Egress to Traefik (for https://auth.kerrlab.app Hairpin)
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: ccnp-allow-oidc-client-egress
spec:
  endpointSelector:
    matchLabels:
      networking/oidc-client: "true"
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: traefik
            k8s:io.kubernetes.pod.namespace: traefik
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
            - port: "9443"
              protocol: TCP
    # Internal Envoy fleet (container port 10443)
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: envoy-gateway-system
            gateway.envoyproxy.io/owning-gateway-namespace: edge
            gateway.envoyproxy.io/owning-gateway-name: internal-gateway
      toPorts:
        - ports:
            - port: "10443"
              protocol: TCP
    - toCIDR:
        - 10.10.1.16/32
        - 10.10.1.17/32
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
