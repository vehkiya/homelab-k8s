apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kube-system
helmCharts:
  - name: cilium
    repo: https://helm.cilium.io/
    version: 1.20.2
    releaseName: cilium
    namespace: kube-system
    valuesFile: values/values.yaml
    includeCRDs: true

resources:
  - bgp.yaml
  - ip-pools.yaml
  - global-network-policies.yaml

configMapGenerator:
  - name: cilium-dashboard
    options:
      labels:
        grafana_dashboard: "1"
    files:
      - cilium-dashboard.json=dashboards/cilium-dashboard.json
  - name: cilium-operator-dashboard
    options:
      labels:
        grafana_dashboard: "1"
    files:
      - cilium-operator-dashboard.json=dashboards/cilium-operator-dashboard.json
generatorOptions:
  disableNameSuffixHash: true
