apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kube-system
helmCharts:
  - name: coredns
    repo: https://coredns.github.io/helm
    version: 1.48.2
    releaseName: coredns
    namespace: kube-system
    valuesFile: values/values.yaml
    includeCRDs: true

resources:
  - network-policy.yaml

images:
  - name: dhi.io/coredns
    newTag: 1.14.7@sha256:cb5e50b87ca7f3105924a89e4d942d06364bf3b9a9e2c034f9b7818164eb18c2

patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: coredns
      namespace: kube-system
    patch: |-
      - op: replace
        path: /kind
        value: DaemonSet
      - op: remove
        path: /spec/replicas
      - op: remove
        path: /spec/strategy
      # Start the replacement pod before stopping the old one, so a node never lacks a local CoreDNS
      - op: add
        path: /spec/updateStrategy
        value:
          type: RollingUpdate
          rollingUpdate:
            maxSurge: 1
            maxUnavailable: 0
