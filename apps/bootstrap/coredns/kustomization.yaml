apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kube-system
helmCharts:
  - name: coredns
    repo: https://coredns.github.io/helm
    version: 1.47.1
    releaseName: coredns
    namespace: kube-system
    valuesFile: values/values.yaml
    includeCRDs: true

resources:
  - network-policy.yaml

images:
  - name: dhi.io/coredns
    newTag: 1.14.7@sha256:c52e52e9989942aadbc31006f21d23c08f96d241e7837fc44d4f84aa1a4bdc6c

patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: coredns
      namespace: kube-system
    patch: |-
      - op: replace
        path: /kind
        value: DaemonSet
      - op: remove
        path: /spec/replicas
      - op: remove
        path: /spec/strategy
