apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kube-system
helmCharts:
  - name: coredns
    repo: https://coredns.github.io/helm
    version: 1.48.2
    releaseName: coredns
    namespace: kube-system
    valuesFile: values/values.yaml
    includeCRDs: true

resources:
  - network-policy.yaml

images:
  - name: dhi.io/coredns
    newTag: 1.14.7@sha256:0ead1c72ae9378b3acd040326558e4469e3e3919063dcad2c8064f2209d6920b

patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: coredns
      namespace: kube-system
    patch: |-
      - op: replace
        path: /kind
        value: DaemonSet
      - op: remove
        path: /spec/replicas
      - op: remove
        path: /spec/strategy
      # Start the replacement pod before stopping the old one, so a node never lacks a local CoreDNS
      - op: add
        path: /spec/updateStrategy
        value:
          type: RollingUpdate
          rollingUpdate:
            maxSurge: 1
            maxUnavailable: 0
