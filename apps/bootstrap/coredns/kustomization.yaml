apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kube-system
helmCharts:
  - name: coredns
    repo: https://coredns.github.io/helm
    version: 1.50.8
    releaseName: coredns
    namespace: kube-system
    valuesFile: values/values.yaml
    includeCRDs: true

resources:
  - network-policy.yaml

images:
  - name: dhi.io/coredns
    newTag: 1.15.0@sha256:80f9dcbd39fef011e74ffe9c92ad4358acbb2f76780d959da00ca86fd5e1f15f

patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: coredns
      namespace: kube-system
    patch: |-
      - op: replace
        path: /kind
        value: DaemonSet
      - op: remove
        path: /spec/replicas
      - op: remove
        path: /spec/strategy
      # Start the replacement pod before stopping the old one, so a node never lacks a local CoreDNS
      - op: add
        path: /spec/updateStrategy
        value:
          type: RollingUpdate
          rollingUpdate:
            maxSurge: 1
            maxUnavailable: 0
