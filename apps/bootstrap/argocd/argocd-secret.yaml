apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-store
  target:
    name: argocd-secret
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/name: argocd-secret
          app.kubernetes.io/part-of: argocd
      data:
        server.secretkey: "{{ .server_key }}"
        oidc.authelia.clientSecret: "{{ .oidc_client_secret }}"
  data:
    - secretKey: server_key
      remoteRef:
        key: argocd/admin
        property: server_secretkey
    - secretKey: oidc_client_secret
      remoteRef:
        key: argocd/admin
        property: oidc_client_secret