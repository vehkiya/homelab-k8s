apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd
resources:
  - argocd-secret.yaml
  # renovate: datasource=github-tags depName=argoproj/argo-cd
  - https://raw.githubusercontent.com/argoproj/argo-cd/v3.5.6/manifests/ha/install.yaml
  - argocd-repositories-external-secret.yaml
  - ingress-route.yaml
  - network-policy.yaml

images:
  - name: quay.io/argoproj/argocd
    newName: dhi.io/argocd
    newTag: 3.5.6@sha256:00f7c78769ab7c39e3da8835f31cb202c8b8ea7fd1586282441e0f06a4589e2d
  - name: ghcr.io/dexidp/dex
    newName: dhi.io/dex
    newTag: 2.46.1@sha256:d0aa1687e10b53f4bbfd746f418c4c559ddd632dc812bdba1dc081df949d32be
  - name: public.ecr.aws/docker/library/redis
    newName: dhi.io/redis
    newTag: 8.10.2-compat@sha256:62f0464bb3a48bccf2064c0b793d98e08d2ad763ee60d6913ba18842fec5ce3d

patches:
  - path: argocd-cm.yaml
    target:
      kind: ConfigMap
      name: argocd-cm
  - path: argocd-cmd-params-cm.yaml
    target:
      kind: ConfigMap
      name: argocd-cmd-params-cm
  - path: argocd-rbac-cm.yaml
    target:
      kind: ConfigMap
      name: argocd-rbac-cm
  - path: repo-server-patch.yaml
    target:
      kind: Deployment
      name: argocd-repo-server
  - path: server-patch.yaml
    target:
      kind: Deployment
      name: argocd-server
  - path: controllers-affinity-patch.yaml
