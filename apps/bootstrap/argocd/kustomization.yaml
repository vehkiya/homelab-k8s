apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd
resources:
  - argocd-secret.yaml
  # renovate: datasource=github-tags depName=argoproj/argo-cd
  - https://raw.githubusercontent.com/argoproj/argo-cd/v3.6.1/manifests/ha/install.yaml
  - argocd-repositories-external-secret.yaml
  - ingress-route.yaml
  - ingress-route-eg.yaml
  - network-policy.yaml

images:
  - name: quay.io/argoproj/argocd
    newName: dhi.io/argocd
    newTag: 3.6.1@sha256:9a58e5dc12171799f5299c8dedfa730b115b1559b13d6cbd1615f7d5014399d2
  - name: ghcr.io/dexidp/dex
    newName: dhi.io/dex
    newTag: 2.46.1@sha256:a7aad2c7d382cbd141b8d76ad8a5a17d750ce1bb80b278e1248978b83c358d3f
  - name: public.ecr.aws/docker/library/redis
    newName: dhi.io/redis
    newTag: 8.10.3-compat@sha256:c58e073a534d7ed4c7ef96c087c03fe8bb56adad4e3629cdaac910c3bb072ffc

patches:
  - path: argocd-cm.yaml
    target:
      kind: ConfigMap
      name: argocd-cm
  - path: argocd-cmd-params-cm.yaml
    target:
      kind: ConfigMap
      name: argocd-cmd-params-cm
  - path: argocd-rbac-cm.yaml
    target:
      kind: ConfigMap
      name: argocd-rbac-cm
  - path: repo-server-patch.yaml
    target:
      kind: Deployment
      name: argocd-repo-server
  - path: server-patch.yaml
    target:
      kind: Deployment
      name: argocd-server
  - path: controllers-affinity-patch.yaml
