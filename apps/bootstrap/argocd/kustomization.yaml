apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd
resources:
  - namespace.yaml
  - argocd-secret.yaml
  # renovate: datasource=github-tags depName=argoproj/argo-cd
  - https://raw.githubusercontent.com/argoproj/argo-cd/v3.5.3/manifests/ha/install.yaml
  - argocd-repositories-external-secret.yaml
  - ingress-route.yaml
  - network-policy.yaml

images:
  - name: quay.io/argoproj/argocd
    newName: dhi.io/argocd
    newTag: 3.5.3@sha256:3410c32abd3fd68e1e320bc3ec2219f24433aaa0e2c1483caef23feca55d2a03
  - name: ghcr.io/dexidp/dex
    newName: dhi.io/dex
    newTag: 2.45.1@sha256:4bf4ddeefa9766814df8bb2fd543ab12c25f188eb99c9640be1fdba5f8a3a90e
  - name: public.ecr.aws/docker/library/redis
    newName: dhi.io/redis
    newTag: 8.10.2-compat@sha256:56bb4ae0352d251a9b131643defd709c9c3c35b06d5ee13272ec9a86bdd388e4

patches:
  - path: argocd-cm.yaml
    target:
      kind: ConfigMap
      name: argocd-cm
  - path: argocd-cmd-params-cm.yaml
    target:
      kind: ConfigMap
      name: argocd-cmd-params-cm
  - path: repo-server-patch.yaml
    target:
      kind: Deployment
      name: argocd-repo-server
