apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd
resources:
  - namespace.yaml
  - argocd-secret.yaml
  # renovate: datasource=github-tags depName=argoproj/argo-cd
  - https://raw.githubusercontent.com/argoproj/argo-cd/v3.5.3/manifests/ha/install.yaml
  - argocd-repositories-external-secret.yaml
  - ingress-route.yaml
  - network-policy.yaml

images:
  - name: quay.io/argoproj/argocd
    newName: dhi.io/argocd
    newTag: 3.5.3@sha256:b1e02f8cb7d3c275ee799f159999f98ecbed51fb1d7d9f1d638653592eee70b3
  - name: ghcr.io/dexidp/dex
    newName: dhi.io/dex
    newTag: 2.45.1@sha256:761aaaea162923e8ad0bdf12e9ffcff9a58840c5d32f2e117d4bfbc971d14c77
  - name: public.ecr.aws/docker/library/redis
    newName: dhi.io/redis
    newTag: 8.10.2-compat@sha256:596c6b9c9a190bfc51893c2a0e8c10d987d1d080ed9a2ac6137d7d909ccfd0a7

patches:
  - path: argocd-cm.yaml
    target:
      kind: ConfigMap
      name: argocd-cm
  - path: argocd-cmd-params-cm.yaml
    target:
      kind: ConfigMap
      name: argocd-cmd-params-cm
  - path: repo-server-patch.yaml
    target:
      kind: Deployment
      name: argocd-repo-server
