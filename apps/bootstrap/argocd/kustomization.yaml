apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd
resources:
  - argocd-secret.yaml
  # renovate: datasource=github-tags depName=argoproj/argo-cd
  - https://raw.githubusercontent.com/argoproj/argo-cd/v3.5.6/manifests/ha/install.yaml
  - argocd-repositories-external-secret.yaml
  - ingress-route.yaml
  - network-policy.yaml

images:
  - name: quay.io/argoproj/argocd
    newName: dhi.io/argocd
    newTag: 3.5.5@sha256:9ed884c992475a8fd54481b2397dab61d91087347d989874aa7f151b3615b131
  - name: ghcr.io/dexidp/dex
    newName: dhi.io/dex
    newTag: 2.46.0@sha256:f94c16a265805cf4930e5e0a4147dd241e9613c2a1d6906d6acc2ebf175a99b7
  - name: public.ecr.aws/docker/library/redis
    newName: dhi.io/redis
    newTag: 8.10.2-compat@sha256:7bf48b41126564e60144ce958a9d318b963227f47bf516db66c7ecfc43350d07

patches:
  - path: argocd-cm.yaml
    target:
      kind: ConfigMap
      name: argocd-cm
  - path: argocd-cmd-params-cm.yaml
    target:
      kind: ConfigMap
      name: argocd-cmd-params-cm
  - path: argocd-rbac-cm.yaml
    target:
      kind: ConfigMap
      name: argocd-rbac-cm
  - path: repo-server-patch.yaml
    target:
      kind: Deployment
      name: argocd-repo-server
  - path: server-patch.yaml
    target:
      kind: Deployment
      name: argocd-server
  - path: controllers-affinity-patch.yaml
