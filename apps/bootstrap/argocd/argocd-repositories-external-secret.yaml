apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kerrlab-k8s
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-store
  target:
    name: kerrlab-k8s
    creationPolicy: Owner
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
  data:
    - secretKey: password
      remoteRef:
        key: argocd/repositories/kerrlab-k8s
        property: GITHUB_TOKEN
    - secretKey: project
      remoteRef:
        key: argocd/repositories/kerrlab-k8s
        property: project
    - secretKey: url
      remoteRef:
        key: argocd/repositories/kerrlab-k8s
        property: url
    - secretKey: username
      remoteRef:
        key: argocd/repositories/kerrlab-k8s
        property: username