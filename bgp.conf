# default to using syslog. /etc/rsyslog.d/45-frr.conf places the log in
# /var/log/frr/frr.log
#
# Note:
# FRR's configuration shell, vtysh, dynamically edits the live, in-memory
# configuration while FRR is running. When instructed, vtysh will persist the
# live configuration to this file, overwriting its contents. If you want to
# avoid this, you can edit this file manually before starting FRR, or instruct
# vtysh to write configuration to a different file.
log syslog informational
#

! -*- bgp -*-
!
hostname $UDMP_HOSTNAME
frr defaults traditional
log file stdout
!
router bgp 65000
 bgp ebgp-requires-policy
 bgp router-id 10.10.1.1
 bgp log-neighbor-changes
 !
 ! --- IPv4 Peer Group ---
 neighbor CI_V4 peer-group
 neighbor CI_V4 remote-as 65512
 neighbor CI_V4 soft-reconfiguration inbound
 ! Same as apps/bootstrap/cilium/bgp.yaml: a dead node's routes go within 9 s
 neighbor CI_V4 timers 3 9
 neighbor CI_V4 timers connect 5
 !
 ! --- IPv6 Peer Group ---
 neighbor CI_V6 peer-group
 neighbor CI_V6 remote-as 65512
 neighbor CI_V6 soft-reconfiguration inbound
 ! Same as apps/bootstrap/cilium/bgp.yaml: a dead node's routes go within 9 s
 neighbor CI_V6 timers 3 9
 neighbor CI_V6 timers connect 5
 !
 ! Neighbors for Cilium IPv4
 neighbor 10.10.1.101 peer-group CI_V4
 neighbor 10.10.1.102 peer-group CI_V4
 neighbor 10.10.1.103 peer-group CI_V4
 neighbor 10.10.1.201 peer-group CI_V4
 !
 ! Neighbors for Cilium IPv6
 neighbor fd00:10:244::101 peer-group CI_V6
 neighbor fd00:10:244::102 peer-group CI_V6
 neighbor fd00:10:244::103 peer-group CI_V6
 neighbor fd00:10:244::201 peer-group CI_V6
 !
 address-family ipv4 unicast
  ! No ECMP: adding or removing a path rehashes about half of all flows onto other
  ! nodes, whose proxies reset them; one path moves flows only when it changes
  maximum-paths 1
  neighbor CI_V4 activate
  ! Accept only LoadBalancer host routes; the nodes import nothing, so send nothing
  neighbor CI_V4 route-map CILIUM-LB-IN in
  neighbor CI_V4 route-map DENY-ALL out
  ! Explicitly disable IPv4 on the IPv6 group
  no neighbor CI_V6 activate
 exit-address-family
 !
 address-family ipv6 unicast
  maximum-paths 1
  neighbor CI_V6 activate
  neighbor CI_V6 route-map CILIUM-LB-IN-V6 in
  neighbor CI_V6 route-map DENY-ALL out
  ! Explicitly disable IPv6 on the IPv4 group
  no neighbor CI_V4 activate
 exit-address-family
 !
! LoadBalancer pools (apps/bootstrap/cilium/ip-pools.yaml), host routes only: a node
! can't hijack other LAN addresses or inject a default route. Add new pools here.
ip prefix-list CILIUM-LB seq 10 permit 10.10.1.16/32
ip prefix-list CILIUM-LB seq 20 permit 10.10.1.17/32
ip prefix-list CILIUM-LB seq 30 permit 10.10.1.128/26 ge 32
ip prefix-list CILIUM-LB seq 40 permit 10.20.1.16/32
ip prefix-list CILIUM-LB seq 50 permit 10.20.1.17/32
ip prefix-list CILIUM-LB seq 60 permit 10.20.1.128/25 ge 32
!
ipv6 prefix-list CILIUM-LB-V6 seq 10 permit 2a00:1858:104b:8558::10/128
ipv6 prefix-list CILIUM-LB-V6 seq 20 permit 2a00:1858:104b:8558::/124 ge 128
!
route-map CILIUM-LB-IN permit 10
 match ip address prefix-list CILIUM-LB
!
route-map CILIUM-LB-IN-V6 permit 10
 match ipv6 address prefix-list CILIUM-LB-V6
!
route-map DENY-ALL deny 10
!
line vty
!